name: Test and Publish PyPi

# Dispatched by release-please.yml with the tag it just cut. The tests run on
# the checkout, the wheel and sdist are built, each is installed and used on
# its own (check-artifacts), and only then does publish upload them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, for example v0.5.1"
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Verify version detection
        id: version
        uses: ./.github/actions/verify-version
        with:
          expected-ref: ${{ github.event.inputs.ref }}

      - name: Remove old global config
        if: always()
        run: rm -rf "/home/$(whoami)/wic/" && rm -rf "/home/$(whoami)/.toil/"

      - name: Install sophios 🔧
        run: |
          pip install .[test]
      - name: Test with pytest
        run: |
          python -m pytest -k test_cwl_docker_extract
          python -m pytest -m "not skip_pypi_ci and not sanity" -k "not test_cwl_docker_extract" -vv

      - name: Build sophios
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
            name: sophios-wheels
            path: dist/*
            retention-days: 1

  check-artifacts:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Download Artifact
        uses: actions/download-artifact@v6
        with:
          name: sophios-wheels
          path: dist

      - name: Install and use the wheel and the sdist
        uses: ./.github/actions/check-artifacts
        with:
          dist: dist
          version: ${{ needs.package.outputs.version }}

  publish:
    needs: check-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Download Artifact
        uses: actions/download-artifact@v6
        with:
          name: sophios-wheels
          path: dist

      - name: Publish to PyPi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          twine upload dist/*
