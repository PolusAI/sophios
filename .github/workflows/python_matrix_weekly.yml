name: Python Matrix Weekly

# The Nextflow tests on every Python Sophios supports, on Ubuntu: the plain
# ones the package job runs on 3.11, and the ones that run Nextflow.

on:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextflow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Sophios
        run: pip install ".[test]"

      - name: Install pinned Nextflow
        env:
          NXF_VER: "26.10.5"
        run: |
          curl --fail --silent --show-error https://get.nextflow.io | bash
          install -m 0755 nextflow "${RUNNER_TEMP}/nextflow"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          NXF_ANSI_LOG=false "${RUNNER_TEMP}/nextflow" -version | grep 'version 26.10.5'

      - name: PyTest Nextflow
        timeout-minutes: 20
        env:
          NXF_ANSI_LOG: "false"
          NXF_OFFLINE: "true"
          NXF_VER: "26.10.5"
        run: pytest tests/core/nextflow -m "not nextflow_corpus"
