name: Publish REST API Docker

# Dispatched by release-please.yml with the tag it just cut, beside the PyPI
# publish of the same tag. The image is tagged with the release tag and
# reports the version setuptools-scm reads from it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, for example v0.7.0"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Verify version detection
        id: version
        uses: ./.github/actions/verify-version
        with:
          expected-ref: ${{ github.event.inputs.ref }}

      - name: Set up Docker Buildx 🐳
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publish Sophios Container 🐳
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile_ubuntu_REST
          build-args: |
            SOPHIOS_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: polusai/sophios-rest-api:${{ github.event.inputs.ref }}
