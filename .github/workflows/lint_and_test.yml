name: Lint And Test

on:
  workflow_dispatch:
    # Have to declare parameters here for those that will be sent through 'workflow-dispatch'
    # event in branch_dispatch.yml. Otherwise, there'll be github API errors:
    # '"message": "Unexpected inputs provided: ...",'
    inputs:
      event_type:
        description: An arbitrary string used to dispatch steps
        required: true
        type: string
      commit_message:
        description: The commit message
        required: true
        type: string
      sender_repo:
        description: The repository which initiated the workflow dispatch
        required: true
        type: string
      sender_repo_owner:
        description: The account name of the repository initiated the workflow dispatch
        required: true
        type: string
      wic_owner:
        description: The account name of the Sophios repository
        required: true
        type: string
      wic_ref:
        description: The branch name within the Sophios repository
        required: true
        type: string
      mm-workflows_owner:
        description: The account name of the mm-workflows repository
        required: true
        type: string
      mm-workflows_ref:
        description: The branch name within the mm-workflows repository
        required: true
        type: string
      image-workflows_owner:
        description: The account name of the image-workflows repository
        required: true
        type: string
      image-workflows_ref:
        description: The branch name within the image-workflows repository
        required: true
        type: string

# See https://github.com/orgs/community/discussions/15690
# For workflow_dispatch, the commit message, repo, and branch name are not displayed by default.
run-name: "${{ inputs.commit_message}} - ${{ inputs.sender_repo }} - ${{ inputs.wic_ref }}"

defaults:
  run:
    shell: bash -l {0} # Invoke bash in login mode, NOT interactive mode.
    # This will cause bash to look for the startup file ~/.bash_profile, NOT ~/.bashrc
    # This is important since conda init writes to ~/.bashrc

# https://docs.github.com/en/actions/learn-github-actions/understanding-github-actions#jobs
# Rather than use a single job with a linear pipeline of steps, you may be
# tempted to make each step into a separate job and specify the dependencies
# using the `needs` syntax for more parallelism.
# However, data cannot be shared between jobs because each job will be run on a
# different runner. Even on a self-hosted runner, the `needs` syntax does not
# guarantee that the data can be shared!

# Using if: always() allows all steps to run, while still properly reporting failure.
# See https://stackoverflow.com/questions/62045967/github-actions-is-there-a-way-to-continue-on-error-while-still-getting-correct

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  lint_and_test:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os }}-${{ github.ref }}-${{ inputs.sender_repo }}-${{ inputs.mm-workflows_ref}}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # NOTE: Due to 10X minute multiplier, do NOT run on macos-latest on every push!
        # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#minute-multipliers
        # Run on macos on a separate weekly schedule.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sophios
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.wic_owner }}/sophios
          ref: ${{ inputs.wic_ref }}
          path: sophios

      - name: Checkout biobb_adapters
        if: always()
        uses: actions/checkout@v5
        with:
          # NOTE: temporarily hardcode sameeul & master because we can only
          # have up to 10 input parameters for workflow_dispatch
          repository: vjaganat90/biobb_adapters
          ref: master
          path: biobb_adapters

      - name: Checkout mm-workflows
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.mm-workflows_owner }}/mm-workflows
          ref: ${{ inputs.mm-workflows_ref }}
          path: mm-workflows

      - name: Checkout image-workflows
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.image-workflows_owner }}/image-workflows
          ref: ${{ inputs.image-workflows_ref }}
          path: image-workflows

      # Completely moving away from pypy
      - name: Setup miniforge (linux, macos)
        if: runner.os != 'Windows'
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 24.7.1-2
          environment-file: sophios/install/system_deps.yml
          activate-environment: wic
          channels: conda-forge
          python-version: "3.11.*"

      - name: Setup miniforge (windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 24.7.1-2
          environment-file: sophios/install/system_deps_windows.yml
          activate-environment: wic
          channels: conda-forge
          python-version: "3.11.*"

      - name: ShellCheck Script Quality
        if: runner.os == 'Linux'
        # "SC1017 (error): Literal carriage return. Run script through tr -d '\r' ."
        run: shellcheck -e SC1017 $(find sophios/ -name "*.sh" -and -not -path "./3/*")

      - name: Install Sophios
        if: always()
        run: cd sophios/ && pip install -e ".[all_except_runner_src]"

      - name: Update Sophios Config
        if: always()
        run: cd sophios/ && python .github/update_sophios_config.py

      - name: Install Molecular Modeling Workflows
        if: always()
        # Also run mm-workflows command to generate
        # mm-workflows/autogenerated/schemas/config_schemas.json
        # NOTE: Use ".[test]" instead of ".[all_except_runner_src]"
        # We do not want or need to install the workflow_deps extra.
        # (Many of the packages conflict with pypy.)
        run: cd mm-workflows/ && pip install -e ".[test]" && mm-workflows --generate_schemas

      # Do the static analysis, type and style check first
      - name: MyPy Check Type Annotations
        if: runner.os == 'Linux'
        run: cd sophios/ && mypy src/ examples/ tests/ docs/cookbook/
        # NOTE: Do not use `mypy .` because then mypy will check both src/ and build/ causing:
        # src/sophios/__init__.py: error: Duplicate module named "wic"
        # (also at "./build/lib/sophios/__init__.py")

      - name: Import Boundaries
        if: runner.os == 'Linux'
        run: cd sophios/ && lint-imports

      - name: PyLint Check Code Quality
        if: runner.os == 'Linux'
        run: cd sophios/ && pylint src/ examples/**/*.py tests/
        # NOTE: See fail-under threshold in .pylintrc

      - name: PEP8 Code Formatting
        if: runner.os == 'Linux'
        id: autopep8
        run: cd sophios/ && autopep8 --exit-code --recursive --diff --max-line-length 120 examples/ src/ tests/
      - name: Fail if autopep8 made changes
        if: runner.os == 'Linux' && steps.autopep8.outputs.exit-code == 2
        run: exit 1


      - name: Generate Sophios Python API Workflows (*.py -> *.wic)
        if: always()
        run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_compile_python_workflows

      - name: Generate Sophios Validation Jsonschema
        if: always()
        run: cd sophios/ && sophios --generate_schemas

        # Please read docs/validation.md#Property-Based-Testing
        # This is essentially an integration test for all of the
        # Sophios Python API workflows as well as the Sophios Python API itself.
      - name: Validate sophios Python API Workflows (*.py -> *.wic)
        if: always()
        run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_validate_generated_python_workflows

      - name: Build Documentation
        if: runner.os == 'Linux'
        run: cd sophios/docs && make html

  # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252

      - name: PyTest CWL Embedding Independence
        if: always()
        run: cd sophios/ && pytest -k test_cwl_embedding_independence # --cov --cov-config=.coveragerc_serial
        # NOTE: This test MUST be run in serial! See is_isomorphic_with_timeout()
        timeout-minutes: 20 # backup timeout for windows

      # Two defect classes cwltool already catches -- a Sophios key written
      # into `in:`, and a promoted port carrying a tool-only `inputBinding` --
      # but only in run_workflows, behind a container pull. Measured at 21s
      # over the full corpus here, against the minutes that round trip costs.
      - name: PyTest Emitted CWL Residue
        if: always()
        run: cd sophios/ && pytest -k test_emitted_cwl_says_nothing_cwl_cannot_read
        timeout-minutes: 20 # backup timeout for windows

      - name: PyTest Inline Flags
        if: always()
        run: cd sophios/ && pytest tests/core/test_examples.py -k "test_embedding_keeps or test_flatten" # --cov --cov-config=.coveragerc_serial
        timeout-minutes: 20 # backup timeout for windows

      # Entry-point resolution and CI coverage. The core/contrib import boundary
      # is the Import Boundaries lint step.
      - name: PyTest Entry Points and CI Coverage
        if: always()
        run: cd sophios/ && pytest tests/core/test_entry_points.py tests/core/test_ci_coverage.py

      # The packaging lane runs `pytest -m "not skip_pypi_ci"`, so a test with
      # that marker runs only where a step names its file. This is that place,
      # filtered to exactly the complement so nothing here is run twice: these
      # files' unmarked tests are already covered by the packaging lane's
      # default collection. tests/core/test_ci_coverage.py fails if a
      # skip_pypi_ci test exists that no lane collects, which is how these came
      # to light — 26 of them had never executed anywhere.
      - name: PyTest Environment-Dependent
        if: always()
        timeout-minutes: 20
        run: cd sophios/ && pytest tests/core/test_predicates.py tests/core/test_leak_boundary.py tests/core/test_lang_version.py tests/core/test_lang_parser.py tests/core/test_hermeticity.py -m "skip_pypi_ci"

      # The oracle suite: the generators, the equivalence relation and the
      # suite's own hermeticity checks. Its own step, so a red build is
      # attributable to a zone without bisecting. It needs nothing this matrix
      # lacks: no plugins, no containers, no corpus.
      #
      # skip_pypi_ci excludes the per-stem `cwltool --validate` cases, for the
      # reason the contrib step gives below.
      - name: PyTest Oracle
        if: always()
        run: cd sophios/ && pytest tests/core/test_hermeticity.py tests/core/test_generators.py tests/core/test_equivalence.py tests/core/test_equivalences.py -m "not skip_pypi_ci"

      # The front end's opinion of the documents the
      # compiler manufactures. Its own step because a red build here means the
      # compiler emitted something the language refuses — a different fact from
      # a property failing, and one worth reading without bisecting. ~3s.
      - name: PyTest Manufactured Documents
        if: always()
        run: cd sophios/ && pytest tests/core/test_manufactured_documents.py

      # Phase contracts plus the composed
      # pipeline. It does not assert that a retired name has stayed retired --
      # a deleted symbol coming back is a review failure, and a test that
      # names one can only ever restate its own deletion.
      - name: PyTest IR Phases
        if: always()
        timeout-minutes: 30
        run: cd sophios/ && pytest tests/core/test_lower.py tests/core/test_emit.py tests/core/test_resolve.py tests/core/test_link.py tests/core/test_infer_phase.py tests/core/test_pipeline.py

      # The Python API surfaces that used to be example scripts nothing executed:
      # `search_paths_wic` reaches the corpus repositories and docs/tutorials,
      # and docs/tutorials holds no .py files, so the "Generate Sophios Python
      # API Workflows" step above never touched examples/. Compile-only — no
      # container, no runner, no network — and about a second in total.
      - name: PyTest Example Surfaces
        if: always()
        run: cd sophios/ && pytest tests/core/test_example_scripts.py

      # A plain CWL workflow under --allow_raw_cwl is handed to the runner as
      # it is. Twelve conformance workflows (tests/core/data/cwl-v1.2) and a
      # two-step one run in-process with cwltool, about five seconds; the
      # Windows leg skips those (needs_cwltool) and runs the rest.
      - name: PyTest Plain CWL
        if: always()
        run: cd sophios/ && pytest tests/core/test_plain_cwl.py

      # The fast contracts for the
      # weekly benchmark harness. Its own step because importing it imports
      # tests/core/wic_corpus.py, which reads the config and walks
      # search_paths_wic — so a corpus or config problem reds this step and not
      # the oracle's, which is hermetic by construction and says so.
      - name: PyTest Benchmark Harness
        if: always()
        run: cd sophios/ && pytest tests/core/test_benchmarks.py

      # Contrib surfaces (ICT, Workflow Builder, REST) run in core CI, but as
      # their own step, so a red build is attributable to a zone without
      # bisecting.
      #
      # skip_pypi_ci excludes the cases that shell out to a CWL runner against
      # pre-pulled Docker images. This matrix is GitHub-hosted and has no
      # cwl-docker-extract step, and windows-latest cannot run Linux containers
      # at all; those cases already run on the self-hosted runners in
      # run_workflows.yml, which do pre-pull.
      - name: PyTest Contrib Surfaces
        if: always()
        run: cd sophios/ && pytest tests/contrib -m "not skip_pypi_ci"

      - name: PyTest Scattering Scaling
        if: runner.os == 'Linux'
        # Avoid Windows and macOS due to 2X and 10X minute multipliers.
        # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#minute-multipliers
        # Also, cannot run on Windows (natively) yet
        run: cd sophios/ && pytest -k test_scattering_scaling

      # NOTE: The steps below are for repository_dispatch only. For all other steps, please insert above
      # this comment.

      # Need to store success value in environment variable, rather than using 'success()' in-line inside a run tag.
      # Otherwise: "The workflow is not valid. ... Unrecognized function: 'success'."
      # https://github.com/actions/runner/issues/834#issuecomment-889484016
      - name: The workflow has succeeded
        if: success()
        run: |
          echo 'workflow_success=true' >> "$GITHUB_ENV"

      # It is not clear from the documentation, but the 'success()' and 'failure()' functions
      # do not consider skipped steps. Specifically, the above 'success()' function will not
      # affect the 'failure()' function here.
      # https://docs.github.com/en/actions/learn-github-actions/expressions#status-check-function
      - name: The workflow has failed
        if: failure()
        run: |
          echo 'workflow_success=false' >> "$GITHUB_ENV"

      # See token.md
      - name: Generate a token
        if: always()
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # tibdex minted a token for the whole app installation; the official
          # action defaults to the current repository only. owner: restores
          # installation scope, which cross-repo branch dispatch requires.
          owner: ${{ github.repository_owner }}

      - name: Reply CI results to sender
        # In case of failure, we still need to return the failure status to the original repository.
        # Use 'always()' so this step runs even if there's a failure and use an internal if-statement
        # to only run this step only if the repository_dispatch sends the signal.
        # https://github.com/actions/runner/issues/834#issuecomment-907096707
        # Use inputs.sender_repo to reply the original sender.
        if: always()
        uses: ./sophios/.github/my_actions/reply_sender/ # Must start with ./
        with:
          github_repository: ${{ github.repository }}
          event_type: ${{ inputs.event_type }}
          sender_repo: ${{ inputs.sender_repo }}
          operating_system: ${{ matrix.os }}
          commit_message: ${{ inputs.commit_message }}
          mm_workflows_ref: ${{ inputs.mm-workflows_ref }}
          workflow_success: ${{ env.workflow_success }}
          access_token: ${{ steps.generate_token.outputs.token }}
