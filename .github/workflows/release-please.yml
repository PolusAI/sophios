name: Release Please

# release-please keeps a release pull request open on master. Merging it tags
# that merge commit vX.Y.Z on master, creates the GitHub release, and then
# publishes the same tag to PyPI and Docker Hub below. A tag pushed with
# GITHUB_TOKEN starts no other workflow, so both publishes are dispatched here.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-please:
    # Forks have no release tags and publish nothing.
    if: github.repository == 'PolusAI/sophios'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  trigger-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      matrix:
        workflow: [test_and_publish_pypi.yml, publish_rest_docker.yml]
    steps:
      - name: Publish the release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ matrix.workflow }}',
              ref: '${{ needs.release-please.outputs.tag_name }}',
              inputs: {
                ref: '${{ needs.release-please.outputs.tag_name }}'
              }
            })
