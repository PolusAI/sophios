name: Property Weekly

# The hermetic property suite, drawn far deeper than a push can afford. Every
# property's budget is `tests/core/budgets.py::budget(n)`, and this lane sets
# the one knob that multiplies all of them, SOPHIOS_PROPERTY_SCALE.
#
# Hermetic: every input is generated (workflows over tests/core/synthetic_tools.py),
# so nothing here needs a plugin checkout, a config, a container or the
# self-hosted runner. The nextflow-properties job alone installs Java and the
# pinned Nextflow, as Lint And Test does, and runs only the runtime properties.
# It replaces the weekly fuzz job, which sampled an
# environment-dependent schema that no longer exists.
#
# Each run draws fresh examples: the seed is the run id, recorded in the job
# summary, and a failure prints the falsifying example with the
# `@reproduce_failure` line that replays it. To replay a whole run locally:
#   SOPHIOS_PROPERTY_SCALE=<scale> pytest <files> --hypothesis-seed=<seed>

on:
  # push:  # Do NOT run the deep properties on every push!
  # pull_request: (either on origin or on upstream pull request)
  schedule:
    # Every Wednesday at midnight.
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Multiply every property budget by this (SOPHIOS_PROPERTY_SCALE)'
        required: false
        default: '20'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  properties:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-properties-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # On a laptop the oracle step takes about 2.5 minutes at scale 1 and 3.5
    # at scale 2; the fixed cost dominates, so scale 20 extrapolates to under
    # half an hour there. The ceilings leave room for a slower hosted runner.
    timeout-minutes: 240
    env:
      SOPHIOS_PROPERTY_SCALE: ${{ inputs.scale || '20' }}
      HYPOTHESIS_SEED: ${{ github.run_id }}

    steps:
      - name: Checkout sophios
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # cwltool is a core dependency, so this also provides the in-process
      # `--validate` the emit property calls. ubuntu-latest ships nodejs.
      - name: Install Sophios
        run: pip install ".[test]"

      - name: Record seed and scale
        run: |
          {
            echo "SHA: $(git rev-parse --short HEAD)"
            echo "Seed: $HYPOTHESIS_SEED (replay with --hypothesis-seed=$HYPOTHESIS_SEED)"
            echo "Scale: $SOPHIOS_PROPERTY_SCALE"
          } >> "$GITHUB_STEP_SUMMARY"

      # See run_workflows.yml: everything above is setup, and a failure there
      # stops the job; the suites below run when this one ran and the job was
      # not cancelled, so one failing suite does not hide the next.
      - name: Setup done
        id: setup
        run: 'true'

      # The oracle suite (tests/core/test_hermeticity.py::ORACLE_FILES) and the
      # phase properties beside it, slow ones included: the `--validate`
      # property is slow-marked, and deepening it is the point of this lane.
      # test_leak_boundary.py's other tests compile against a discovered
      # registry, so its five hermetic properties are named.
      - name: PyTest Oracle and Phase Properties
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 180
        run: >-
          pytest tests/core/test_generators.py tests/core/test_equivalence.py tests/core/test_equivalences.py tests/core/test_predicates.py tests/core/test_reference_compatibility.py tests/core/test_canonical_path.py tests/core/test_emit.py tests/core/test_resolve.py tests/core/test_link.py tests/core/test_infer_phase.py tests/core/test_names_emitted.py tests/core/test_edge_binding.py tests/core/test_lower.py tests/core/test_pipeline.py
          tests/core/test_leak_boundary.py::test_step_passthrough_is_byte_identical
          tests/core/test_leak_boundary.py::test_top_level_passthrough_is_byte_identical
          tests/core/test_leak_boundary.py::test_hints_survive_on_the_document_and_the_step_and_change_nothing_else
          tests/core/test_leak_boundary.py::test_unknown_keys_change_nothing_else
          tests/core/test_leak_boundary.py::test_no_key_lands_on_both_sides
          --hypothesis-seed="$HYPOTHESIS_SEED" --junitxml=property-reports/oracle.xml

      # The language layer's properties. Its skip_pypi_ci tests compile against
      # a discovered registry, which this lane does not have; lint_and_test
      # runs them. test_diagnostics.py's other tests discover, so its two
      # properties are named.
      - name: PyTest Language Properties
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 30
        run: >-
          pytest tests/core/test_lang_parser.py tests/core/test_lang_render.py tests/core/test_lang_schema.py
          tests/core/test_lang_version.py
          tests/core/test_diagnostics.py::test_a_step_id_outside_the_allowed_characters_is_refused_at_its_line
          tests/core/test_diagnostics.py::test_a_diagnostic_is_one_json_object_it_can_be_rebuilt_from
          -m "not skip_pypi_ci" --hypothesis-seed="$HYPOTHESIS_SEED" --junitxml=property-reports/language.xml

      # The Python API's and the runners' properties. Where a file's other
      # tests discover or run a runner, its properties are named.
      - name: PyTest API and Runtime Properties
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 30
        run: >-
          pytest tests/core/test_input_output.py tests/core/test_runtime_inputs.py tests/core/test_python_api_tool_builder.py
          tests/core/test_python_api_inference.py::test_an_inference_is_refused_at_construction_or_keeps_what_it_was_given
          tests/core/test_python_api_workflow.py::test_python_api_uses_the_conservative_language_judgment
          tests/core/test_python_api_workflow.py::test_a_diagnostic_names_the_python_line_that_made_its_object
          tests/core/test_python_api_workflow.py::test_a_built_tool_is_one_step_through_every_door
          tests/core/test_realtime.py::test_a_declaration_is_returned_instead_of_emitted_or_is_wic044_at_each_port
          tests/core/test_backends.py::test_each_cwl_runner_reads_its_command_line_as_the_request_says
          tests/core/test_backends.py::test_failed_steps_are_read_from_the_runners_log_lines
          tests/core/test_backends.py::test_toil_writes_the_output_object_it_printed_last_and_no_other
          tests/core/test_backends.py::test_failed_nextflow_processes_are_read_from_its_log_lines
          tests/core/test_compute.py::test_the_request_carries_the_compiled_workflow_and_every_path_as_written
          tests/core/test_compute.py::test_a_run_id_is_the_workflow_name_the_time_and_four_hex_digits_within_the_services_rule
          tests/core/test_plugins.py::test_every_image_the_runner_pulls_gets_the_noentrypoint_tag
          tests/contrib/test_rest_api.py::test_wfb_to_wic_keeps_settings_as_sent
          --hypothesis-seed="$HYPOTHESIS_SEED" --junitxml=property-reports/api-runtime.xml

      # The Nextflow target's compile-side properties: lowering, the executable
      # model, rendering and reading a pipeline back. Runs under Nextflow are
      # Lint And Test's, which installs it.
      - name: PyTest Nextflow Target Properties
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 30
        run: pytest tests/core/nextflow/test_properties.py tests/core/nextflow/test_executable_ir.py tests/core/nextflow/test_lowering.py tests/core/nextflow/test_import.py --hypothesis-seed="$HYPOTHESIS_SEED" --junitxml=property-reports/nextflow.xml

      - name: Upload pytest reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: property-weekly-reports
          path: property-reports/
          retention-days: 30

  # The runtime properties need Java and the pinned Nextflow. Lint And Test keeps
  # running them at scale 1 on every pull request.
  nextflow-properties:
    concurrency:
      group: ${{ github.workflow }}-nextflow-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOPHIOS_PROPERTY_SCALE: ${{ inputs.scale || '20' }}
      HYPOTHESIS_SEED: ${{ github.run_id }}
      NXF_ANSI_LOG: 'false'
      NXF_OFFLINE: 'true'
      NXF_VER: '26.10.5'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Sophios
        run: pip install ".[test]"

      - name: Install pinned Nextflow
        run: |
          curl --fail --silent --show-error https://get.nextflow.io | bash
          install -m 0755 nextflow "${RUNNER_TEMP}/nextflow"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Verify pinned runtime
        run: nextflow -version | grep 'version 26.10.5'

      - name: PyTest Nextflow Runtime Properties
        run: >-
          pytest
          tests/core/nextflow/test_runtime.py::test_a_command_receives_the_arguments_cwltool_gives_it
          tests/core/nextflow/test_runtime.py::test_a_scatter_records_what_cwl_defines_for_its_method
          tests/core/nextflow/test_runtime.py::test_a_staged_path_reaches_its_task_whole_and_in_order
          tests/core/nextflow/test_runtime.py::test_a_captured_text_is_the_files_utf8_up_to_the_cwl_limit
          tests/core/nextflow/test_subset_differential.py::test_a_when_decides_as_javascript_does
          --hypothesis-seed="$HYPOTHESIS_SEED" --junitxml=property-reports/nextflow-runtime.xml

      - name: Upload pytest reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: property-weekly-nextflow-reports
          path: property-reports/
          retention-days: 30
