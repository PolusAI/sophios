name: Build and Test Wheel

# The build the release makes, on every pull request: the tests, the wheel and
# sdist, and each of them installed and used on its own (check-artifacts).
on:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Verify version detection
        id: version
        uses: ./.github/actions/verify-version

      - name: Install sophios 🔧
        run: |
          pip install .[test]
      # The tests marked package and the Nextflow tests that do not run
      # Nextflow: no other pull-request lane runs them.
      - name: Test with pytest
        run: |
          python -m pytest -m "package and not nextflow and not skip_pypi_ci" -vv
          python -m pytest tests/core/nextflow -m "not nextflow and not nextflow_corpus and not skip_pypi_ci" -vv

      - name: Build sophios
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
            name: sophios-wheels
            path: dist/*
            retention-days: 1

  check-artifacts:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Download Artifact
        uses: actions/download-artifact@v6
        with:
          name: sophios-wheels
          path: dist

      - name: Install and use the wheel and the sdist
        uses: ./.github/actions/check-artifacts
        with:
          dist: dist
          version: ${{ needs.package.outputs.version }}
