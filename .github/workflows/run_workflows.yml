name: Run Workflows

on:
  workflow_dispatch:
    # Have to declare parameters here for those that will be sent through 'workflow-dispatch'
    # event in branch_dispatch.yml. Otherwise, there'll be github API errors:
    # '"message": "Unexpected inputs provided: ...",'
    inputs:
      event_type:
        description: An arbitrary string used to dispatch steps
        required: true
        type: string
      commit_message:
        description: The commit message
        required: true
        type: string
      sender_repo:
        description: The repository which initiated the workflow dispatch
        required: true
        type: string
      sender_repo_owner:
        description: The account name of the repository initiated the workflow dispatch
        required: true
        type: string
      wic_owner:
        description: The account name of the Sophios repository
        required: true
        type: string
      wic_ref:
        description: The branch name within the Sophios repository
        required: true
        type: string
      mm-workflows_owner:
        description: The account name of the mm-workflows repository
        required: true
        type: string
      mm-workflows_ref:
        description: The branch name within the mm-workflows repository
        required: true
        type: string
      image-workflows_owner:
        description: The account name of the image-workflows repository
        required: true
        type: string
      image-workflows_ref:
        description: The branch name within the image-workflows repository
        required: true
        type: string

# A dispatched run is not attached to the branch it tests, so its name says which
# sophios, mm-workflows and image-workflows refs ran together. The inputs carry refs,
# not commits: the "Name what this run tests" step below adds the commits to the summary.
run-name: "${{ inputs.commit_message || 'unknown' }} - ${{ inputs.sender_repo || 'unknown' }} - sophios ${{ inputs.wic_owner || 'unknown' }}/${{ inputs.wic_ref || 'unknown' }} - mm-workflows ${{ inputs.mm-workflows_owner || 'unknown' }}/${{ inputs.mm-workflows_ref || 'unknown' }} - image-workflows ${{ inputs.image-workflows_owner || 'unknown' }}/${{ inputs.image-workflows_ref || 'unknown' }}"

defaults:
  run:
    shell: bash -l {0} # Invoke bash in login mode, NOT interactive mode.
    # This will cause bash to look for the startup file ~/.bash_profile, NOT ~/.bashrc
    # This is important since conda init writes to ~/.bashrc

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  run_workflows:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-cwltool-${{ github.ref }}-${{ inputs.sender_repo }}-${{ inputs.mm-workflows_ref}}
      cancel-in-progress: true
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout sophios
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.wic_owner }}/sophios
        ref: ${{ inputs.wic_ref }}
        path: sophios

    - name: Checkout biobb_adapters
      if: always()
      uses: actions/checkout@v5
      with:
        # NOTE: temporarily hardcode sameeul & master because we can only
        # have up to 10 input parameters for workflow_dispatch...
        repository: vjaganat90/biobb_adapters
        ref: master
        path: biobb_adapters

    - name: Checkout mm-workflows
      if: always()
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.mm-workflows_owner }}/mm-workflows
        ref: ${{ inputs.mm-workflows_ref }}
        path: mm-workflows

    - name: Checkout image-workflows
      if: always()
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.image-workflows_owner }}/image-workflows
        ref: ${{ inputs.image-workflows_ref }}
        path: image-workflows

    # The run page shows the dispatched sha, which may be master's; the summary
    # names what was checked out. Inputs go through env, never into the script.
    - name: Name what this run tests
      if: always()
      env:
        SOPHIOS: ${{ inputs.wic_owner || 'unknown' }}/sophios@${{ inputs.wic_ref || 'unknown' }}
        MM_WORKFLOWS: ${{ inputs.mm-workflows_owner || 'unknown' }}/mm-workflows@${{ inputs.mm-workflows_ref || 'unknown' }}
        IMAGE_WORKFLOWS: ${{ inputs.image-workflows_owner || 'unknown' }}/image-workflows@${{ inputs.image-workflows_ref || 'unknown' }}
      run: |
        sophios_sha=$(git -C sophios rev-parse --short=7 HEAD 2>/dev/null || echo unknown)
        mm_workflows_sha=$(git -C mm-workflows rev-parse --short=7 HEAD 2>/dev/null || echo unknown)
        image_workflows_sha=$(git -C image-workflows rev-parse --short=7 HEAD 2>/dev/null || echo unknown)
        {
          echo '| checked out | commit |'
          echo '|---|---|'
          echo "| $SOPHIOS | $sophios_sha |"
          echo "| $MM_WORKFLOWS | $mm_workflows_sha |"
          echo "| $IMAGE_WORKFLOWS | $image_workflows_sha |"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Remove old global config
      if: always()
      run: rm -rf "/home/$(whoami)/wic/" && rm -rf "/home/$(whoami)/.toil/"
      # For self-hosted runners, make sure we use new global config settings


    - name: Remove old mamba environment
      if: always()
      run: rm -rf "/home/$(whoami)/miniconda3/envs/wic_github_actions/"
      # For self-hosted runners, make sure we install into a new mamba environment

    - name: Setup miniforge (linux, macos)
      if: always()
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        miniforge-variant: Miniforge3
        miniforge-version: 24.7.1-2
        environment-file: sophios/install/system_deps.yml
        activate-environment: wic_github_actions
        channels: conda-forge
        python-version: "3.11.*"

    # - name: Docker pull
    #   if: always()
    #   run: cd mm-workflows/ && ./dockerPull.sh
    #   # For self-hosted runners, make sure the docker cache is up-to-date.

    - name: Install Sophios
      if: always()
      run: cd sophios/ && pip install -e ".[all_except_runner_src]"

    - name: Update Sophios Config
      if: always()
      run: cd sophios/ && python .github/update_sophios_config.py

    - name: Install Molecular Modeling Workflows
      if: always()
      # Also run mm-workflows command to generate
      # mm-workflows/autogenerated/schemas/config_schemas.json
      # NOTE: Use ".[test]" instead of ".[all_except_runner_src]"
      # We do not want or need to install the workflow_deps extra.
      # (Many of the packages conflict with pypy.)
      run: cd mm-workflows/ && pip install -e ".[test]" && mm-workflows --generate_schemas

    - name: Configure pytest worker count
      if: always()
      run: |
        PYTEST_WORKERS="$(python - <<'PY'
        import os

        cpu_count = os.cpu_count() or 8
        print(max(8, min(16, cpu_count - 2)))
        PY
        )"
        echo "PYTEST_WORKERS=${PYTEST_WORKERS}" >> "$GITHUB_ENV"

    - name: Generate Sophios Python API Workflows (*.py -> *.wic)
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_compile_python_workflows

    - name: Generate Sophios Validation Jsonschema
      if: always()
      run: cd sophios/ && sophios --generate_schemas

      # Please read docs/validation.md#Property-Based-Testing
      # This is essentially an integration test for all of the
      # WIC Python API workflows as well as the WIC Python API itself.
    - name: Validate Sophios Python API Workflows (*.py -> *.wic)
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_validate_generated_python_workflows

    - name: cwl-docker-extract (i.e. recursively docker pull)
      if: always()
      run: cd sophios/ && pytest tests/core/test_examples.py -k test_cwl_docker_extract
      # For self-hosted runners, make sure the docker cache is up-to-date.

    - name: PyTest Tool Builder
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_tool_builder.py

    - name: PyTest Python API
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k "not test_compile_python_workflows and not test_validate_generated_python_workflows"

    # Workflow.from_wic and write_wic over every .wic root the config reaches.
    # Only here does the config reach the mm-workflows and image-workflows
    # roots: the packaging lane, which also selects this file, checks out
    # neither, so a round trip that breaks on those roots alone was green.
    - name: PyTest Python API from .wic (corpus round trip)
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_from_wic.py

    - name: PyTest Run REST Core Tests
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest tests/contrib/test_rest_api.py -k test_rest_core --cwl_runner cwltool

    - name: PyTest Run REST WFB Tests
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest tests/contrib/test_rest_api.py -k test_rest_wfb --cwl_runner cwltool

    - name: PyTest Run ICT to CLT conversion Tests
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest tests/contrib/test_ict_to_clt_conversion.py -k test_ict_to_clt

    - name: PyTest Run update wfb payload Tests
      if: always()
      run: cd sophios/ && pytest tests/contrib/test_fix_payload.py -k test_fix

    - name: PyTest Run Workflows
      if: always()
      run: cd sophios/ && pytest tests/core/test_examples.py -k test_run_workflows_on_push --workers "${PYTEST_WORKERS}" --cwl_runner cwltool # --cov

    # test_run_partial_failures_pass is skip_pypi_ci, so the packaging lane
    # excludes it, and every other invocation of this file selects a different
    # -k — it ran nowhere. Its sibling test_run_partial_failures_fail_without_flag
    # carries no marker and is already covered by default collection.
    - name: PyTest Run Partial Failures
      if: always()
      run: cd sophios/ && pytest tests/core/test_examples.py -k test_run_partial_failures_pass --cwl_runner cwltool

    # NOTE: The steps below are for repository_dispatch only. For all other steps, please insert above
    # this comment.

    # Need to store success value in environment variable, rather than using 'success()' in-line inside a run tag.
    # Otherwise: "The workflow is not valid. ... Unrecognized function: 'success'."
    # https://github.com/actions/runner/issues/834#issuecomment-889484016
    - name: The workflow has succeeded
      if: ${{ success() }}
      run: |
        echo 'workflow_success=true' >> "$GITHUB_ENV"

    # It is not clear from the documentation, but the 'success()' and 'failure()' functions
    # do not consider skipped steps. Specifically, the above 'success()' function will not
    # affect the 'failure()' function here.
    # https://docs.github.com/en/actions/learn-github-actions/expressions#status-check-function
    - name: The workflow has failed
      if: ${{ failure() }}
      run: |
        echo 'workflow_success=false' >> "$GITHUB_ENV"

    # See token.md
    - name: Generate a token
      if: always()
      id: generate_token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        # tibdex minted a token for the whole app installation; the official
        # action defaults to the current repository only. owner: restores
        # installation scope, which cross-repo branch dispatch requires.
        owner: ${{ github.repository_owner }}

    - name: Reply CI results to sender
      # In case of failure, we still need to return the failure status to the original repository.
      # Use 'always()' so this step runs even if there's a failure and use the bash if-statement
      # to only run this step only if the repository_dispatch sends the signal.
      # https://github.com/actions/runner/issues/834#issuecomment-907096707
      # Use inputs.sender_repo to reply the original sender.
      if: always()
      uses: ./sophios/.github/my_actions/reply_sender/ # Must start with ./
      with:
        github_repository: ${{ github.repository }}
        event_type: ${{ inputs.event_type }}
        sender_repo: ${{ inputs.sender_repo }}
        operating_system: self-hosted-linux
        commit_message: ${{ inputs.commit_message }}
        mm_workflows_ref: ${{ inputs.mm-workflows_ref }}
        workflow_success: ${{ env.workflow_success }}
        access_token: ${{ steps.generate_token.outputs.token }}
