name: Benchmarks

# Compile-cost cases, run weekly on the self-hosted runner. This is a trend,
# not a gate: it never fails the build (see tests/core/benchmarks.py and
# design_docs/core-refactor-design.md §6.3). It runs on a schedule rather than
# on every push for the same reason fuzzy_compile_weekly.yml does: the numbers
# only mean anything compared week over week on one consistent runner.

on:
  # push:  # Do NOT run benchmarks on every push!
  # pull_request: (either on origin or on upstream pull request)
  schedule:
    # Friday, not fuzzy_compile_weekly's Wednesday, so the two weekly jobs
    # do not contend for the one self-hosted runner.
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      prove_non_gating:
        description: 'Run a deliberately failing case to show the job stays green'
        required: false
        default: 'false'

defaults:
  run:
    shell: bash -l {0} # Invoke bash in login mode, NOT interactive mode.
    # This will cause bash to look for the startup file ~/.bash_profile, NOT ~/.bashrc
    # This is important since conda init writes to ~/.bashrc

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  benchmarks:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-benchmarks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout sophios
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/sophios
          path: sophios

      - name: Checkout biobb_adapters
        if: always()
        uses: actions/checkout@v5
        with:
          repository: vjaganat90/biobb_adapters
          ref: master
          path: biobb_adapters

      - name: Checkout mm-workflows
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/mm-workflows
          path: mm-workflows

      - name: Checkout image-workflows
        if: always()
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/image-workflows
          path: image-workflows

      - name: Setup miniforge (linux, macos)
        if: runner.os != 'Windows'
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 24.7.1-2
          environment-file: sophios/install/system_deps.yml
          activate-environment: wic
          channels: conda-forge
          python-version: "3.11.*"

      - name: Install Sophios
        if: always()
        run: cd sophios/ && pip install ".[all_except_runner_src]"

      - name: Update Sophios Config
        if: always()
        run: cd sophios/ && python .github/update_sophios_config.py

      - name: Install Molecular Modeling Workflows
        if: always()
        # Also run mm-workflows command to generate
        # mm-workflows/autogenerated/schemas/config_schemas.json
        # NOTE: Use ".[test]" instead of ".[all_except_runner_src]"
        # We do not want or need to install the workflow_deps extra.
        # (Many of the packages conflict with pypy.)
        run: cd mm-workflows/ && pip install ".[test]" && mm-workflows --generate_schemas

      - name: Generate Sophios Validation Jsonschema
        if: always()
        run: cd sophios/ && sophios --generate_schemas

      - name: Generate Sophios Python API Workflows (*.py -> *.wic)
        if: always()
        run: cd sophios/ && pytest tests/core/test_python_api.py -k test_compile_python_workflows

      - name: Prove the job stays green (dispatch-only)
        if: inputs.prove_non_gating == 'true'
        # Not a real case failing — a whole step failing, deliberately, to
        # demonstrate the claim on demand rather than merely asserting it: a
        # guard nobody has seen fire is a guard whose green means nothing.
        continue-on-error: true
        run: exit 1

      - name: Run benchmarks
        id: benchmarks
        # `pipefail` carries Python's status across `tee`; `|| true` keeps a
        # case-runner failure green. `continue-on-error` also covers failures
        # before that pipeline. This job is a trend, not a gate — see §6.3.
        continue-on-error: true
        timeout-minutes: 60
        run: |
          cd sophios/
          {
            echo "SHA: $(git rev-parse --short HEAD)"
            echo "Runner: ${{ runner.name }} (${{ runner.os }})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python tests/core/benchmarks.py | tee -a "$GITHUB_STEP_SUMMARY" || true
