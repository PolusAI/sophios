name: Benchmarks

# Compile-cost cases, run weekly on the self-hosted runner. The timings are a
# trend, so no number fails the run; a case that raises does (see
# tests/core/benchmarks.py). It runs on a schedule rather than on every push
# because the numbers only mean anything compared week over week on one
# consistent runner.

on:
  # push:  # Do NOT run benchmarks on every push!
  # pull_request: (either on origin or on upstream pull request)
  schedule:
    # Friday, on the self-hosted runner, which no other weekly job contends
    # for on that day.
    - cron: '0 0 * * 5'
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0} # Invoke bash in login mode, NOT interactive mode.
    # This will cause bash to look for the startup file ~/.bash_profile, NOT ~/.bashrc
    # This is important since conda init writes to ~/.bashrc

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  benchmarks:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-benchmarks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout sophios
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/sophios
          path: sophios

      - name: Checkout biobb_adapters
        uses: actions/checkout@v5
        with:
          repository: vjaganat90/biobb_adapters
          ref: master
          path: biobb_adapters

      - name: Checkout mm-workflows
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/mm-workflows
          path: mm-workflows

      - name: Checkout image-workflows
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/image-workflows
          path: image-workflows

      - name: Remove old mamba environment and packages
        # Every job installs fresh on this self-hosted runner, whatever the job
        # before it left: no environment and no downloaded or unpacked package.
        run: rm -rf "/home/$(whoami)/miniconda3/envs/wic/" "/home/$(whoami)/conda_pkgs_dir/"

      - name: Setup miniforge (linux, macos)
        if: runner.os != 'Windows'
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 24.7.1-2
          environment-file: sophios/install/system_deps_ci.yml
          activate-environment: wic
          channels: conda-forge
          python-version: "3.11.*"
          # Its post step moves the unpacked packages aside (2 min here), and only
          # after a green job; the step above deletes them before every job instead.
          run-post: false

      - name: Install Sophios
        run: cd sophios/ && pip install ".[all_except_runner_src]"

      - name: Update Sophios Config
        run: cd sophios/ && python .github/update_sophios_config.py

      - name: Install Molecular Modeling Workflows
        # Also run mm-workflows command to generate
        # mm-workflows/autogenerated/schemas/config_schemas.json
        # NOTE: Use ".[test]" instead of ".[all_except_runner_src]"
        # We do not want or need to install the workflow_deps extra.
        # (Many of the packages conflict with pypy.)
        run: cd mm-workflows/ && pip install ".[test]" && mm-workflows --generate_schemas

      # See run_workflows.yml: everything above is setup, and a failure there
      # stops the job; the steps below run when this one ran and the job was
      # not cancelled.
      - name: Setup done
        id: setup
        run: 'true'

      - name: Generate Sophios Validation Jsonschema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd sophios/ && sophios --generate_schemas

      - name: Generate Sophios Python API Workflows (*.py -> *.wic)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Corpus preparation: the corpus cases compile the *.wic files it writes.
        run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_compile_python_workflows

      - name: Run benchmarks
        id: benchmarks
        # Gated on setup, not on the corpus preparation above: the table is
        # still written when that step fails.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # `pipefail` carries Python's status across `tee`: a case that raised
        # fails the step once the whole table is written.
        timeout-minutes: 60
        run: |
          cd sophios/
          {
            echo "SHA: $(git rev-parse --short HEAD)"
            echo "Runner: ${{ runner.name }} (${{ runner.os }})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python tests/core/benchmarks.py | tee -a "$GITHUB_STEP_SUMMARY"
