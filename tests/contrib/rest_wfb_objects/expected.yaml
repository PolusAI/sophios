# What the REST API returns for each payload, compiled in a directory holding s.sh: the steps of the workflow, in
# order, and for some what a step's tool holds or what the compile said. multi_node_inline_cwl.json+declaration.json
# is that payload with the declaring node and link of declaration.json added. Of multi_node_wfb.json it also states
# the inputs its edges fill, by node, each with the output that feeds it.
single_node.json: {steps: {keys: [one]}}
single_node_bbbc_download.json:
  why: a blank pluginId names the step for its node
  steps: {keys: [bbbcdownload]}
bbbc_download_wfb.json: {steps: {keys: [vjaganat90_bbbc-download-plugin]}}
multi_node.json: {steps: {keys: [touch, append@2, append@3]}}
multi_node_inline_cwl.json: {steps: {keys: [touch, append@2, append@3]}}
multi_node_inline_cwl.json+declaration.json:
  why: a declared real-time analysis is taken out of the workflow, the steps numbered as written; nothing runs it
  steps: {keys: [touch, append@2, append@4]}
  said: Real-time analysis runs only with --run_local; the returned workflow has no step for touch
packed.json:
  why: an inline tool that includes a file is returned with the file's text, read where the request is compiled
  steps: {say: {run: {requirements: [{class: InitialWorkDirRequirement,
                                      listing: [{entryname: s.sh, entry: "#!/bin/sh\necho from-include\n"}]}]}}}
multi_node_wfb.json:
  steps: {keys: [polusai_FileRenaming, polusai_OMEConverter, polusai_Montage, polusai_ImageAssembler,
                 polusai_PrecomputeSlideViewer]}
  filled: {1: {inpDir: filerenaming_3-outDir}, 3: {inpDir: omeconverter_2-outDir},
           4: {stitchPath: montage_4-outDir, imgPath: omeconverter_2-outDir}, 5: {inpDir: imageassembler_5-outDir}}
