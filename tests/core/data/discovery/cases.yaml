# Which file each plugin stem resolves to; see README.md.
- id: sorted-path-order
  why: Tools come back ordered by path, not by stem and not by the order the filesystem lists them (get_tools_cwl).
  files: [b/zeta, c/mid, a/alpha]
  found: {global: {alpha: a/alpha, zeta: b/zeta, mid: c/mid}}
- id: autogenerated-below-a-root
  why: autogenerated/ is the compiler's own output, at the top of a search root or nested below it
    (_discoverable_paths).
  files: [a/alpha, autogenerated/ghost, x/autogenerated/y/ghost2]
  found: {global: {alpha: a/alpha}}
- id: a-root-under-autogenerated
  why: Only the part of a path below its search root is checked for autogenerated/ (_discoverable_paths).
  kinds: [tool, workflow]
  roots: {global: [autogenerated/adapters]}
  files: [autogenerated/adapters/a/alpha, autogenerated/adapters/autogenerated/ghost]
  found: {global: {alpha: autogenerated/adapters/a/alpha}}
- id: the-last-of-three-wins
  why: Every file that defines the stem is named on stderr, with the one used, the last found; a stem defined once is
    never named; stdout stays clean (get_tools_cwl).
  files: [a/twin, b/twin, c/twin, a/single]
  found: {global: {single: a/single, twin: c/twin}}
  warnings: {global: {twin: [a/twin, b/twin, c/twin]}}
- id: a-warning-per-repeated-stem
  why: Discovery reads everything, then says so once per repeated stem (_warn_duplicates).
  files: [a/pair, b/pair, a/twin, b/twin]
  found: {global: {pair: b/pair, twin: b/twin}}
  warnings: {global: {pair: [a/pair, b/pair], twin: [a/twin, b/twin]}}
- id: twice-in-one-root-then-another-root
  why: &waits The warning waits for the last search path; it is not repeated, and it names every file (get_tools_cwl).
  kinds: [tool, workflow]
  roots: {global: [r0, r1]}
  files: [r0/a/twin, r0/b/twin, r1/other]
  found: {global: {twin: r0/b/twin, other: r1/other}}
  warnings: {global: {twin: [r0/a/twin, r0/b/twin]}}
- id: across-two-roots-then-a-third
  why: *waits
  kinds: [tool, workflow]
  roots: {global: [r0, r1, r2]}
  files: [r0/twin, r1/twin, r2/other]
  found: {global: {twin: r1/twin, other: r2/other}}
  warnings: {global: {twin: [r0/twin, r1/twin]}}
- id: twice-in-one-root-then-another-namespace
  why: *waits
  kinds: [tool, workflow]
  roots: {global: [r0], gpu: [r1]}
  files: [r0/a/twin, r0/b/twin, r1/other]
  found: {global: {twin: r0/b/twin}, gpu: {other: r1/other}}
  warnings: {global: {twin: [r0/a/twin, r0/b/twin]}}
- id: a-later-search-path-overrides-an-earlier-one
  why: Search paths are taken in the order the config lists them, whatever their names sort to (get_tools_cwl).
  kinds: [tool, workflow]
  roots: {global: [z_stock, a_mine]}
  files: [z_stock/twin, a_mine/twin]
  found: {global: {twin: a_mine/twin}}
  warnings: {global: {twin: [z_stock/twin, a_mine/twin]}}
- id: one-stem-in-two-namespaces
  why: Namespaces keep their own stems, so the same stem in two of them is two definitions and no warning
    (get_tools_cwl).
  kinds: [tool, workflow]
  roots: {global: [a], gpu: [b]}
  files: [a/twin, b/twin]
  found: {global: {twin: a/twin}, gpu: {twin: b/twin}}
- id: deprecated-md-adapters
  why: biobb_md is deprecated in favor of biobb_gromacs; its tools are skipped, so a shared stem is no duplicate. The
    skip matches the substring on the whole path, so no case id may reach the layout's path (get_tools_cwl).
  files: [biobb_gromacs/grompp, biobb_md/grompp, biobb_md/only_here]
  found: {global: {grompp: biobb_gromacs/grompp}}
- id: overlapping-roots-find-one-file
  why: A root and its own subdirectory both find a/one; that is one tool and no duplicate (_record).
  roots: {global: ['', a]}
  files: [a/one]
  found: {global: {one: a/one}}
- id: a-symlinked-root-finds-one-file
  why: The same directory under two names is one set of files, found at its last visit (_record).
  roots: {global: [real, link]}
  links: {link: real}
  files: [real/one]
  found: {global: {one: link/one}}
- id: overlapping-roots-name-the-file-used
  why: sub/twin is found last, by the root after the subdirectory; the warning lists it once and names it (_record).
  roots: {global: [sub, '']}
  files: [a/twin, sub/twin]
  found: {global: {twin: sub/twin}}
  warnings: {global: {twin: [a/twin, sub/twin]}}
- id: inputs-files-and-the-compilers-output
  why: _inputs files and anything under autogenerated/ are not workflows (get_workflow_paths).
  kinds: [workflow]
  files: [b/z, a/a, autogenerated/g, a/a_inputs]
  found: {global: {a: a/a, z: b/z}}
- id: the-last-workflow-in-sorted-path-order
  why: Of two workflows with one stem in one search root, the last path in sorted order wins, not the shortest;
    workflows follow the tools' rule and say the same on stderr (get_workflow_paths).
  kinds: [workflow]
  files: [a/dup, zz/sub/dup]
  found: {global: {dup: zz/sub/dup}}
  warnings: {global: {dup: [a/dup, zz/sub/dup]}}
