# `mk_file` and a call of `child.wic` (one `xform`) with what the root, the call and the child carry, and the reason
# the call stays nested (null: it dissolves). Expected by hand from the rule: only a call of `in` and `out` dissolves.
- {id: when, call: {when: '$(inputs.file != null)'}, kept: it carries `when`,
    why: the call carries more than in and out}
- {id: requirements, call: {requirements: {ResourceRequirement: {ramMin: 1}}}, kept: it carries `requirements`,
   why: the call carries more than in and out}
- {id: label, call: {label: a call}, kept: it carries `label`, why: the call carries more than in and out}
- {id: opted-out, child: {wic: {inlineable: false}}, kept: 'it is marked `wic: inlineable: false`',
   why: "the child's own file opts out"}
- {id: opted-in, child: {wic: {inlineable: true}}, kept: null, why: a child that opts in dissolves like any other}
- {id: different-javascript, root: {requirements: {InlineJavascriptRequirement: {expressionLib: ['var a = 1;']}}},
   child: {requirements: {InlineJavascriptRequirement: {expressionLib: ['var a = 2;']}}},
   kept: it declares a different InlineJavascriptRequirement from its caller,
       why: "two bodies cannot both be the root's"}
