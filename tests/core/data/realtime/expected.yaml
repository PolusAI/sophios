# What `sophios --yaml declared.wic --generate_cwl_workflow` writes under autogenerated/: the workflow as it is without
# its declarations, and each analysis compiled on its own under realtime/<name>/, a repeated document name given a
# suffix, every analysis named in the manifest with where it was declared. `refused.wic` fails at its declaration.
files:
  realtime/declared: [tag_only.cwl, tag_only_inputs.yml, tag_only~tag.cwl]
  realtime/declared_2: [measure_only.cwl, measure_only_inputs.yml, measure_only~measure.cwl,
                        measure_only~measure~count_lines@1.cwl, measure_only~measure~count_lines@2.cwl]
  realtime/declared_3: [counted_only.cwl, counted_only_inputs.yml, counted_only~counted.cwl]
  realtime/watch: [count_lines_only.cwl, count_lines_only_inputs.yml, count_lines_only~count_lines.cwl]
written:
  declared.cwl: {steps: [{id: slow_log}, {id: watch}]}
  declared~watch.cwl: {steps: []}
  declared.realtime.json:
  - {name: declared, analysis: tag, file_pattern: '*.log', max_times: 3, interval: 60,
     cwl: realtime/declared/tag_only.cwl, inputs: realtime/declared/tag_only_inputs.yml, root_dir: '{tmp}',
     declared_at: 'declared.wic:6:3'}
  - {name: declared_2, analysis: measure.wic, file_pattern: '*.log', max_times: 1, interval: 60,
     cwl: realtime/declared_2/measure_only.cwl, declared_at: 'declared.wic:17:3'}
  - {name: declared_3, analysis: counted, file_pattern: out.log, max_times: 2, interval: 5,
     declared_at: 'declared.wic:30:3'}
  - {name: watch, analysis: count_lines, max_times: 2, interval: 5, declared_at: 'watch.wic:3:3'}
  realtime/declared/tag_only_inputs.yml: {exact: {tag~file: {class: File, location: a.txt}, tag~name: b.txt}}
  realtime/declared_2/measure_only_inputs.yml: {exact: {measure~count_lines@1~log: {class: File, location: a.txt},
                                                        measure~count_lines@2~log: {class: File, location: b.txt}}}
  realtime/declared_3/counted_only.cwl: {steps: [{run: counted_only~counted.cwl}]}
  realtime/declared_3/counted_only~counted.cwl:
    hints: [{exact: {class: DockerRequirement, dockerPull: counted, dockerFile: "FROM alpine:3.20\n"}}]
refused: [{code: REALTIME_DECLARATION, severity: error, file: refused.wic, line: 4,
           message: {contains: ["real-time analysis 'nope' does not compile"]}}]
