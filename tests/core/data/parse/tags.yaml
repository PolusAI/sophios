- {id: "malformed YAML is located, not raised", source: "steps:\n  - [unclosed\n",
   report: [{code: INVALID_YAML, line: 3}], recovers: false,
   why: &w0 "Each diagnosed shape reports exactly one diagnostic, at its line, and a document survives beside it:
       recovery is the norm, and only unparsable YAML leaves nothing to return."}
- {id: an unknown tag on the root document, source: "--- !foo\nsteps: []\n", ok: false,
   report: {contains: [{code: UNKNOWN_TAG}]}, yaml: raises,
   why: &w1 "Every tag the language does not own is reported, structure included. A call at each position that consumes
       a node is how a position gets missed: each pass over that form found positions the previous one had left
       uncovered. One walk over the composed graph has no positions to track, so a shape added later is covered by
       default. Each case asserts both halves — the parser reports and `yaml.SafeLoader` raises — since the failure here
       is the parser being more permissive than the YAML it is written in."}
