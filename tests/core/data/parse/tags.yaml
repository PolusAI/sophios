- {id: the prefix is unclaimed in an input port called wic_, source: "steps:\n  s:\n    in:\n      wic_: !* e\n",
   excludes: [RESERVED_KEY],
   why: &w3 "A name may carry the prefix; only a construct attempt may not. The first version of this rule walked every
       mapping key and reserved the prefix everywhere, which made `in: {wic_: !* e}` — a port someone may legitimately
       call `wic_` — an error. The generators found it immediately. Reserving a prefix in *name* position narrows the
       language well past the defect being closed, and passthrough must stay open (language spec §1)."}
