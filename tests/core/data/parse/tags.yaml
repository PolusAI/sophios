- {id: a misspelled desugared inline literal, source: "steps:\n- id: s\n  in: {f: {wic_inline_inpt: 1}}\n", ok: false,
   report: {contains: [{code: RESERVED_KEY}]},
   why: &w2 "A single-key mapping beginning `wic_` is read as a construct attempt. Without this the two spellings are
       equally *accepted* and unequally *safe*: `!iii` is `wic009` at once, while `wic_inline_inpt` was a mapping like
       any other, so the construct vanished and the typo rode into the emitted document. Both spellings are authorable,
       so it is a hand-written mistake as much as a generated one."}
