- {id: an alias cycle through passthrough, source: "top: &a [*a]\n", ok: false,
   report: {contains: [{code: RECURSIVE_ALIAS}]},
   why: &w5 "The contract: a cycle is a diagnosed error, never a quiet success. Totality (no raise) is the adversarial
       property's job, with these shapes pinned on it as @example; this asserts the report the .wic reference promises.
       The sidecar shape has to actually recurse through `_sidecar` to test that contract — a self-referential `steps:`
       value one level up hits an unrelated malformed-key check first and never reaches the cycle guard."}
