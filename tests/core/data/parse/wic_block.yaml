- {id: "a wic: block reached through its own alias", source: "wic: &w\n  steps:\n    (1, a):\n      wic: *w\n",
   report: [{code: RECURSIVE_ALIAS, line: 1, message: {contains: [contains itself]}}], recovers: true,
   why: &w0 "Each diagnosed shape reports exactly one diagnostic, at its line, and a document survives beside it:
       recovery is the norm, and only unparsable YAML leaves nothing to return."}
- {id: "a repeated wic: step key names the key", source: "wic:\n  steps:\n    (1, a): {}\n    (1, a): {}\n",
   report: [{code: DUPLICATE_KEY, line: 4, message: {contains: ["wic: step key '(1, a)'"]}}], recovers: true, why: *w0}
- {id: an alias cycle through sidecar, source: "wic: &w\n  steps:\n    (1, a):\n      wic: *w\n", ok: false,
   report: {contains: [{code: RECURSIVE_ALIAS}]},
   why: &w1 "The contract: a cycle is a diagnosed error, never a quiet success. Totality (no raise) is the adversarial
       property's job, with these shapes pinned on it as @example; this asserts the report the .wic reference promises.
       The sidecar shape has to actually recurse through `_sidecar` to test that contract — a self-referential `steps:`
       value one level up hits an unrelated malformed-key check first and never reaches the cycle guard."}
- {id: a sidecar key that is neither form, source: "wic:\n  steps:\n    \"not a key\": {}\n",
   report: [{code: MALFORMED_WIC_STEP_KEY}],
   why: &w2 "A key that is neither a bare id nor (index, id) is still wic008."}
