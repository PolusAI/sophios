- {id: a sidecar steps out accepts an edge definition,
   source: "wic:\n  steps:\n    (1, s):\n      out:\n      - output_tpr_path: !& min.tpr\nsteps:\n- id: s\n", ok: true,
   why: &w1 "`!&` is legal under `wic.steps.(N, name).out`, exactly as on a step's own `out:` (.wic reference §3.6) — a
       sidecar `(N, name): out:` block *is* a step's `out:` entry, just written at a distance (see `basic.wic`, which
       places the corpus's only definition of `min.tpr` here rather than in the nested file, precisely to avoid a
       `wic026 DUPLICATE_EDGE_DEF`)."}
