- {id: "an unkeyable list-form entry: no-id", source: "inputs:\n- type: string\n",
   report: [{code: EXPECTED_MAPPING, message: "a list-form inputs: entry must be a mapping with a string id:"}],
   why: &w2 "An entry with no usable `id` or `class`, or a name taken twice, has no place in the mapping. Each unkeyable
       entry is told the rule it broke: a string name, or an `id:` with a name after the last #."}
