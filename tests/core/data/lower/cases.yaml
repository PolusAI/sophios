   source: "steps:\n- id: s\n  out: [f]\n- id: s\n  out: [f]\noutputs:\n  o:\n    type: File\n    outputSource: (2,
       t)/f\n",
   why: &positional "A wrong name or an index past the last step is refused as wic039."}
