       s)/f\n"}
- {id: a positional output source naming a port the step lacks,
    diagnostics: [{code: UNDECLARED_PORT, message: {contains: ["'nope'", "its outputs are: f"]}}],
   source: "steps:\n- id: s\n  out: [f]\n- id: s\n  out: [f]\noutputs:\n  o:\n    type: File\n    outputSource: (2,
       s)/nope\n",
   why: "The step is known, so the missing port is reported with the step's outputs."}
- {id: a record source before its definition, diagnostics: [code: UNDEFINED_EDGE],
   source: "steps:\n- id: use\n  in:\n    f: !cwl {source: !* e}\n- id: mk\n  out:\n  - file: !& e\n",
   why: "A record's `!*` source resolves as a bare `!*` does: above its `!& e` it is `wic025`."}
- {id: a record with several sources takes none from outside its document, diagnostics: [code: UNDEFINED_EDGE],
   source: "inputs:\n  w: string\nsteps:\n- id: use\n  in:\n    f: !cwl {source: [!* e, w]}\n",
   why: "One input crosses a workflow boundary through one relay, so it cannot carry several outside sources."}
