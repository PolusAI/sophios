- {id: an empty input name, source: "steps:\n- id: s\n  in:\n    \"\": !* e\n", graph: false,
    diagnostics: [code: EMPTY_NAME],
   why: &empty "`parse` accepts these; the types refuse them. Lowering has to bridge that. Refusing an unnamed port is
       right, but the refusal is a `ValueError`, and every one of these is a document the parser hands back. Reported
       here, the caller gets a diagnostic rather than a traceback -- the same treatment an unnamed step already had. Out
       of reach of `documents()`, which draws names from the synthetic registry and so never draws an empty one."}
- {id: an empty out entry name, source: "steps:\n- id: s\n  out:\n  - \"\": f\n", graph: false,
    diagnostics: [code: EMPTY_NAME], why: *empty}
- {id: an empty edge definition, source: "steps:\n- id: s\n  out:\n  - f: !& \"\"\n", graph: false,
    diagnostics: [code: EMPTY_NAME],
   why: &agree "`!& \"\"` and `!* \"\"` agree. They did not: the reference raised while the definition was accepted and
       put `''` into the edge table as a live producer name, where it would match any later `!* \"\"` that managed not
       to raise first."}
- {id: an empty edge reference, source: "steps:\n- id: s\n  in:\n    f: !* \"\"\n", graph: false,
    diagnostics: [code: EMPTY_NAME], why: *agree}
- {id: a reference before its definition, source: "steps:\n- id: use\n  in:\n    f: !* e\n- id: mk\n  out:\n  - file: !&
    e\n", diagnostics: [code: UNDEFINED_EDGE],
   why: "`!* e` above its `!& e` is `wic025`, as the .wic reference and compiler say. Resolving it by pre-scanning every
       definition would make Lower accept a document the compiler refuses, and silently change an ordering rule."}
- {id: a name defined twice, source: "steps:\n- id: a\n  out:\n  - f: !& e\n- id: b\n  out:\n  - f: !& e\n",
    diagnostics: [code: DUPLICATE_EDGE_DEF],
   why: "Keeping the first definition and dropping the second leaves nothing to report it with, here or in any later
       phase."}
- {id: a sidecar out mentioning the name does not mask a real duplicate, diagnostics: [code: DUPLICATE_EDGE_DEF],
   source: "wic:\n  steps:\n    (1, a):\n      out:\n      - f: {wic_anchor: e}\nsteps:\n- id: a\n  out:\n  - f: !& e\n-
       id: b\n  out:\n  - f: !& e\n",
   why: "A `wic:` sidecar `out:` entry (.wic reference §3.6) is inert passthrough, never itself a second definition --
       `basic.wic` relies on exactly this to place `min.tpr`'s one definition at a distance. A real duplicate among the
       document's own steps must still be reported once, whether or not a sidecar block happens to mention the same
       name."}
- {id: a step with no id, source: "steps:\n- id: \"\"\n  in: {}\n", graph: false, diagnostics: [code: EMPTY_STEP_ID],
   why: "The parser recovers such a document, which is exactly when a caller is least able to handle an exception.
       `wic007` rather than `wic006`, matching what the parser already reports for the same document: the id is present
       and empty, not missing."}
- {id: "scatter: [1]", source: "steps:\n- id: mk_file\n  in: {name: !ii [a, b]}\n  scatter: [1]\n",
    diagnostics: {contains: [code: UNKNOWN_SCATTER_PORT]},
   why: &scatter "`scatter:` names inputs. An entry that is no name at all, or a `scatter:` that is neither a name nor a
       list, names none of them: it is reported rather than dropped or emitted verbatim."}
- {id: "scatter: [null]", source: "steps:\n- id: mk_file\n  in: {name: !ii [a, b]}\n  scatter: [null]\n",
    diagnostics: {contains: [code: UNKNOWN_SCATTER_PORT]}, why: *scatter}
