# What `sophios --yaml drawn.wic --generate_cwl_workflow --graphviz <flags>` draws in autogenerated/drawn.wic.gv,
# for each set of flags: the clusters, by name, with their attributes; the boxes, each with its label and style; the
# edges, from and to, with their attributes; and each rank=same group, with its depth: 2 in the root's cluster, 3 in
# one within it. The drawing's text, box outlines, inferred edges and edge labels take one colour, black or, with
# --graph_dark_theme, white; an edge the document wrote is blue, or a lighter blue on a dark background. No box is
# filled, and the background is transparent either way, so a slide gives it its colour. The first row states every
# box; another states some, and its clusters are all the clusters drawn, and the boxes it calls `absent` are not.
- flags: []
  palette: black
  clusters:
    cluster_drawn.wic: {label: My Pipeline}
    cluster_sub@4: {label: Called}
    cluster_sub@4~inner: {label: inner.wic}
    cluster_sub@5: {label: Own, style: invis}
    cluster_sub@5~inner: {label: inner.wic}
    cluster_plain: {label: plain.wic}
  boxes:
    touch: [Make\nit, rounded]
    echo: [echo, 'rounded, dashed, bold']
    cat: [cat, rounded]
    sub@4: [sub.wic, rounded]
    sub@5: [sub.wic, 'rounded, invis']
    plain: [plain.wic, rounded]
    sub@4~cat: [cat, rounded]
    sub@4~inner: [inner.wic, rounded]
    sub@4~inner~touch: [touch, rounded]
    sub@4~inner~cat: [cat, rounded]
    sub@5~cat: [cat, rounded]
    sub@5~inner: [inner.wic, rounded]
    sub@5~inner~touch: [touch, rounded]
    sub@5~inner~cat: [cat, rounded]
    plain~echo: [echo, rounded]
  edges:
  - [touch, cat, {color: blue}]
  - [touch, sub@4~cat, {color: blue}]
  - [touch, sub@5~cat, {color: blue}]
  - [sub@4~inner~touch, sub@4~inner~cat, {color: black}]
  - [sub@5~inner~touch, sub@5~inner~cat, {color: black}]
  ranks: [[3, [sub@4~cat, sub@4~inner]], [3, [sub@5~cat, sub@5~inner]], [2, [touch, echo]]]
  said: ['Warning! plain.wic: wic: graphviz: ranksame entry (2, echo) addresses no step of',
         there is no step 2; the document has 1 step. The entry is ignored.]
- flags: [--graph_label_stepname]
  palette: black
  boxes: {touch: [touch, rounded], sub@4: [sub@4, rounded], plain: [plain, rounded], sub@4~inner: [inner, rounded]}
- flags: [--graph_label_edges, --graph_dark_theme]
  palette: white
  edges:
  - [touch, cat, {label: file, color: lightskyblue, fontcolor: white}]
  - [touch, sub@4~cat, {label: file, color: lightskyblue, fontcolor: white}]
  - [touch, sub@5~cat, {label: file, color: lightskyblue, fontcolor: white}]
  - [sub@4~inner~touch, sub@4~inner~cat, {label: file, color: white, fontcolor: white}]
  - [sub@5~inner~touch, sub@5~inner~cat, {label: file, color: white, fontcolor: white}]
- flags: [--graph_inline_depth, '0']
  palette: black
  clusters: {cluster_drawn.wic: {label: My Pipeline}}
  absent: [sub@4~cat]
  ranks: [[2, [touch, echo]]]
- flags: [--graph_inline_depth, '1']
  palette: black
  clusters: {cluster_drawn.wic: {}, cluster_sub@4: {}, cluster_sub@5: {}, cluster_plain: {}}
  absent: [sub@4~inner~touch]
