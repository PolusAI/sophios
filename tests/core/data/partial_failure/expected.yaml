# What `sophios --yaml w.wic <flags>` writes under autogenerated/, in the forms of tests/core/cases.py, or what it
# refuses with; stated by hand from docs/partial-failures.md, never filled from a run.
- why: each output accepts null in whichever form it is written; a stream becomes a File? that globs the file the tool
    names, or a file named by the sha1 of the tool, cwltool's scheme for it, since stderr? is no CWL type; a tool's own
    success codes are kept beside the policy's; an analysis's tools take the codes and the optional outputs as the
    workflow's do. A step runs only when every required input arrived, then its own when, evaluated once; a when
    written as a function body returns false first unless every required input arrived; and a when that is not one
    $(...) or ${...} is written as its author wrote it.
  flags: [--generate_cwl_workflow, --partial_failure_enable]
  written:
    w~make.cwl:
      successCodes: [0, 1, 3]
      outputs:
        listed: {type: 'File[]?'}
        files: {type: ['null', {exact: {type: array, items: File}}]}
        either: {type: ['null', File, Directory]}
        maybe: {type: ['null', File]}
        pair: {type: ['null', {exact: {type: record, fields: {left: {type: File, outputBinding: {glob: left}}}}}]}
    w~say.cwl: {stdout: said.txt, outputs: {exact: {said: {type: 'File?', outputBinding: {glob: said.txt}}}}}
    w~err.cwl: {stderr: {re: '^[0-9a-f]{40}$'}, outputs: {err: {type: 'File?', outputBinding: {glob: {re: '^[0-9a-f]{40}$'}}}}}
    w.cwl:
      steps:
        contains:
        - {id: pair, when: '$(inputs["left"] != null && inputs["right"] != null)'}
        - {id: say_skip, when: '$(inputs["message"] != null && (inputs.message != "skip"))'}
        - {id: tell_skip, when: '${if (!(inputs["message"] != null)) { return false; } return inputs.message != "skip"; }'}
        - {id: say_on, when: 'on $(inputs.message)'}
        - {id: tell_true, when: true}
    realtime/w/look_only.cwl: {steps: [{id: look, when: '$(inputs["file"] != null)'}]}
    realtime/w/look_only~look.cwl: {successCodes: [0, 1], outputs: {seen: {type: 'File?'}}}
- why: successCodes is emitted CWL, so no set's iteration order may reach it; these codes are chosen so that a set's
    order is not the sorted one; a range keeps its lower bound and excludes its upper
  flags: [--generate_cwl_workflow, --partial_failure_enable, --partial_failure_success_codes, '9', '4', '1', '32',
          --partial_failure_success_codes_range, '3', '6']
  written: {w~say.cwl: {successCodes: [0, 1, 3, 4, 5, 9, 32]}}
- why: 0 always counts
  flags: [--generate_cwl_workflow, --partial_failure_enable, --partial_failure_success_codes,
          --partial_failure_success_codes_range, '0', '1']
  written: {w~say.cwl: {successCodes: [0]}}
- why: a range whose lower bound is above its upper names no code, a usage error whatever else is given
  flags: [--generate_cwl_workflow, --partial_failure_success_codes_range, '5', '2']
  refused: '--partial_failure_success_codes_range 5 2: the lower bound is above the upper'
- why: under --docker_remove_entrypoints the image the runner pulls is the one built without its entrypoint
  flags: [--generate_run_script, --docker_remove_entrypoints]
  written: {w~pull.cwl: {requirements: {DockerRequirement: {dockerPull: 'docker.io/library/debian:bookworm-slim-noentrypoint'}}}}
