# Each case is a project: `tools`, each <name>.cwl over a stub CommandLineTool (`baseCommand: 'true'`, no ports),
# and `workflows`, each <name>.wic, beside a config that searches the directory. `sophios --yaml w.wic
# --generate_cwl_workflow` compiles it with `flags` (--partial_failure_enable unless the case names them), and
# `written` is what files under autogenerated/ hold, in the forms of tests/core/cases.py; `refused`, what the
# command line says instead. Expected by hand from docs/partial-failures.md, never filled from a run.
- id: codes-listed-and-ranged
  why: successCodes is emitted CWL, so no set's iteration order may reach it; these codes are chosen so that a set's
    order is not the sorted one
  flags: [--partial_failure_enable, --partial_failure_success_codes, 9, 4, 1, 32, --partial_failure_success_codes_range, 3, 6]
  tools: {make: {outputs: {made: {type: File, outputBinding: {glob: made.txt}}}}}
  workflows: {w: "steps:\n- id: make\n"}
  written: {w~make.cwl: {successCodes: [0, 1, 3, 4, 5, 9, 32], outputs: {made: {type: 'File?'}}}}
- id: codes-zero-alone
  why: 0 always counts, and a range keeps its lower bound and excludes its upper
  flags: [--partial_failure_enable, --partial_failure_success_codes, --partial_failure_success_codes_range, 0, 1]
  tools: {make: {outputs: {made: {type: File, outputBinding: {glob: made.txt}}}}}
  workflows: {w: "steps:\n- id: make\n"}
  written: {w~make.cwl: {successCodes: [0], outputs: {made: {type: 'File?'}}}}
- id: a-range-upside-down
  why: a range whose lower bound is above its upper names no code; it stopped the command line with an AssertionError
  flags: [--partial_failure_enable, --partial_failure_success_codes_range, 5, 2]
  tools: {make: {}}
  workflows: {w: "steps:\n- id: make\n"}
  refused: '--partial_failure_success_codes_range 5 2: the lower bound is above the upper'
- id: a-range-upside-down-without-the-flag
  why: the range is a usage error whatever else is given, as an option of another target is; without the flag it was
    never read
  flags: [--partial_failure_success_codes_range, 5, 2]
  tools: {make: {}}
  workflows: {w: "steps:\n- id: make\n"}
  refused: '--partial_failure_success_codes_range 5 2: the lower bound is above the upper'
- id: codes-the-tool-declares
  why: a tool's own successCodes are kept beside the policy's; they were replaced, so a code the tool counts as success
    failed its step
  tools: {make: {successCodes: [3, 0]}}
  workflows: {w: "steps:\n- id: make\n"}
  written: {w~make.cwl: {successCodes: [0, 1, 3]}}
- id: an-output-written-as-its-type
  why: an output written as its type alone stopped the compile with a TypeError; a stream becomes a File? that globs
    the file the tool names
  tools: {say: {stdout: said.txt, outputs: {said: stdout}}}
  workflows: {w: "steps:\n- id: say\n"}
  written: {w~say.cwl: {stdout: said.txt, outputs: {exact: {said: {type: 'File?', outputBinding: {glob: said.txt}}}}}}
- id: a-stream-the-tool-does-not-name
  why: stderr? is no CWL type, and cwltool refuses it; a stream the tool does not name is written to a file named by
    the sha1 of the tool, cwltool's scheme for it, and globbed from there
  tools: {say: {outputs: {err: {type: stderr}}}}
  workflows: {w: "steps:\n- id: say\n"}
  written: {w~say.cwl: {stderr: {re: '^[0-9a-f]{40}$'}, outputs: {err: {type: 'File?',
    outputBinding: {glob: {re: '^[0-9a-f]{40}$'}}}}}}
- id: every-type-form
  why: only a type written as one string was made optional; an array or a record written in full, and a union without
    null, stayed required, so a job that left them out failed its step
  tools:
    make:
      outputs:
        listed: {type: 'File[]', outputBinding: {glob: '*.txt'}}
        files: {type: {type: array, items: File}, outputBinding: {glob: '*.txt'}}
        either: {type: [File, Directory], outputBinding: {glob: out}}
        maybe: {type: ['null', File], outputBinding: {glob: out}}
        pair: {type: {type: record, fields: {left: {type: File, outputBinding: {glob: left}}}}}
  workflows: {w: "steps:\n- id: make\n"}
  written:
    w~make.cwl:
      outputs:
        listed: {type: 'File[]?'}
        files: {type: ['null', {exact: {type: array, items: File}}]}
        either: {type: ['null', File, Directory]}
        maybe: {type: ['null', File]}
        pair: {type: ['null', {exact: {type: record, fields: {left: {type: File, outputBinding: {glob: left}}}}}]}
- id: a-real-time-analysis
  why: an analysis is compiled under the workflow's options, so its steps took the null checks, but its tools never
    took the success codes or the optional outputs, which only the root's tree was given
  tools:
    make: {outputs: {made: {type: File, outputBinding: {glob: made.txt}}}}
    look: {inputs: {file: {type: File, inputBinding: {position: 1}}}, outputs: {seen: {type: File, outputBinding: {glob: seen.txt}}}}
  workflows:
    w: |
      steps:
      - id: make
      - id: cwl_subinterpreter
        in:
          file_pattern: !ii made.txt
          cwl_tool: !ii look
          max_times: !ii 1
          config: !ii {in: {file: made.txt}}
  written:
    realtime/w/look_only.cwl: {steps: [{id: look, when: '$(inputs["file"] != null)'}]}
    realtime/w/look_only~look.cwl: {successCodes: [0, 1], outputs: {seen: {type: 'File?'}}}
- id: no-when-of-its-own
  why: a step with no when of its own runs only when every required input arrived, in the text it always had
  tools: {pair: {inputs: {left: string, right: string}}}
  workflows: {w: "steps:\n- id: pair\n  in:\n    left: !ii a\n    right: !ii b\n"}
  written: {w.cwl: {steps: [{id: pair, when: '$(inputs["left"] != null && inputs["right"] != null)'}]}}
- id: a-when-of-its-own
  why: a step's own when was replaced by the null checks, so a step its author switched off ran; it is evaluated
    after them, once
  tools: {say: {inputs: {message: string}}}
  workflows: {w: "steps:\n- id: say\n  when: '$(inputs.message != \"skip\")'\n  in:\n    message: !ii skip\n"}
  written: {w.cwl: {steps: [{id: say, when: '$(inputs["message"] != null && (inputs.message != "skip"))'}]}}
- id: a-when-written-as-a-body
  why: the same for a when written as a function body, which returns false first unless every required input arrived
  tools: {say: {inputs: {message: string}}}
  workflows: {w: "steps:\n- id: say\n  when: '${ return inputs.message != \"skip\"; }'\n  in:\n    message: !ii skip\n"}
  written: {w.cwl: {steps: [{id: say,
    when: '${if (!(inputs["message"] != null)) { return false; } return inputs.message != "skip"; }'}]}}
- id: a-when-that-is-not-one-expression
  why: a when that is not one $(...) or ${...} evaluates to no boolean, so cwltool refuses it as a when, and the null
    checks were written over it; it is written as the author wrote it
  tools: {say: {inputs: {message: string}}, tell: {inputs: {message: string}}}
  workflows: {w: "steps:\n- id: say\n  when: 'on $(inputs.message)'\n  in:\n    message: !ii a\n- id: tell\n  when: true\n  in:\n    message: !ii b\n"}
  written: {w.cwl: {steps: [{id: say, when: 'on $(inputs.message)'}, {id: tell, when: true}]}}
- id: a-step-only-input
  why: docs/cookbook/when.wic; an input only the when reads is not its tool's, which never receives it, yet it was
    null-checked too
  tools: {say: {inputs: {message: string}}}
  workflows: {w: "inputs:\n  loud: boolean\nsteps:\n- id: say\n  when: $(inputs.enabled)\n  in:\n    message: !ii Hello\n    enabled: !cwl {source: loud}\n"}
  written: {w.cwl: {steps: [{id: say, when: '$(inputs["message"] != null && (inputs.enabled))'}]}}
