# The images a run uses are fetched before it starts, with the chosen engine: pulled through cwl-docker-extract, and
# a dockerLoad loaded and a dockerImport imported as cwltool does. What fails is one wic037 naming it and quoting the
# engine's error line. --check fetches nothing.
runs:
- argv: [--yaml, images.wic, --config_file, search.json, --generate_run_script]
  pulled: true
  commands: {contains: [[docker, load, -i, image.tar], [docker, import, 'https://example.org/rootfs.tar', 'rootfs:1'],
                        [docker, load, -i, {re: image.tar$}]]}
- argv: [--yaml, images.wic, --config_file, search.json, --generate_run_script, --container_engine, podman]
  pulled: true
  commands: {contains: [[cwl-docker-extract, --force-download, --container-engine, podman, {re: images.cwl$}],
                        [podman, load, -i, image.tar], [podman, import, 'https://example.org/rootfs.tar', 'rootfs:1']]}
- argv: [--yaml, images.wic, --config_file, search.json, --check]
  commands: {exact: [[docker, info], [pgrep, com.docker]]}
- machine: {fails: [[cwl-docker-extract]], said: "first line\nError: pull access denied\n"}
  argv: [--yaml, nope.wic, --config_file, search.json, --generate_run_script, --diagnostics, json]
  exit: 1
  pulled: true
  diagnostics: [{code: IMAGE_UNAVAILABLE, severity: error, message: {contains: [
    'docker could not pull docker.io/nope:1 (cwl-docker-extract exited with status 1: Error: pull access denied)']}}]
- why: cwl-docker-extract re-raises the engine's output as `SubprocessError(<bytes>)`, which is read
  machine: {fails: [[cwl-docker-extract]], said: "Traceback (most recent call last):\n  File \"extract.py\", line 1,
    in <module>\nsubprocess.SubprocessError: b'Trying to pull docker.io/nope:1... \\r\\nError: requested access to
    the resource is denied \\r\\n'\n"}
  argv: [--yaml, nope.wic, --config_file, search.json, --generate_run_script, --diagnostics, json]
  exit: 1
  pulled: true
  diagnostics: [{code: IMAGE_UNAVAILABLE, severity: error, message: {contains: [
    '(cwl-docker-extract exited with status 1: Error: requested access to the resource is denied)']}}]
- machine: {fails: [[docker, load]], said: "first line\nError: no such archive\n"}
  argv: [--yaml, load.wic, --config_file, search.json, --generate_run_script, --diagnostics, json]
  exit: 1
  pulled: true
  diagnostics: [{code: IMAGE_UNAVAILABLE, severity: error, message: {contains: [
    'docker could not load image.tar (docker exited with status 1: Error: no such archive)']}}]
- machine: {fails: [[docker, import]], said: "Error: not an archive\n"}
  argv: [--yaml, local_import.wic, --config_file, search.json, --generate_run_script, --diagnostics, json]
  exit: 1
  pulled: true
  diagnostics: [{code: IMAGE_UNAVAILABLE, severity: error, message: {contains: [
    'docker could not import rootfs:1 from rootfs.tar (docker exited with status 1: Error: not an archive)']}}]
