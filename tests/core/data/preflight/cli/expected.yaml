# What the command line says, and its exit code: 1 for a failure, 2 for a usage error, with no traceback.
runs:
- why: the failure a scientist sees names the file, line, column and code on stderr
  argv: [--yaml, bad.wic, --generate_cwl_workflow]
  exit: 1
  stderr: {contains: [Failed to compile bad.wic, 'bad.wic:2:7: error [wic007]']}
  lacks: [Traceback]
- why: or one JSON object a line
  argv: [--yaml, bad.wic, --generate_cwl_workflow, --diagnostics, json]
  exit: 1
  diagnostics: [{severity: error, code: EMPTY_STEP_ID, kind: document, file: bad.wic, line: 2, column: 7}]
- why: a tool cwltool's validator refuses is refused at its step, for either target, before anything is written
  argv: [--yaml, refused_tool.wic, --generate_cwl_workflow, --diagnostics, json]
  exit: 1
  diagnostics: [{severity: error, code: TOOL_REFUSED, kind: document, file: refused_tool.wic, line: 2, step: refused_tool,
                 message: {contains: [refused_tool.cwl, "Field 'type' references unknown identifier 'strin'"]}}]
  absent: [autogenerated]
- argv: [--yaml, refused_tool.wic, --target, nextflow, --diagnostics, json]
  exit: 1
  diagnostics: [{severity: error, code: TOOL_REFUSED, step: refused_tool}]
  absent: [autogenerated]
- why: a tool is validated, not the file that happens to be named as it would be
  argv: [--yaml, shadowed.wic, --generate_cwl_workflow]
  lacks: [wic057]
- why: a guessed edge is a note, the compile succeeds, and the note says to draw the workflow
  argv: [--yaml, two_touches.wic, --generate_cwl_workflow]
  stderr: {contains: ['note [wic043] 1 edge was guessed; draw the workflow',
                      'two_touches.wic:8:3  cat.file <- touch@2.file (1 other fits)']}
- argv: [--yaml, two_touches.wic, --generate_cwl_workflow, --diagnostics, json]
  diagnostics: [{severity: note, code: INFERENCE_GUESS, message: cat.file <- touch@2.file (1 other fits), step: cat,
                 index: 3, port: file}]
- why: --inference_strict makes the guess an error, with nothing to draw
  argv: [--yaml, two_touches.wic, --generate_cwl_workflow, --inference_strict]
  exit: 1
  stderr: {contains: ['error [wic043] cat.file <- touch@2.file was guessed, 1 other fits']}
  lacks: [draw the workflow]
- why: a flag Sophios does not know is an error, not a silent gift to the runner
  argv: [--yaml, echo.wic, --generate_cwl_workflow, --no_such_flag]
  exit: 2
  stderr: {contains: [--no_such_flag]}
  lacks: [Traceback]
- argv: [--yaml, echo.wic, --generate_run_script, --no_such_flag]
  exit: 2
  stderr: {contains: [--no_such_flag]}
- why: --passthrough_flags yes with no runner to send the arguments to
  argv: [--yaml, echo.wic, --generate_cwl_workflow, --passthrough_flags, 'yes', --debug]
  exit: 2
  stderr: {contains: [--run_local]}
- argv: [--yaml, nope.wic, --generate_cwl_workflow]
  exit: 2
  stderr: {contains: [no workflow file at nope.wic]}
  lacks: [Traceback]
- argv: [--yaml, echo.wic, --inputs_file, nope.yml, --generate_cwl_workflow]
  exit: 2
  stderr: {contains: [no inputs file at nope.yml]}
- argv: [--explain, wic999]
  exit: 2
  stderr: {contains: [wic999 is not a Sophios error code]}
  lacks: [Traceback]
- why: a failure Sophios did not expect says so in one line; the file holds the traceback with its frames
  machine: {crash: true}
  argv: [--yaml, two_touches.wic, --generate_cwl_workflow]
  exit: 1
  stderr: {contains: ['Sophios stopped on an unexpected RuntimeError: boom. The traceback is in error_two_touches.txt']}
  lacks: [Traceback]
  texts: {error_two_touches.txt: {contains: [Traceback (most recent call last), in crash]}}
- why: a working directory where autogenerated/ cannot be made is one wic021, not a PermissionError
  cwd: locked
  posix_user: true
  argv: [--yaml, ../echo.wic, --generate_cwl_workflow, --diagnostics, json]
  exit: 1
  diagnostics: [{code: DIRECTORY_NOT_WRITABLE, severity: error,
                 message: {contains: [Sophios writes the compiled workflow to, give --basepath a directory you can write to]}}]
- why: and a --basepath that is a file names the path given
  argv: [--yaml, echo.wic, --generate_cwl_workflow, --basepath, echo.wic, --diagnostics, json]
  exit: 1
  diagnostics: [{code: DIRECTORY_NOT_WRITABLE, severity: error,
                 message: {contains: ['{tmp}/echo.wic is a file: give --basepath a directory you can write to']}}]
