# An input the run cannot use is one wic016 naming the input, where its relative paths are read from, and the fix,
# before any image is pulled. An output-target Directory names what the step creates: it is not looked for, nor made
# absolute against the inputs file; a Directory that is an input is read where it is.
runs:
- argv: [--yaml, absent.wic, --generate_run_script, --diagnostics, json]
  exit: 1
  diagnostics: [{code: MISSING_INPUT_FILE, severity: error, message: {contains: [
    "input 'cat~file' (from the workflow, whose relative paths are read from {tmp})",
    "names 'absent.txt', which does not exist at {tmp}/absent.txt: correct the path, or create the file"]}}]
- argv: [--yaml, cat_input.wic, --generate_run_script, --inputs_file, absent.yml, --diagnostics, json]
  exit: 1
  diagnostics: [{code: MISSING_INPUT_FILE, severity: error, message: {contains: [
    "input 'file' (from --inputs_file, whose relative paths are read from {tmp})"]}}]
- posix_user: true
  machine: {unreadable: [locked.txt]}
  argv: [--yaml, locked.wic, --generate_run_script, --diagnostics, json]
  exit: 1
  diagnostics: [{code: MISSING_INPUT_FILE, severity: error, message: {contains: [
    'which you may not read ({tmp}/locked.txt): give yourself access (chmod u+r {tmp}/locked.txt)']}}]
- why: a missing input and a stopped engine are reported together
  machine: {engine: fails, said: stopped, docker_host: 'tcp://engine.invalid:2375'}
  argv: [--yaml, absent.wic, --generate_run_script, --diagnostics, json]
  exit: 1
  diagnostics: [{code: MISSING_INPUT_FILE, severity: error}, {code: CONTAINER_ENGINE_UNAVAILABLE, severity: error}]
- argv: [--yaml, cat_input.wic, --generate_run_script, --inputs_file, jobs/job.yml]
  pulled: true
  files:
    autogenerated/cat_input_inputs.yml:
      file: {location: '{tmp_uri}/jobs/data/a.txt', secondaryFiles: [{path: '{tmp}/jobs/data/a.txt'}]}
- argv: [--yaml, cat_input.wic, --check, --inputs_file, uri.yml]
  stdout: {contains: ['Checked cat_input: ']}
- argv: [--yaml, cat_input.wic, --generate_run_script, --inputs_file, list.yml, --diagnostics, json]
  exit: 1
  diagnostics: [{code: NOT_A_MAPPING, severity: error, message: {contains: [
    must be a mapping of input names to values, not a list]}}]
- argv: [--yaml, literal.wic, --generate_run_script, --config_file, search.json]
- argv: [--yaml, named.wic, --generate_run_script, --config_file, search.json, --inputs_file, named.yml]
  files: {autogenerated/named_inputs.yml: {write_dir~outDir: {class: Directory, basename: result.outDir, listing: []}}}
- argv: [--yaml, beside.wic, --generate_run_script]
  files: {autogenerated/beside_inputs.yml: {subdirectory~directory: {class: Directory, location: '{tmp_uri}/shared'}}}
  written: {exact: [autogenerated/beside.cwl, autogenerated/beside_inputs.yml, autogenerated/beside~subdirectory.cwl,
                    run.sh]}
