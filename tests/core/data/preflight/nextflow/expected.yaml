# A --check of the Nextflow target asks for Nextflow, reports the lowering's notes and stops: Nextflow is not started,
# nothing is written into the base path, passing or failing, and the output directory a tool writes into is not made.
runs:
- argv: [--yaml, made.wic, --config_file, search.json, --target, nextflow, --check, --diagnostics, json]
  stdout: {contains: ['Checked made: nothing in the way of a local run on this machine. Nothing was written, pulled or
    run.']}
  diagnostics:
  - {code: UNCHECKED_CUDA_FIELD, severity: note, step: write_into, message: {contains: [cudaVersionMin '11.4']}}
  - {code: UNCHECKED_CUDA_FIELD, severity: note, step: write_into, message: {contains: [cudaComputeCapability '3.0']}}
  commands: {exact: [[/usr/bin/nextflow, -version]]}
  absent: [made, autogenerated]
- argv: [--yaml, made.wic, --config_file, search.json, --target, nextflow, --check, --basepath, earlier]
  unchanged: true
- machine: {missing: [nextflow]}
  argv: [--yaml, made.wic, --config_file, search.json, --target, nextflow, --check, --basepath, earlier]
  exit: 1
  unchanged: true
