# A program the run calls that is not here is one wic029 naming it and how to install it, before anything is pulled or
# started; and so is a runner that cannot run on this platform.
runs:
- machine: {missing: [cwltool_filterlog]}
  argv: [--yaml, echo.wic, --generate_run_script, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'run.sh calls cwltool_filterlog, which is not on PATH: install Sophios']}}]
  written: {exact: [autogenerated/echo.cwl, autogenerated/echo_inputs.yml, autogenerated/echo~echo.cwl]}
- machine: {missing: [toil-cwl-runner]}
  argv: [--yaml, echo.wic, --run_local, --cwl_runner, toil-cwl-runner, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'the run calls toil-cwl-runner, which is neither in this Python environment nor on PATH: install Toil']}}]
- machine: {missing: [cwl-docker-extract]}
  argv: [--yaml, touch.wic, --generate_run_script, --container_engine, singularity, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    pulling the images for singularity needs cwl-docker-extract]}}]
- machine: {windows: Windows has no pwd module}
  argv: [--yaml, echo.wic, --run_local, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'cwltool cannot run here (Windows has no pwd module): run Sophios inside WSL']}}]
- why: --graphviz without dot draws nothing, and says so as a note
  machine: {missing: [dot]}
  argv: [--yaml, echo.wic, --generate_cwl_workflow, --graphviz, --diagnostics, json]
  diagnostics: [{code: PROGRAM_MISSING, severity: note, message: {contains: [--graphviz needs the dot program]}}]
- machine: {missing: [nextflow]}
  argv: [--yaml, echo.wic, --target, nextflow, --check, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'the run calls nextflow, which is neither in this Python environment nor on PATH: install Nextflow']}}]
- machine: {missing: [nextflow]}
  argv: [--yaml, echo.wic, --target, nextflow, --generate_run_script, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'run.sh calls nextflow, which is not on PATH: install Nextflow']}}]
- why: the launcher colours what it prints; the first line, without colour, is quoted
  machine: {nextflow_exit: 1, said: "\e[31mERROR: Cannot find Java or it's a wrong version\e(B\e[m\n"}
  argv: [--yaml, echo.wic, --target, nextflow, --check, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    "nextflow -version exited with status 1 (ERROR: Cannot find Java or it's a wrong version): Nextflow needs a Java"]}}]
- machine: {windows: Windows has no pwd module}
  argv: [--yaml, echo.wic, --target, nextflow, --check, --diagnostics, json]
  exit: 1
  diagnostics: [{code: PROGRAM_MISSING, severity: error, message: {contains: [
    'nextflow cannot run here (Nextflow needs a POSIX system, which Windows is not)']}}]
