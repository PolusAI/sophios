# Every output of workflow.wic, by step and port, in the order of its steps.
outputs:
  shout~result: {class: File, basename: shouted.txt, contents: "HELLO WORLD\n"}
  copy~text: {class: File, basename: copy.txt, contents: "HELLO WORLD\n"}
  complain~errors: {class: File, basename: complaint.txt, contents: "diagnostic\n"}
# The CWL workflow.wic compiles to: its requirements, and of each step, in order, what it reads from another
# step or from a workflow input, and its scatter and when; a literal an input is given is left out.
compiled:
  requirements: {exact: {}}
  steps:
    shout: {}
    copy: {in: {source: shout/result}}
    complain: {}
