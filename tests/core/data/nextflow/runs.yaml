- id: adapter_then_cp_and_wc
  why: One workflow mixing an imported adapter with tools written beside it runs, the adapter's stdout read by both.
  tools:
    copy_file: {baseCommand: cp, arguments: [{position: 2, valueFrom: copy.txt}], inputs: {source: {type: File,
      inputBinding: {position: 1}}}, outputs: {result: {type: File, outputBinding: {glob: copy.txt}}}}
    count_bytes: {baseCommand: [wc, -c], inputs: {source: {type: File, inputBinding: {position: 1}}},
      stdout: count.txt, outputs: {result: {type: File, outputBinding: {glob: count.txt}}}}
  steps: |
    - {id: emit, run: echo, in: {message: !ii 'mixed construction, one backend'}, out: [stdout: !& emitted]}
    - id: copy_file
      in: {source: !* emitted}
    - id: count_bytes
      in: {source: !* emitted}
  outputs: {emit~stdout: {class: File, basename: stdout, contents: "mixed construction, one backend\n"},
    copy_file~result: {class: File, basename: copy.txt, contents: "mixed construction, one backend\n"},
    count_bytes~result: {class: File, basename: count.txt, contents: {re: '^\s*32 '}}}
- id: basename_derived_output
  why: An output name derived from a staged input's basename names the copy the command made.
  tools:
    write_source: &tool_write_source {baseCommand: echo, inputs: {message: {type: string, inputBinding: {position: 1}}},
      stdout: lines.txt, outputs: {result: {type: File, outputBinding: {glob: lines.txt}}}}
    copy_named_after_source: {baseCommand: cp, inputs: {source: {type: File, inputBinding: {position: 1}}},
      arguments: [{position: 2, valueFrom: $(inputs.source.basename).copy}], outputs: {result: {type: File,
      outputBinding: {glob: $(inputs.source.basename).copy}}}}
  steps: |
    - id: write_source
      in: {message: !ii basename derived}
    - id: copy_named_after_source
  outputs: {write_source~result: {class: File, basename: lines.txt, contents: "basename derived\n"},
    copy_named_after_source~result: {class: File, basename: lines.txt.copy, contents: "basename derived\n"}}
- id: brace_glob_literal
  why: 'A CWL glob has no brace expansion: `a{b,c}.txt` names one file, not the decoy `ab.txt`.'
  tools: {produce: {baseCommand: [sh, -c, 'echo literal > ''a{b,c}.txt''; echo decoy > ab.txt'],
    outputs: {result: {type: File, outputBinding: {glob: 'a{b,c}.txt'}}}}}
  outputs: {produce~result: {class: File, basename: 'a{b,c}.txt', contents: "literal\n"}}
- id: broadcast_from_conditional_step
  why: A step reading a conditional step's output has a queue of one element, which every task of a scattered step
    reads whole; the conditional step runs, and the string it made is its output.
  tools:
    gate: {baseCommand: [echo, 'yes'], inputs: {n: int}, stdout: said.txt, outputs: {said: {type: string,
      outputBinding: {glob: said.txt, loadContents: true, outputEval: '$(self[0].contents)'}}}}
    write_note: {baseCommand: echo, inputs: {text: {type: string, inputBinding: {position: 1}}, after: 'string?'},
      stdout: note.txt, outputs: {note: {type: File, outputBinding: {glob: note.txt}}}}
    copy_note: {baseCommand: cp, arguments: [{position: 2, valueFrom: $(inputs.name).txt}], inputs: {note: {type: File,
      inputBinding: {position: 1}}, name: string}, outputs: {copy: {type: File, outputBinding: {glob: $(inputs.name).txt}}}}
  steps: |
    - id: gate
      in: {n: !ii 1}
      out: [said: !& gated]
      when: $(inputs.n > 0)
    - id: write_note
      in: {text: !ii shared, after: !* gated}
      out: [note: !& noted]
    - id: copy_note
      scatter: [name]
      scatterMethod: dotproduct
      in: {note: !* noted, name: !ii [a, b, c]}
  outputs: {gate~said: "yes\n", write_note~note: {class: File, basename: note.txt, contents: "shared\n"},
    copy_note~copy: [{class: File, basename: a.txt, contents: "shared\n"}, {class: File, basename: b.txt,
    contents: "shared\n"}, {class: File, basename: c.txt, contents: "shared\n"}]}
- id: cuda_requirement_runs
  why: The local executor accepts the accelerator directive and runs the task; the CUDA fields change nothing about
    the Directory it makes.
  tools: {gpu_tool: {$namespaces: {cwltool: 'http://commonwl.org/cwltool#'}, hints: [{class: 'cwltool:CUDARequirement',
    cudaVersionMin: '11.4', cudaDeviceCountMin: 2, cudaComputeCapability: ['7.0', '8.0']}], baseCommand: [mkdir, made],
    outputs: {result: {type: Directory, outputBinding: {glob: made}}}}}
  outputs: {gpu_tool~result: {class: Directory, basename: made, link: false, contents: {}}}
- id: default_is_the_value_with_no_source
  why: A step-input default is the value of an input with no source, and takes the place of a null one, from an absent
    workflow input or a skipped step, but not of a given value.
  tools:
    skipped: &tool_maybe {baseCommand: printf, inputs: {text: {type: string, inputBinding: {position: 1}}, go: boolean},
      stdout: said.txt, outputs: {said: &said_text {type: string, outputBinding: {glob: said.txt, loadContents: true,
      outputEval: '$(self[0].contents)'}}}}
    unsourced: &tool_say_word {baseCommand: echo, inputs: {words: {type: string, inputBinding: {position: 1}}},
      stdout: out.txt, outputs: {line: {type: File, outputBinding: {glob: out.txt}}}}
    missing: *tool_say_word
    present: *tool_say_word
    after_skip: *tool_say_word
  inputs: {unset: 'string?', given: 'string?'}
  params: {unset: null, given: g}
  steps: |
    - id: skipped
      in: {text: !ii never, go: !ii false}
      out: [said: !& skipped_said]
      when: $(inputs.go)
    - id: unsourced
      in: {words: !cwl {default: d1}}
    - id: missing
      in: {words: !cwl {source: unset, default: d2}}
    - id: present
      in: {words: !cwl {source: given, default: d3}}
    - id: after_skip
      in: {words: !cwl {source: !* skipped_said, default: d4}}
  outputs: {skipped~said: null, unsourced~line: {class: File, basename: out.txt, contents: "d1\n"},
    missing~line: {class: File, basename: out.txt, contents: "d2\n"},
    present~line: {class: File, basename: out.txt, contents: "g\n"},
    after_skip~line: {class: File, basename: out.txt, contents: "d4\n"}}
- id: entry_name_collision-entry-and-staged-input
  why: &why_entry_name_collision cp and ln would make the entry inside the directory holding its name, so the task
    stops, saying so.
  tools: {mix: {requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.a), writable: true}]}},
    baseCommand: ls, inputs: {a: {type: Directory}, b: {type: Directory, inputBinding: {position: 1}}},
    stdout: listing.txt, outputs: {listing: {type: File, outputBinding: {glob: listing.txt}}}}}
  steps: &steps_entry_name_collision |
    - id: mix
      in: {a: !ii one/data, b: !ii two/data}
  files: &files_entry_name_collision {one/data/one.txt: one, two/data/two.txt: two}
  fails: 'InitialWorkDirRequirement entry already exists in the task directory: data'
- id: entry_name_collision-two-entries
  why: *why_entry_name_collision
  tools: {mix: {requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.a), writable: true},
    $(inputs.b)]}}, baseCommand: ls, inputs: {a: {type: Directory}, b: {type: Directory, inputBinding: {position: 1}}},
    stdout: listing.txt, outputs: {listing: {type: File, outputBinding: {glob: listing.txt}}}}}
  steps: *steps_entry_name_collision
  files: *files_entry_name_collision
  fails: 'InitialWorkDirRequirement entry already exists in the task directory: data'
- id: fanout_with_resources
  why: One output feeds two steps, each of which cats it whole, under a process that requests cpus and memory.
  tools:
    produce: {requirements: {ResourceRequirement: {coresMin: 2, ramMin: 64}}, baseCommand: [printf, '%s', fanout],
      stdout: data.txt, outputs: {result: {type: File, outputBinding: {glob: data.txt}}}}
    consume_a: {baseCommand: cat, inputs: {source: {type: File, inputBinding: {position: 1}}}, stdout: a.txt,
      outputs: {result: {type: File, outputBinding: {glob: a.txt}}}}
    consume_b: {baseCommand: cat, inputs: {source: {type: File, inputBinding: {position: 1}}}, stdout: b.txt,
      outputs: {result: {type: File, outputBinding: {glob: b.txt}}}}
  steps: |
    - id: produce
      out: [result: !& data]
    - id: consume_a
      in: {source: !* data}
    - id: consume_b
      in: {source: !* data}
  rendered: {contains: [cpus 2, memory "64 MB"]}
  outputs: {produce~result: {class: File, basename: data.txt, contents: fanout}, consume_a~result: {class: File,
    basename: a.txt, contents: fanout}, consume_b~result: {class: File, basename: b.txt, contents: fanout}}
- id: four_step_adapters
  why: The checked-in echo adapters print their message, and echo_3 its three joined into one word, each to its stdout.
  steps: |
    - {id: emit_single_1, run: echo, in: {message: !ii Sophios reaches Nextflow}}
    - {id: emit_triplet_1, run: echo_3, in: {message1: !ii spaces remain, message2: !ii one, message3: !ii argument}}
    - {id: emit_single_2, run: echo, in: {message: !ii a literal costs $5}}
    - {id: emit_triplet_2, run: echo_3, in: {message1: !ii literal, message2: !ii '&&',
        message3: !ii text is not shell syntax}}
  outputs: {emit_single_1~stdout: {class: File, basename: stdout, contents: "Sophios reaches Nextflow\n"},
    emit_triplet_1~stdout: {class: File, basename: stdout, contents: "spaces remain one argument\n"},
    emit_single_2~stdout: {class: File, basename: stdout, contents: "a literal costs $5\n"},
    emit_triplet_2~stdout: {class: File, basename: stdout, contents: "literal && text is not shell syntax\n"}}
- id: gathered_rescatter_broadcast_file
  why: A workflow input is one value, passed to every job of a scattered step, in the order CWL scatters.
  tools:
    echo_item: {baseCommand: echo, inputs: {item: {type: string, inputBinding: {position: 1}}}, stdout: a.txt,
      outputs: {out: {type: File, outputBinding: {glob: a.txt}}}}
    cat_pair: {baseCommand: cat, inputs: {f: {type: File, inputBinding: {position: 1}}, r: {type: File,
      inputBinding: {position: 2}}}, stdout: b.txt, outputs: {out: {type: File, outputBinding: {glob: b.txt}}}}
  steps: |
    - id: echo_item
      scatter: [item]
      scatterMethod: dotproduct
      in: {item: !ii ['1', '2', '3']}
      out: [out: !& items]
    - id: cat_pair
      scatter: [f]
      scatterMethod: dotproduct
      in: {f: !* items, r: !ii ref.txt}
  files: {ref.txt: "REF\n"}
  outputs: {echo_item~out: [{class: File, basename: a.txt, contents: "1\n"}, {class: File, basename: a.txt,
    contents: "2\n"}, {class: File, basename: a.txt, contents: "3\n"}], cat_pair~out: [{class: File, basename: b.txt,
    contents: "1\nREF\n"}, {class: File, basename: b.txt, contents: "2\nREF\n"}, {class: File, basename: b.txt,
    contents: "3\nREF\n"}]}
- id: gated_chain-queue-first
  why: &why_gated_chain A three-operand `when` over an upstream output, a parameter and an absent optional runs when
    all hold, whichever input its process declares first, and with an array input the command sees whole; a skipped
    upstream or a false parameter skips it.
  tools: &tools_gated_chain_first
    up: &tool_up {baseCommand: echo, arguments: [{position: 1, valueFrom: ok}], inputs: {go: boolean}, stdout: out.txt,
      outputs: {result: &text_result {type: string, outputBinding: {glob: out.txt, loadContents: true,
      outputEval: '$(self[0].contents)'}}}}
    gated: {baseCommand: echo, stdout: out.txt, outputs: {result: *text_result}, inputs: {prev: 'string?', flag: boolean,
      xs: {type: 'int[]', inputBinding: {position: 1}}, maybe: 'int?'}}
  inputs: &inputs_gated_chain {go: boolean, flag: boolean, maybe: 'int?', xs: 'int[]'}
  params: &params_gated_chain {go: true, flag: true, xs: [1, 2, 3]}
  steps: &steps_gated_chain |
    - id: up
      in: {go: !cwl {source: go}}
      out: [result: !& upped]
      when: $(inputs.go)
    - id: gated
      in:
        prev: !* upped
        flag: !cwl {source: flag}
        xs: !cwl {source: xs}
        maybe: !cwl {source: maybe}
      when: $(inputs.prev !== null && inputs.flag && inputs.maybe === null)
  outputs: {up~result: "ok\n", gated~result: "1 2 3\n"}
- id: gated_chain-queue-last
  why: *why_gated_chain
  tools:
    up: *tool_up
    gated: {baseCommand: echo, stdout: out.txt, outputs: {result: *text_result}, inputs: {flag: boolean,
      xs: {type: 'int[]', inputBinding: {position: 1}}, maybe: 'int?', prev: 'string?'}}
  inputs: *inputs_gated_chain
  params: *params_gated_chain
  steps: *steps_gated_chain
  outputs: {up~result: "ok\n", gated~result: "1 2 3\n"}
- id: gated_chain-skipped-upstream
  why: *why_gated_chain
  tools: *tools_gated_chain_first
  inputs: *inputs_gated_chain
  params: {go: false, flag: true, xs: [1, 2, 3]}
  steps: *steps_gated_chain
  outputs: {up~result: null, gated~result: null}
- id: gated_chain-false-parameter
  why: *why_gated_chain
  tools: *tools_gated_chain_first
  inputs: *inputs_gated_chain
  params: {go: true, flag: false, xs: [1, 2, 3]}
  steps: *steps_gated_chain
  outputs: {up~result: "ok\n", gated~result: null}
- id: golden_path
  why: touch makes an empty file, inferred into cp, which copies it.
  tools:
    touch_file: {baseCommand: touch, inputs: {filename: {type: string, inputBinding: {position: 1}}},
      outputs: {result: {type: File, outputBinding: {glob: $(inputs.filename)}}}}
    copy_file: &tool_copy_file {baseCommand: cp, arguments: [{position: 2, valueFrom: copy.txt}],
      inputs: {source: {type: File, inputBinding: {position: 1}}}, outputs: {result: {type: File,
      outputBinding: {glob: copy.txt}}}}
  steps: |
    - id: touch_file
      in: {filename: !ii message.txt}
    - id: copy_file
  outputs: {touch_file~result: {class: File, basename: message.txt, contents: ''}, copy_file~result: {class: File,
    basename: copy.txt, contents: ''}}
- id: iwdr_own_basename
  why: The bare $(inputs.<name>) listing makes the entry, which the command reads.
  tools:
    write_source: *tool_write_source
    stage_own_basename: {requirements: {InitialWorkDirRequirement: {listing: [$(inputs.source)]}}, baseCommand: cat,
      inputs: {source: {type: File, inputBinding: {position: 1}}}, stdout: out.txt, outputs: {result: {type: File,
      outputBinding: {glob: out.txt}}}}
  steps: |
    - id: write_source
      in: {message: !ii own basename staging}
    - id: stage_own_basename
  outputs: {write_source~result: {class: File, basename: lines.txt, contents: "own basename staging\n"},
    stage_own_basename~result: {class: File, basename: out.txt, contents: "own basename staging\n"}}
- id: iwdr_rename
  why: A literal entryname stages the file under the name the command hard-codes.
  tools:
    write_source: {baseCommand: echo, inputs: {message: {type: string, inputBinding: {position: 1}}},
      stdout: original_name.txt, outputs: {result: {type: File, outputBinding: {glob: original_name.txt}}}}
    stage_and_read: {requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source),
      entryname: renamed_by_iwdr.txt}]}}, baseCommand: cat, arguments: [renamed_by_iwdr.txt],
      inputs: {source: {type: File}}, stdout: out.txt, outputs: {result: {type: File, outputBinding: {glob: out.txt}}}}
  steps: |
    - id: write_source
      in: {message: !ii iwdr staged content}
    - id: stage_and_read
  outputs: {write_source~result: {class: File, basename: original_name.txt, contents: "iwdr staged content\n"},
    stage_and_read~result: {class: File, basename: out.txt, contents: "iwdr staged content\n"}}
- id: link_merge_joins_the_sources_in_order
  why: A step input of several sources joins them in order, flattened over a scattered step's Files and a lone one's,
    or nested over scalar Files, and a lone merge_nested source is an array of one.
  tools:
    write_each: &tool_write_name {baseCommand: echo, inputs: {name: {type: string, inputBinding: {position: 1}}},
      stdout: out.txt, outputs: {file: {type: File, outputBinding: {glob: out.txt}}}}
    write_one: *tool_write_name
    write_two: *tool_write_name
    cat_flat: &tool_cat {baseCommand: cat, inputs: {files: {type: 'File[]', inputBinding: {position: 1}}},
      stdout: all.txt, outputs: {line: {type: File, outputBinding: {glob: all.txt}}}}
    cat_nested: *tool_cat
    cat_single: *tool_cat
    say_nested: &tool_say {baseCommand: echo, inputs: {words: {type: 'string[]', inputBinding: {position: 1}}},
      stdout: out.txt, outputs: {line: {type: File, outputBinding: {glob: out.txt}}}}
    say_single: *tool_say
  inputs: {x: {type: string}, y: {type: string}}
  params: {x: x, y: y z}
  steps: |
    - id: write_each
      scatter: [name]
      scatterMethod: dotproduct
      in: {name: !ii [a, b]}
      out: [file: !& each]
    - id: write_one
      in: {name: !ii c}
      out: [file: !& one]
    - id: write_two
      in: {name: !ii d}
      out: [file: !& two]
    - id: cat_flat
      in:
        files: !cwl {source: [!* each, !* one], linkMerge: merge_flattened}
    - id: cat_nested
      in:
        files: !cwl {source: [!* two, !* one]}
    - id: cat_single
      in:
        files: !cwl {source: [!* one], linkMerge: merge_nested}
    - id: say_nested
      in:
        words: !cwl {source: [x, y]}
    - id: say_single
      in:
        words: !cwl {source: [x], linkMerge: merge_nested}
  outputs: {write_each~file: [{class: File, basename: out.txt, contents: "a\n"}, {class: File, basename: out.txt,
    contents: "b\n"}], write_one~file: {class: File, basename: out.txt, contents: "c\n"}, write_two~file: {class: File,
    basename: out.txt, contents: "d\n"}, cat_flat~line: {class: File, basename: all.txt, contents: "a\nb\nc\n"},
    cat_nested~line: {class: File, basename: all.txt, contents: "d\nc\n"}, cat_single~line: {class: File,
    basename: all.txt, contents: "c\n"}, say_nested~line: {class: File, basename: out.txt, contents: "x y z\n"},
    say_single~line: {class: File, basename: out.txt, contents: "x\n"}}
- id: literal_dollar_and_backtick_globs
  why: A `$` before no `(` or `{` is text, and a backtick beside a reference is text, so each glob names the file made.
    A plain input reference can carry a pattern, so globbing stays on.
  tools:
    literal: {baseCommand: [touch, out$name.txt], outputs: {result: {type: File, outputBinding: {glob: out$name.txt}}}}
    mixed: {baseCommand: touch, inputs: {name: {type: string}}, arguments: ['`$(inputs.name).txt'],
      outputs: {result: {type: File, outputBinding: {glob: '`$(inputs.name).txt'}}}}
  steps: |
    - id: literal
    - id: mixed
      in: {name: !ii report}
  rendered: {contains: ['path ''out$name.txt'', emit: result', 'path "`${name}.txt", arity: ''1'', emit: result']}
  outputs: {literal~result: {class: File, basename: out$name.txt, contents: ''}, mixed~result: {class: File,
    basename: '`report.txt', contents: ''}}
- id: nested_workflow
  why: A one-level subworkflow runs the copy its inlined form declares, of the message written outside it.
  tools:
    write_source: {baseCommand: echo, inputs: {message: {type: string, inputBinding: {position: 1}}},
      stdout: message.txt, outputs: {result: {type: File, outputBinding: {glob: message.txt}}}}
    copy_file: *tool_copy_file
  steps: |
    - id: write_source
      in: {message: !ii nested composition}
      out: [result: !& written]
    - id: child.wic
      in: {source: !* written}
  children:
    child: |
      inputs: {source: {type: File}}
      steps:
      - id: copy_file
        in: {source: source}
  outputs: {write_source~result: {class: File, basename: message.txt, contents: "nested composition\n"},
    child~copy_file~result: {class: File, basename: copy.txt, contents: "nested composition\n"}}
- id: optional_output-absent
  why: &why_optional_output A File? output is null for no match and the file for one; more fail the run, as in CWL.
  tools: {maybe: {baseCommand: 'true', outputs: {o: {type: 'File?', outputBinding: {glob: maybe.txt}}}}}
  outputs: {maybe~o: null}
- id: optional_output-pattern-none
  why: *why_optional_output
  tools: {maybe: {baseCommand: [touch, unmatched.txt], outputs: {o: {type: 'File?', outputBinding: {glob: '*.log'}}}}}
  outputs: {maybe~o: null}
- id: optional_output-pattern-one
  why: *why_optional_output
  tools: {maybe: {baseCommand: [touch, unmatched.txt, a.log], outputs: {o: {type: 'File?',
    outputBinding: {glob: '*.log'}}}}}
  outputs: {maybe~o: {class: File, basename: a.log, contents: ''}}
- id: optional_output-pattern-two
  why: *why_optional_output
  tools: {maybe: {baseCommand: [touch, unmatched.txt, a.log, b.log], outputs: {o: {type: 'File?',
    outputBinding: {glob: '*.log'}}}}}
  fails: matched 2 files; it takes at most one
- id: optional_output-present
  why: *why_optional_output
  tools: {maybe: {baseCommand: [touch, maybe.txt], outputs: {o: {type: 'File?', outputBinding: {glob: maybe.txt}}}}}
  outputs: {maybe~o: {class: File, basename: maybe.txt, contents: ''}}
- id: pattern_glob_matches_iwdr_entry
  why: A pattern glob, or a glob of the input's own basename, captures the entry the task made, as a CWL glob does.
  tools:
    write_source: {baseCommand: echo, inputs: {message: {type: string, inputBinding: {position: 1}}}, stdout: lines.txt,
      outputs: {result: {type: File, outputBinding: {glob: lines.txt}}}}
    own: {requirements: {InitialWorkDirRequirement: {listing: [$(inputs.source)]}}, baseCommand: 'true',
      inputs: {source: File}, outputs: {wild: {type: File, outputBinding: {glob: lines*}}, same: {type: File,
      outputBinding: {glob: $(inputs.source.basename)}}}}
    renamed: {requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source),
      entryname: renamed.txt}]}}, baseCommand: 'true', inputs: {source: File}, outputs: {wild: {type: File,
      outputBinding: {glob: renamed*}}}}
  steps: |
    - id: write_source
      in: {message: !ii entry content}
      out: [result: !& written]
    - id: own
      in: {source: !* written}
    - id: renamed
      in: {source: !* written}
  outputs: {write_source~result: {class: File, basename: lines.txt, contents: "entry content\n", link: false},
    own~wild: {class: File, basename: lines.txt, contents: "entry content\n", link: true},
    own~same: {class: File, basename: lines.txt, contents: "entry content\n", link: true},
    renamed~wild: {class: File, basename: renamed.txt, contents: "entry content\n", link: true}}
- id: pick_value_picks_from_the_joined_sources
  why: first_non_null, the_only_non_null and all_non_null pick among a joined list of workflow inputs and conditional
    steps' outputs, skipping the null of an absent input and of a skipped step.
  tools:
    skipped: *tool_maybe
    ran: *tool_maybe
    first: *tool_say_word
    only: *tool_say_word
    every: {baseCommand: echo, inputs: {words: {type: 'string[]', inputBinding: {position: 1}}}, stdout: out.txt,
      outputs: {line: {type: File, outputBinding: {glob: out.txt}}}}
  inputs: {unset: 'string?', given: 'string?'}
  params: {unset: null, given: x}
  steps: |
    - id: skipped
      in: {text: !ii never, go: !ii false}
      out: [said: !& skipped_said]
      when: $(inputs.go)
    - id: ran
      in: {text: !ii only, go: !ii true}
      out: [said: !& ran_said]
      when: $(inputs.go)
    - id: first
      in: {words: !cwl {source: [unset, !* skipped_said, given], pickValue: first_non_null}}
    - id: only
      in: {words: !cwl {source: [!* skipped_said, !* ran_said], pickValue: the_only_non_null}}
    - id: every
      in: {words: !cwl {source: [given, !* skipped_said, !* ran_said, unset], pickValue: all_non_null}}
  outputs: {skipped~said: null, ran~said: only, first~line: {class: File, basename: out.txt, contents: "x\n"},
    only~line: {class: File, basename: out.txt, contents: "only\n"},
    every~line: {class: File, basename: out.txt, contents: "x only\n"}}
- id: pick_value_finding_no_one_value-first_non_null-of-none
  why: &why_pick_none A pickValue that finds no one value stops the run before the step runs, naming the count it found.
  tools: {pick: *tool_say_word}
  inputs: {a: 'string?', b: 'string?'}
  params: {a: null, b: null}
  steps: |
    - id: pick
      in: {words: !cwl {source: [a, b], pickValue: first_non_null}}
  never: [out.txt]
  fails: 'Sophios step input pick.words: first_non_null finds 0 values that are not null'
- id: pick_value_finding_no_one_value-the_only_non_null-of-none
  why: *why_pick_none
  tools: {pick: *tool_say_word}
  inputs: {a: 'string?', b: 'string?'}
  params: {a: null, b: null}
  steps: |
    - id: pick
      in: {words: !cwl {source: [a, b], pickValue: the_only_non_null}}
  never: [out.txt]
  fails: 'Sophios step input pick.words: the_only_non_null finds 0 values that are not null'
- id: pick_value_finding_no_one_value-the_only_non_null-of-two
  why: *why_pick_none
  tools: {pick: *tool_say_word}
  inputs: {a: 'string?', b: 'string?'}
  params: {a: x, b: y}
  steps: |
    - id: pick
      in: {words: !cwl {source: [a, b], pickValue: the_only_non_null}}
  never: [out.txt]
  fails: 'Sophios step input pick.words: the_only_non_null finds 2 values that are not null'
- id: shipped_append_appends_the_message_as_written
  why: 'The shipped `append.cwl` appends one line holding exactly the message, whose shell syntax and backslashes are
    text: a separator, a run of spaces, a quote, a substitution, a glob; the file it was given keeps its contents.'
  steps: |
    - id: append
      in: {file: !ii greeting.txt, str: !ii "Hello;  it's $(echo substituted) * a\\tb\\nc 100%s"}
  files: {greeting.txt: "first line\n"}
  outputs: {append~file: {class: File, basename: greeting.txt,
    contents: "first line\nHello;  it's $(echo substituted) * a\\tb\\nc 100%s\n"}}
- id: shell_redirect_literal
  why: An approved shellQuote false literal reaches the shell as real redirect syntax; printf writes its one quoted
    word.
  tools: {shell_redirect: {requirements: {ShellCommandRequirement: {}}, baseCommand: printf, arguments: [{position: 1,
    valueFrom: '%s'}, {position: 2, valueFrom: payload; not a separate command}, {position: 3, valueFrom: '>>',
    shellQuote: false}, {position: 4, valueFrom: redirected.txt}], outputs: {result: {type: File,
    outputBinding: {glob: redirected.txt}}}}}
  outputs: {shell_redirect~result: {class: File, basename: redirected.txt, contents: payload; not a separate command}}
- id: single_capture_literal_braces
  why: A CWL glob has no brace expansion, so the one capture is the file named with braces.
  tools: {write_one: {baseCommand: echo, inputs: {message: {type: string, inputBinding: {position: 1}}},
    stdout: 'out{1,2}.txt', outputs: {result: {type: File, outputBinding: {glob: 'out{1,2}.txt',
    outputEval: '$(self[0])'}}}}}
  steps: |
    - id: write_one
      in: {message: !ii one match only}
  outputs: {write_one~result: {class: File, basename: 'out{1,2}.txt', contents: "one match only\n"}}
- id: single_capture_missing_fails
  why: Zero matches of a declared single output fail the run, naming the glob, never an empty channel.
  tools: {write_nothing: {baseCommand: 'true', inputs: {message: {type: string, inputBinding: {position: 1}}},
    outputs: {result: {type: File, outputBinding: {glob: out.txt, outputEval: '$(self[0])'}}}}}
  steps: |
    - id: write_nothing
      in: {message: !ii nothing is written}
  fails: out.txt
- id: skipped_step_feeds_an_optional_input
  why: A skipped step makes no task and a null output, and a step with an optional input reading it still runs.
  tools:
    produce: {baseCommand: [echo, produced], inputs: {n: int}, stdout: out.txt, outputs: {text: {type: string,
      outputBinding: {glob: out.txt, loadContents: true, outputEval: '$(self[0].contents)'}}}}
    consume: {baseCommand: [touch, done.txt], inputs: {maybe: 'string?'}, outputs: {done: {type: File,
      outputBinding: {glob: done.txt}}}}
  steps: |
    - id: produce
      in: {n: !ii 0}
      out: [text: !& produced]
      when: $(inputs.n > 0)
    - id: consume
      in: {maybe: !* produced}
  outputs: {produce~text: null, consume~done: {class: File, basename: done.txt, contents: ''}}
  never: [out.txt]
- id: stdout_of_every_shell_command
  why: CWL redirects stdout for the whole shell command, not its last part, so both echoes land in out.txt.
  tools: {two_commands: {requirements: {ShellCommandRequirement: {}}, baseCommand: echo, arguments: [{position: 1,
    valueFrom: first}, {position: 2, valueFrom: ;, shellQuote: false}, {position: 3, valueFrom: echo}, {position: 4,
    valueFrom: second}], stdout: out.txt, outputs: {result: {type: File, outputBinding: {glob: out.txt}}}}}
  outputs: {two_commands~result: {class: File, basename: out.txt, contents: "first\nsecond\n"}}
- id: when_in_an_inlined_child
  why: The inlined inner step keeps its condition and is skipped; the outer step still runs.
  tools: {touch_n: {baseCommand: [touch, n.txt], inputs: {n: int}, outputs: {out: {type: File,
    outputBinding: {glob: n.txt}}}}}
  steps: |
    - id: child.wic
    - id: touch_n
      in: {n: !ii 3}
  children:
    child: |
      steps:
      - id: touch_n
        in: {n: !ii 3}
        when: $(inputs.n > 5)
  outputs: {child~touch_n~out: null, touch_n~out: {class: File, basename: n.txt, contents: ''}}
- id: when_non_finite_fails
  why: A non-finite subexpression of a condition fails the run, naming the step, the expression and the subexpression.
  tools: {c0: {baseCommand: [touch, c0.txt], inputs: {i: int}, outputs: {out: {type: File,
    outputBinding: {glob: c0.txt}}}}}
  steps: |
    - id: c0
      in: {i: !ii 7}
      when: $(inputs.i / (inputs.i - 7) > 0)
  never: [c0.txt]
  fails: 'Sophios expression c0 when ((inputs.i / (inputs.i - 7)) > 0): (inputs.i / (inputs.i - 7)) is Infinity'
- id: when_per_scatter_combination
  why: The condition sees each invocation's scattered elements and the broadcast value; the gather keeps null where it
    skips, whatever order the tasks finish in.
  tools: {pair: {baseCommand: [sh, -c, 'sleep "$2"; printf %s-%s "$1" "$2"', pair], inputs: {item: {type: string,
    inputBinding: {position: 1}}, tag: {type: string, inputBinding: {position: 2}}, skipped: string}, stdout: out.txt,
    outputs: {line: {type: File, outputBinding: {glob: out.txt}}}}}
  steps: |
    - id: pair
      scatter: [item, tag]
      scatterMethod: dotproduct
      in: {item: !ii [a, b, c], tag: !ii ['2', '1', '0'], skipped: !ii '1'}
      when: $(inputs.tag !== inputs.skipped)
  outputs: {pair~line: [{class: File, basename: out.txt, contents: a-2}, null, {class: File, basename: out.txt,
    contents: c-0}]}
- id: when_per_scatter_invocation
  why: The condition runs per invocation, and the gather keeps null at the skipped position.
  tools: {pair: {baseCommand: printf, arguments: [{position: 0, valueFrom: '%s-%s'}], inputs: {a: {type: string,
    inputBinding: {position: 1}}, b: {type: string, inputBinding: {position: 2}}}, stdout: out.txt, outputs: {line: {
    type: File, outputBinding: {glob: out.txt}}}}}
  steps: |
    - id: pair
      scatter: [a, b]
      scatterMethod: dotproduct
      in: {a: !ii [a, b, c], b: !ii [x, y, z]}
      when: $(inputs.a !== 'b')
  outputs: {pair~line: [{class: File, basename: out.txt, contents: a-x}, null, {class: File, basename: out.txt,
    contents: c-z}]}
- id: wildcard_output-one
  why: A scalar File output whose glob matches one file is that file; the tool declares its input in `T[]` shorthand.
  tools: &tools_wildcard_output {make: {baseCommand: touch, inputs: {names: {type: 'string[]',
    inputBinding: {position: 1}}}, outputs: {result: {type: File, outputBinding: {glob: '*.txt'}}}}}
  steps: |
    - id: make
      in: {names: !ii [a.txt]}
  outputs: {make~result: {class: File, basename: a.txt, contents: ''}}
- id: wildcard_output-several
  why: A scalar File output whose glob matches several files fails the run, as cwltool does.
  tools: *tools_wildcard_output
  steps: |
    - id: make
      in: {names: !ii [a.txt, b.txt]}
  fails: true
- id: writable_out_dir_entry
  why: 'The image-workflows plugin shape: a writable entry is a copy the tool writes into, which its own-basename glob
    captures, and the input it was copied from is left as it was.'
  tools: {plugin: {requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.outDir), writable: true}]}},
    baseCommand: [sh, -c, printf written > "$2/result.txt", plugin], inputs: {outDir: {type: Directory,
    inputBinding: {position: 1, prefix: --outDir}}}, outputs: {outDir: {type: Directory,
    outputBinding: {glob: $(inputs.outDir.basename)}}}}}
  steps: |
    - id: plugin
      in: {outDir: !ii plugin_out}
  files: {plugin_out/keep.txt: "kept\n"}
  outputs: {plugin~outDir: {class: Directory, basename: plugin_out, link: false, contents: {keep.txt: "kept\n",
    result.txt: written}}}
