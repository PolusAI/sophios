   ['step ''SUFFIXED'': tool ''SUFFIXED.cwl: inputs.value.inputBinding.valueFrom'': $(inputs.value.path) requires a File
   or Directory input, and value is declared ''string''', 'step ''SUFFIXED'': tool ''SUFFIXED.cwl: stdout'':
   $(inputs.value.path) requires a File or Directory input, and value is declared ''string''']}}
