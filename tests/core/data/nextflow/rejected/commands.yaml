# Commands, bindings, flags, arrays and variables the target refuses (design §6, Expressions, Commands, Inputs and
# channels, Resources and containers). Each `findings` or `error` is the diagnostic the replaced test wrote by hand from
# that rule, copied verbatim; nothing here was read off a run.
- id: absent_optional_flag_that_is_also_dereferenced
  why: A flag only tests its value, but a template dereferences it, so absence would render `--label=[]`.
  tool: {inputs: {verbose: {type: ['null', boolean], inputBinding: {position: 1, prefix: --verbose}}},
    arguments: [{position: 2, valueFrom: '--label=$(inputs.verbose)'}]}
  job: {verbose: null}
  findings: ['steps[0].run.inputs.verbose: absent optional values are supported only for a val input whose absence
    leaves command rendering unchanged']
- id: absent_optional_input_referenced_outside_its_own_binding
  why: Only the input's own binding is presence-gated; a reference elsewhere would render the sentinel.
  tool: {id: OPTIONAL, inputs: {message: {type: ['null', string], inputBinding: {position: 1, prefix: --message}}},
    arguments: [{position: 2, valueFrom: $(inputs.message)}]}
  job: &no_message {message: null}
  error: &absent_message {re: 'steps\[0\].run.inputs.message: absent optional values are supported only for a val input
    whose absence leaves command rendering unchanged'}
- id: absent_optional_input_whose_binding_emits_a_shell_literal
  why: CWL omits the entire binding when its optional source is absent.
  tool: {id: OPTIONAL, requirements: {ShellCommandRequirement: {}}, inputs: {message: {type: ['null', string],
    inputBinding: {position: 1, valueFrom: printf optional, shellQuote: false}}}}
  job: *no_message
  error: *absent_message
- {id: absent_optional_input_whose_binding_has_a_literal_value_from, job: *no_message, error: *absent_message, why: CWL
   omits the prefix and the literal when the optional source is absent., tool: {id: OPTIONAL, inputs: {message: {type:
   ['null', string], inputBinding: {position: 1, prefix: --message, valueFrom: literal}}}}}
- {id: absent_optional_input_referenced_via_another_bindings_value_from, job: *no_message, error: *absent_message, why:
   'No binding of its own, but referenced elsewhere.', tool: {id: OPTIONAL, inputs: {message: {type: ['null', string]}},
   arguments: [{position: 1, valueFrom: $(inputs.message)}]}}
- {id: absent_optional_path_input, why: Path channel construction always stages., job: *no_message, tool: {id: OPTIONAL,
   inputs: {message: {type: ['null', File]}}}, error: *absent_message}
- {id: absent_optional_workflow_input_feeding_required_input, why: A required input takes a value., workflow: {steps:
   [{id: REQUIRED, in: {message: message}}], inputs: {message: {type: ['null', string]}}}, tools: [{id: REQUIRED,
   inputs: {message: {type: string}}}], error: {re: absent required}}
- id: absent_optional_array_input
  why: Absence (no array at all) is out of scope for the array lowering; empty is not absence.
  tool: {inputs: {values: {type: ['null', {type: array, items: string}], inputBinding: {position: 1, prefix:
    --value}}}}
  job: {values: null}
  error: {re: 'steps\[0\].run.inputs.values: absent optional'}
- id: an_env_var_from_an_absent_input
  why: An absent optional value has no text to export.
  tool: &env {id: ENV, inputs: {s: {type: string}, n: {type: int}, f: {type: File}, o: {type: 'string?'}}, requirements:
    {EnvVarRequirement: {envDef: [{envName: A, envValue: $(inputs.o)}]}}}
  job: &env_job_without_o {s: v, n: 1, f: {class: File, path: x.txt}}
  findings: ['steps[0].run.inputs.o: absent optional values are supported only for a val input whose absence leaves
    command rendering unchanged']
- {id: an_env_def_entry_with_an_unknown_field, why: A field nothing lowers is refused naming itself., tool: {<<: *env,
   requirements: {EnvVarRequirement: {envDef: {A: {envValue: x, foo: 1}}}}}, job: &env_job {<<: *env_job_without_o, o:
   w}, findings: ['steps[0].run.requirements.EnvVarRequirement.envDef.A.foo: foo is not consumed by the Nextflow
   lowering']}
- {id: an_env_var_from_an_int_input, why: &env_value 'design §6, Resources and containers: a variable is literal text or
   one string input''s value, read whole; every other value is refused by name.', job: *env_job, tool: {<<: *env,
   requirements: {EnvVarRequirement: {envDef: [{envName: A, envValue: $(inputs.n)}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*needs a string input, read whole as
   \$\(inputs\.<name>\); n is declared ''int'''}]}
- {id: an_env_var_from_a_file_path, why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(inputs.f.path)}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*needs a string input'}]}
- {id: an_env_var_from_a_basename, why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(inputs.s.basename)}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*needs a string input'}]}
- {id: an_env_var_with_text_beside_a_reference, why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: A, envValue: pre-$(inputs.s)}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*is not supported: write literal text or exactly
   \$\(inputs\.<name>\)'}]}
- {id: an_env_var_from_javascript, why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: '${return 1}'}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*is not supported'}]}
- {id: an_env_var_from_the_runtime, why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(runtime.cores)}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*is not supported'}]}
- {id: an_env_var_name_that_is_not_a_shell_name, why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: 1A, envValue: x}]}}}, findings: [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*environment variable name must be a shell variable
   name, got ''1A'''}]}
- {id: an_env_var_value_that_is_not_text, why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: A, envValue: 3}]}}}, findings: &env_entry [{re:
   '^steps\[0\]\.run\.requirements\.EnvVarRequirement\.envDef\[0\]: .*an envDef entry needs a string envName and a
   string envValue'}]}
- {id: an_env_def_entry_that_is_not_a_mapping, why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [A=x]}}}, findings: *env_entry}
- {id: loadContents_on_an_arguments_entry, why: A binding's loadContents has no lowering., tool: {arguments:
   [{valueFrom: x, loadContents: true}]}, findings: ["steps[0].run.arguments[0].loadContents: a binding's loadContents
   is not supported"]}
- id: shell_mode_in_a_container
  why: CWL runs the command as /bin/sh -c after the image's ENTRYPOINT, which the Nextflow task does not.
  tool: {id: SHELL, requirements: {DockerRequirement: &ubuntu {dockerPull: 'ubuntu:24.04'}, ShellCommandRequirement:
    {}}}
  findings: ["steps[0].run: ShellCommandRequirement beside a DockerRequirement is not supported: CWL runs the command as
    /bin/sh -c after the image's ENTRYPOINT, which the Nextflow task does not"]
- id: a_containerized_command_that_can_render_empty
  why: CWL then gives the container no arguments, so the image runs its CMD, which the Nextflow task does not.
  tool: {id: ENTRY, baseCommand: null, requirements: {DockerRequirement: *ubuntu}, inputs: {name: {type: 'string?',
    inputBinding: {prefix: --name}}, verbose: {type: boolean, inputBinding: {prefix: -v}}}}
  job: {verbose: false}
  findings: ['steps[0]: a containerized tool whose command can render empty is not supported: CWL then gives the
    container no arguments, so the image runs its CMD, after its ENTRYPOINT if it has one, which the Nextflow task does
    not; name the program in baseCommand']
- id: nested_arrays
  why: &producer_feeds A producing step feeds the array, so the items' schema is refused rather than the value's shape.
  workflow: &array_from_producer {steps: [{id: PRODUCER, out: [{out: {wic_anchor: produced}}]}, {id: ARRAY, in: {values:
    {wic_alias: produced}}}]}
  tools: [{id: PRODUCER, outputs: {out: {type: &nested {type: array, items: {type: array, items: string}},
    outputBinding: {glob: out.txt}}}}, {id: ARRAY, inputs: {values: {type: *nested, inputBinding: {position: 1}}}}]
  error: {re: nested arrays are deferred}
- {id: per_item_input_binding_on_array_items, why: *producer_feeds, workflow: *array_from_producer, tools: [{id:
   PRODUCER, outputs: {out: {type: {type: array, items: File}, outputBinding: {glob: '*.txt'}}}}, {id: ARRAY, inputs:
   {values: {type: {type: array, items: {type: File, inputBinding: {prefix: -I}}}, inputBinding:
   {position: 1}}}}], error: {re: per-item array element bindings are deferred}}
- {id: separate_false_on_an_array_binding, why: An array binding's separate false is deferred., tool: {id: ARRAY,
   inputs: {values: {type: {type: array, items: string}, inputBinding: {position: 1, separate: false}}}}, job: {values:
   [a, b]}, error: {re: 'separate: false on an array-typed inputBinding.*deferred'}}
- {id: array_value_with_a_mismatched_item_type, why: A value has the shape of its declared type., tool: {inputs:
   {values: {type: {type: array, items: string}, inputBinding: {position: 1}}}}, job: {values: [a, 1]}, error:
   {re: does not match its supported CWL type}}
- {id: a_boolean_argument_position, why: 'A position is an integer, and true is none, though Python reads it as 1.',
   tool: {arguments: [{valueFrom: x, position: true}]}, error: {re: non-integer CWL command position}}
- {id: a_boolean_array_binding-prefix, why: &booleans 'cwltool renders [true, false] bound with prefix -x as -x alone,
   and with no prefix as nothing.', job: &true_false {values: [true, false]}, tool: {id: ARRAY, inputs: {values: {type:
   {type: array, items: boolean}, inputBinding: {position: 1, prefix: -x}}}}, error: &boolean_array {re:
   'run\.inputs\.values\.inputBinding: a boolean array''s binding is not supported: CWL adds only its prefix'}}
- {id: a_boolean_array_binding-no-prefix, why: *booleans, job: *true_false, error: *boolean_array, tool: {id: ARRAY,
   inputs: {values: {type: {type: array, items: {type: boolean}}, inputBinding: {position: 1}}}}}
- {id: a_boolean_array_binding-optional, why: *booleans, job: *true_false, error: *boolean_array, tool: {id: ARRAY,
   inputs: {values: {type: {type: array, items: ['null', boolean]}, inputBinding: {position: 1, prefix: -x}}}}}
- {id: a_boolean_array_binding-optional-shorthand, why: *booleans, job: *true_false, error: *boolean_array, tool: {id:
   ARRAY, inputs: {values: {type: {type: array, items: 'boolean?'}, inputBinding: {position: 1, prefix: -x}}}}}
- id: shell_quote_false_without_shell_command_requirement
  why: &unquoted 'design §6, Commands: only a literal valueFrom, under ShellCommandRequirement, is unquoted.'
  tool: {id: SHELL, outputs: &result {result: {type: File, outputBinding: {glob: out.txt}}}, arguments: [{valueFrom:
    '>>', shellQuote: false}]}
  out: &out [result]
  error: {re: requires ShellCommandRequirement}
- {id: shell_quote_false_with_no_value_from, why: *unquoted, out: *out, error: {re: has no valueFrom}, tool: &shell {id:
   SHELL, outputs: *result, requirements: {ShellCommandRequirement: {}}, arguments: [{shellQuote: false}]}}
- {id: shell_quote_false_with_a_prefix, why: *unquoted, out: *out, error: &prefixed {re: does not support a prefix},
   tool: {<<: *shell, arguments: [{valueFrom: '>>', shellQuote: false, prefix: -x}]}}
- {id: shell_quote_false_input_binding_with_no_value_from, why: 'shellQuote: false on a plain, no-valueFrom
   inputBinding.', out: *out, error: *prefixed, job: {text: Hello}, tool: {outputs: *result, requirements:
   {ShellCommandRequirement: {}}, inputs: {text: {type: string, inputBinding: {shellQuote: false, position: 1, prefix:
   echo}}}}}
- {id: shell_quote_false_referencing_an_input-bare, out: *out, job: &hi {message: hi}, error: &references {re:
   references an input}, why: &unquoting_input 'Unquoting a value derived from any input, directly or via a suffix, is
   the boundary.', tool: &shell_input {<<: *shell, inputs: {message: {type: string}}, arguments: [{valueFrom:
   $(inputs.message), shellQuote: false}]}}
- {id: shell_quote_false_referencing_an_input-embedded, why: *unquoting_input, out: *out, job: *hi, error: *references,
   tool: {<<: *shell_input, arguments: [{valueFrom: prefix-$(inputs.message)-suffix, shellQuote: false}]}}
- {id: shell_quote_false_referencing_an_input-basename-suffix, why: *unquoting_input, out: *out, job: *hi, error:
   *references, tool: {<<: *shell_input, arguments: [{valueFrom: $(inputs.message.basename), shellQuote: false}]}}
- {id: a_dollar_in_a_shell_quote_false_literal-variable, why: &expand "design §6, Commands: the task's bash -ue would
   expand it, not CWL's sh -c.", out: *out, error: &dollar {re: "holds a '\\$', which the task's shell would expand"},
   tool: {<<: *shell, arguments: [{valueFrom: '[$UNSET]', shellQuote: false}]}}
- {id: a_dollar_in_a_shell_quote_false_literal-escaped_substitution, why: *expand, out: *out, error: *dollar, tool: {<<:
   *shell, arguments: [{valueFrom: '\$(date)', shellQuote: false}]}}
- {id: value_from_aliasing_a_different_input_on_a_boolean_binding, job: {verbose: true, other: false}, why: Aliasing a
   different input's presence onto this flag has no approved lowering., tool: {inputs: {verbose: {type:
   boolean, inputBinding: {position: 1, prefix: --verbose, valueFrom: $(inputs.other)}}, other: {type: boolean}}},
   error: &boolean_value_from {re: valueFrom on a boolean inputBinding is supported only as}}
- {id: literal_value_from_on_a_boolean_binding, why: A literal string is not a provably-boolean valueFrom result., job:
   &verbose {verbose: true}, error: *boolean_value_from, tool: {inputs: {verbose: {type: boolean,
   inputBinding: {position: 1, prefix: --verbose, valueFrom: 'true'}}}}}
- {id: basename_suffixed_value_from_on_a_boolean_binding, why: 'A .basename suffix is never boolean-shaped, even on a
   self-reference.', job: *verbose, error: *boolean_value_from, tool: {inputs: {verbose: {type: boolean,
   inputBinding: {position: 1, prefix: --verbose, valueFrom: $(inputs.verbose.basename)}}}}}
- {id: a_boolean_valuefrom_on_an_optional_input, why: An optional input would render its absence., job: {b: true, s: x},
   tool: {baseCommand: echo, arguments: [], inputs: {b: {type: boolean}, s: {type: 'string?', inputBinding:
   {valueFrom: $(inputs.b), prefix: --flag}}}}, error: {re: "a boolean valueFrom on optional input 's' is not
   supported"}}
- {id: a_dollar_starting_a_runtime_expression, why: &expression 'design §6, Commands: a `$` followed by `(` or `{`
   starts an expression, and only an input reference is one the target reads.', job: &x {x: v}, tool:
   &args {baseCommand: echo, inputs: {x: {type: string}}, arguments: [$(runtime.cores)]}, error: &unsupported {re:
   unsupported
   CWL expression}}
- {id: a_dollar_starting_javascript, why: *expression, job: *x, error: *unsupported, tool: {<<: *args, arguments:
   ['${return 1}']}}
- {id: a_dollar_starting_a_property_of_a_string, why: *expression, job: *x, error: *unsupported, tool: {<<: *args,
   arguments: [cost $5 $(inputs.x.size)]}}
- {id: a_dollar_before_an_expression_on_self, why: *expression, job: *x, error: *unsupported, tool: {<<: *args,
   arguments: [$$(self)]}}
- id: a_value_input_read_as_a_path
  why: &path_of_value 'design §6, Commands: `.path` and `.basename` read a File or Directory.'
  tool: {id: BASENAME, inputs: {label: {type: string}}, outputs: {result: {type: File, outputBinding: {glob:
    $(inputs.label.basename).txt}}}}
  out: *out
  job: {label: input}
  findings: ["steps[0].run.outputs.result.outputBinding.glob: $(inputs.label.basename) requires a File or Directory
    input, and label is declared 'string'"]
- {id: path_of_a_string, why: *path_of_value, job: {value: x}, tool: {stdout: $(inputs.value.path).log,
   inputs: {value: {type: string, inputBinding: {prefix: -v, valueFrom: $(inputs.value.path)}}}}, findings: {contains: [
   "steps[0].run.inputs.value.inputBinding.valueFrom: $(inputs.value.path) requires a File or Directory input, and value
   is declared 'string'", "steps[0].run.stdout: $(inputs.value.path) requires a File or Directory input, and value is
   declared 'string'"]}}
- {id: path_of_an_int, why: *path_of_value, job: {value: 1}, tool: {stdout: $(inputs.value.path).log,
   inputs: {value: {type: int, inputBinding: {prefix: -v, valueFrom: $(inputs.value.path)}}}}, findings: {contains: [
   "steps[0].run.inputs.value.inputBinding.valueFrom: $(inputs.value.path) requires a File or Directory input, and value
   is declared 'int'", "steps[0].run.stdout: $(inputs.value.path) requires a File or Directory input, and value is
   declared 'int'"]}}
- {id: path_of_a_float, why: *path_of_value, job: {value: 1.5}, tool: {stdout: $(inputs.value.path).log,
   inputs: {value: {type: float, inputBinding: {prefix: -v, valueFrom: $(inputs.value.path)}}}}, findings: {contains: [
   "steps[0].run.inputs.value.inputBinding.valueFrom: $(inputs.value.path) requires a File or Directory input, and value
   is declared 'float'", "steps[0].run.stdout: $(inputs.value.path) requires a File or Directory input, and value is
   declared 'float'"]}}
- {id: path_of_a_boolean, why: *path_of_value, job: {value: true}, tool: {stdout:
   $(inputs.value.path).log, inputs: {value: {type: boolean, inputBinding: {prefix: -v, valueFrom:
   $(inputs.value.path)}}}}, findings: {contains: [ "steps[0].run.inputs.value.inputBinding.valueFrom:
   $(inputs.value.path) requires a File or Directory input, and value is declared 'boolean'", "steps[0].run.stdout:
   $(inputs.value.path) requires a File or Directory input, and value is declared 'boolean'"]}}
- {id: basename_of_a_string, why: *path_of_value, job: {value: x}, tool: {stdout:
   $(inputs.value.basename).log, inputs: {value: {type: string, inputBinding: {prefix: -v, valueFrom:
   $(inputs.value.basename)}}}}, findings: {contains: ["steps[0].run.inputs.value.inputBinding.valueFrom:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'string'", "steps[0].run.stdout:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'string'"]}}
- {id: basename_of_an_int, why: *path_of_value, job: {value: 1}, tool: {stdout:
   $(inputs.value.basename).log, inputs: {value: {type: int, inputBinding: {prefix: -v, valueFrom:
   $(inputs.value.basename)}}}}, findings: {contains: ["steps[0].run.inputs.value.inputBinding.valueFrom:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'int'", "steps[0].run.stdout:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'int'"]}}
- {id: basename_of_a_float, why: *path_of_value, job: {value: 1.5}, tool: {stdout:
   $(inputs.value.basename).log, inputs: {value: {type: float, inputBinding: {prefix: -v, valueFrom:
   $(inputs.value.basename)}}}}, findings: {contains: ["steps[0].run.inputs.value.inputBinding.valueFrom:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'float'", "steps[0].run.stdout:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'float'"]}}
- {id: basename_of_a_boolean, why: *path_of_value, job: {value: true}, tool: {stdout:
   $(inputs.value.basename).log, inputs: {value: {type: boolean, inputBinding: {prefix: -v, valueFrom:
   $(inputs.value.basename)}}}}, findings: {contains: ["steps[0].run.inputs.value.inputBinding.valueFrom:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'boolean'", "steps[0].run.stdout:
   $(inputs.value.basename) requires a File or Directory input, and value is declared 'boolean'"]}}
- {id: a_file_reference_embedded_in_text, why: 'design §6, Commands: CWL renders an embedded File object as JSON.', job:
   {f: {class: File, path: in.txt}, s: x}, tool: {id: EMBEDDED, inputs: {f: {type: File}, s: {type: string}}, arguments:
   ['--input=$(inputs.f)']}, findings: ['steps[0].run.arguments[0]: $(inputs.f) embedded in other text renders a File
   object as JSON in CWL; use $(inputs.f.path) or $(inputs.f.basename), or the reference alone']}
- id: an_empty_boolean_prefix
  why: &lowering_only A rejection only the lowering finds is a finding at its step, beside the rest.
  tool: {inputs: {b: {type: boolean, inputBinding: {prefix: ''}}}}
  job: &b {b: true}
  findings: &bad_prefix [{re: '^steps\[0\]: .*prefix for ''b'' must be a non-empty string'}]
- {id: a_blank_boolean_prefix, why: 'A blank prefix hits the named diagnostic, not the flag''s own invariant.', job: *b,
   tool: {inputs: {b: {type: boolean, inputBinding: {prefix: '   '}}}}, findings: *bad_prefix}
- {id: separate_without_a_prefix, why: cwltool rejects separate without a prefix., job: {s: x}, tool: {inputs: {s:
   {type: string, inputBinding: {separate: false}}}}, findings: &no_prefix [{re: '^steps\[0\]: .*separate
   cannot be specified without a prefix'}]}
- {id: boolean_separate_without_a_prefix, why: cwltool rejects separate without a prefix., job: *b, tool: {inputs: {b:
   {type: boolean, inputBinding: {separate: false}}}}, findings: *no_prefix}
- {id: boolean_separate_null, why: &null_separate 'cwltool''s .get("separate", True) defaults only an absent key, so
   separate: null rejects too.', job: *b, tool: {inputs: {b: {type: boolean, inputBinding: {separate:
   null}}}}, findings: *no_prefix}
- {id: string_separate_null, why: *null_separate, job: {s: x}, findings: *no_prefix, tool: {inputs: {s:
   {type: string, inputBinding: {separate: null}}}}}
- {id: a_value_from_on_an_array_binding, why: *lowering_only, job: {xs: [x]}, tool: {inputs: {xs: {type:
   {type: array, items: string}, inputBinding: {valueFrom: $(inputs.xs)}}}}, findings: [{re: '^steps\[0\]: .*valueFrom
   on an array-typed inputBinding'}]}
- id: lowering_rejections_aggregate_with_every_other_finding_by_step
  why: Each step's lowering rejection is a finding in step order, beside a capability finding.
  workflow: {steps: [{id: GATED, in: {a: a}, when: $(inputs.a ** 2 > 1)}, {id: GATED, in: {a: a}, when: $(inputs.a +
    1)}, {id: UNSUPPORTED}], inputs: {a: int}}
  tools: [&gated {id: GATED, inputs: {a: {type: int}}, baseCommand: 'true'}, *gated, {id: UNSUPPORTED, requirements:
    {ToolTimeLimit: {timelimit: 60}}}]
  job: {a: 1}
  findings: [{startswith: 'steps[0]:'}, {re: '^steps\[1\]:.*must compute a boolean'}, {startswith:
    'steps[2].run.requirements.ToolTimeLimit:'}]
- id: a_command_error_is_reported_instead_of_a_wrong_cause_absence_finding
  why: The command's own error is the one finding, not an absence finding a skipped producer would cause.
  workflow: {steps: [{id: PRODUCE, in: {x: x}, out: [{r: {wic_anchor: r}}], when: $(inputs.x > 1)}, {id: CONSUME, in:
    {v: {wic_alias: r}}}], inputs: {x: int}}
  tools: [{id: PRODUCE, inputs: {x: {type: int}}, baseCommand: echo, stdout: out.txt, outputs: {r: {type: string,
    outputBinding: {glob: out.txt, loadContents: true, outputEval: '$(self[0].contents)'}}}}, {id: CONSUME, inputs: {v:
    {type: 'string?'}}, arguments: [$(runtime.cores)]}]
