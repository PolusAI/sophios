# Commands, bindings, flags, arrays and variables the target refuses (design §6, Expressions, Commands, Inputs and
# channels, Resources and containers). Each `findings` or `error` is the diagnostic the replaced test wrote by hand from
# that rule, copied verbatim; nothing here was read off a run.
- id: absent_optional_flag_that_is_also_dereferenced
  codes: [nf-s020]
  why: A flag only tests its value, but a template dereferences it, so absence would render `--label=[]`.
  tool: {inputs: {verbose: {type: ['null', boolean], inputBinding: {position: 1, prefix: --verbose}}},
    arguments: [{position: 2, valueFrom: '--label=$(inputs.verbose)'}]}
  job: {verbose: null}
  findings: ['step ''make'': tool ''make.cwl: inputs.verbose'': absent optional values are supported only for a val
    input whose absence leaves command rendering unchanged']
- id: absent_optional_input_referenced_outside_its_own_binding
  codes: [nf-s020]
  why: Only the input's own binding is presence-gated; a reference elsewhere would render the sentinel.
  tool: {id: OPTIONAL, inputs: {message: {type: ['null', string], inputBinding: {position: 1, prefix: --message}}},
    arguments: [{position: 2, valueFrom: $(inputs.message)}]}
  job: &no_message {message: null}
  error: &absent_message {re: 'step ''OPTIONAL'': tool ''OPTIONAL\.cwl: inputs\.message'': absent optional values are
    supported only for a val input whose absence leaves command rendering unchanged'}
- id: absent_optional_input_whose_binding_emits_a_shell_literal
  codes: [nf-s020]
  why: CWL omits the entire binding when its optional source is absent.
  tool: {id: OPTIONAL, requirements: {ShellCommandRequirement: {}}, inputs: {message: {type: ['null', string],
    inputBinding: {position: 1, valueFrom: printf optional, shellQuote: false}}}}
  job: *no_message
  error: {re: 'step ''OPTIONAL'': tool ''OPTIONAL\.cwl: inputs\.message'': absent optional values are supported only for
    a val input whose absence leaves command rendering unchanged'}
- {id: absent_optional_input_whose_binding_has_a_literal_value_from, codes: [nf-s020], job: *no_message, error: {re: 'step ''OPTIONAL'':
   tool ''OPTIONAL\.cwl: inputs\.message'': absent optional values are supported only for a val input whose absence
   leaves command rendering unchanged'}, why: CWL omits the prefix and the literal when the optional source is absent.,
   tool: {id: OPTIONAL, inputs: {message: {type: ['null', string], inputBinding: {position: 1, prefix: --message,
   valueFrom: literal}}}}}
- {id: absent_optional_input_referenced_via_another_bindings_value_from, codes: [nf-s020], job: *no_message, error: {re: 'step
   ''OPTIONAL'': tool ''OPTIONAL\.cwl: inputs\.message'': absent optional values are supported only for a val input
   whose absence leaves command rendering unchanged'}, why: 'No binding of its own, but referenced elsewhere.', tool:
   {id: OPTIONAL, inputs: {message: {type: ['null', string]}}, arguments: [{position: 1, valueFrom:
   $(inputs.message)}]}}
- {id: absent_optional_path_input, codes: [nf-s020], why: Path channel construction always stages., job: *no_message, tool: {id: OPTIONAL,
   inputs: {message: {type: ['null', File]}}}, error: {re: 'step ''OPTIONAL'': tool ''OPTIONAL\.cwl: inputs\.message'':
   absent optional values are supported only for a val input whose absence leaves command rendering unchanged'}}
- {id: absent_optional_workflow_input_feeding_required_input, codes: [wic012], why: A required input takes a value., workflow: {steps:
   [{id: REQUIRED, in: {message: message}}], inputs: {message: {type: ['null', string]}}}, tools: [{id: REQUIRED,
   inputs: {message: {type: string}}}], error: {re: absent required}}
- id: absent_optional_array_input
  codes: [nf-s020]
  why: Absence (no array at all) is out of scope for the array lowering; empty is not absence.
  tool: {inputs: {values: {type: ['null', {type: array, items: string}], inputBinding: {position: 1, prefix:
    --value}}}}
  job: {values: null}
  error: {re: 'step ''make'': tool ''make\.cwl: inputs\.values'': absent optional'}
- id: an_env_var_from_an_absent_input
  codes: [nf-s020]
  why: An absent optional value has no text to export.
  tool: &env {id: ENV, inputs: {s: {type: string}, n: {type: int}, f: {type: File}, o: {type: 'string?'}}, requirements:
    {EnvVarRequirement: {envDef: [{envName: A, envValue: $(inputs.o)}]}}}
  job: &env_job_without_o {s: v, n: 1, f: {class: File, path: x.txt}}
  findings: ['step ''ENV'': tool ''ENV.cwl: inputs.o'': absent optional values are supported only for a val input whose
    absence leaves command rendering unchanged']
- {id: an_env_def_entry_with_an_unknown_field, codes: [nf-s054], why: A field nothing lowers is refused naming itself., tool: {<<: *env,
   requirements: {EnvVarRequirement: {envDef: {A: {envValue: x, foo: 1}}}}}, job: &env_job {<<: *env_job_without_o, o:
   w}, findings: ['step ''ENV'': tool ''ENV.cwl: requirements.EnvVarRequirement.envDef.A.foo'': foo is not consumed by
   the Nextflow lowering']}
- {id: an_env_var_from_an_int_input, codes: [nf-s041], why: &env_value 'design §6, Resources and containers: a variable is literal text or
   one string input''s value, read whole; every other value is refused by name.', job: *env_job, tool: {<<: *env,
   requirements: {EnvVarRequirement: {envDef: [{envName: A, envValue: $(inputs.n)}]}}}, findings: [{re: '^step ''ENV'':
   tool ''ENV\.cwl: requirements\.EnvVarRequirement\.envDef\[0\]'': .*needs a string input, read whole as
   \$\(inputs\.<name>\); n is declared ''int'''}]}
- {id: an_env_var_from_a_file_path, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(inputs.f.path)}]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*needs a string input'}]}
- {id: an_env_var_from_a_basename, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(inputs.s.basename)}]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*needs a string input'}]}
- {id: an_env_var_with_text_beside_a_reference, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: A, envValue: pre-$(inputs.s)}]}}}, findings: [{re: '^step ''ENV'': tool
   ''ENV\.cwl: requirements\.EnvVarRequirement\.envDef\[0\]'': .*is not supported: write literal text or exactly
   \$\(inputs\.<name>\)'}]}
- {id: an_env_var_from_javascript, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: '${return 1}'}]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*is not supported'}]}
- {id: an_env_var_from_the_runtime, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements: {EnvVarRequirement:
   {envDef: [{envName: A, envValue: $(runtime.cores)}]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*is not supported'}]}
- {id: an_env_var_name_that_is_not_a_shell_name, codes: [nf-s041], why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: 1A, envValue: x}]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*environment variable name must be a shell variable name, got
   ''1A'''}]}
- {id: an_env_var_value_that_is_not_text, codes: [nf-s055], why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [{envName: A, envValue: 3}]}}}, findings: &env_entry [{re: '^step ''ENV'': tool
   ''ENV\.cwl: requirements\.EnvVarRequirement\.envDef\[0\]'': .*an envDef entry needs a string envName and a string
   envValue'}]}
- {id: an_env_def_entry_that_is_not_a_mapping, codes: [nf-s055], why: *env_value, job: *env_job, tool: {<<: *env, requirements:
   {EnvVarRequirement: {envDef: [A=x]}}}, findings: [{re: '^step ''ENV'': tool ''ENV\.cwl:
   requirements\.EnvVarRequirement\.envDef\[0\]'': .*an envDef entry needs a string envName and a string envValue'}]}
- {id: loadContents_on_an_arguments_entry, codes: [nf-s022], why: A binding's loadContents has no lowering., tool: {id: ARGS, arguments:
   [{valueFrom: x, loadContents: true}]}, findings: ['step ''ARGS'': tool ''ARGS.cwl: arguments[0].loadContents'': a
   binding''s loadContents is not supported']}
- id: shell_mode_in_a_container
  codes: [nf-s038]
  why: CWL runs the command as /bin/sh -c after the image's ENTRYPOINT, which the Nextflow task does not.
  tool: {id: SHELL, requirements: {DockerRequirement: &ubuntu {dockerPull: 'ubuntu:24.04'}, ShellCommandRequirement:
    {}}}
  findings: ['step ''SHELL'': tool ''SHELL.cwl'': ShellCommandRequirement beside a DockerRequirement is not supported:
    CWL runs the command as /bin/sh -c after the image''s ENTRYPOINT, which the Nextflow task does not']
- id: shell_mode_inherited_beside_the_tools_own_container
  codes: [nf-s038]
  why: The pair is refused where its inherited half is written, which the tool's file does not hold (resolved-view
    design §8).
  workflow: {steps: [{id: say}], requirements: {ShellCommandRequirement: {}}}
  tools: [{id: say, baseCommand: [echo, hi], requirements: {DockerRequirement: {dockerPull: debian}}}]
  findings: ['step ''say'': requirement ''ShellCommandRequirement'': ShellCommandRequirement beside a DockerRequirement
    is not supported: CWL runs the command as /bin/sh -c after the image''s ENTRYPOINT, which the Nextflow task does
    not']
- id: a_containerized_command_that_can_render_empty
  codes: [nf-s053]
  why: CWL then gives the container no arguments, so the image runs its CMD, which the Nextflow task does not.
  tool: {id: ENTRY, baseCommand: null, requirements: {DockerRequirement: *ubuntu}, inputs: {name: {type: 'string?',
    inputBinding: {prefix: --name}}, verbose: {type: boolean, inputBinding: {prefix: -v}}}}
  job: {verbose: false}
  findings: ['step ''ENTRY'': step: a containerized tool whose command can render empty is not supported: CWL then gives
    the container no arguments, so the image runs its CMD, after its ENTRYPOINT if it has one, which the Nextflow task
    does not; name the program in baseCommand']
- id: nested_arrays
  codes: [nf-s031, nf-s048]
  why: &producer_feeds A producing step feeds the array, so the items' schema is refused rather than the value's shape.
  workflow: &array_from_producer {steps: [{id: PRODUCER, out: [{out: {wic_anchor: produced}}]}, {id: ARRAY, in: {values:
    {wic_alias: produced}}}]}
  tools: [{id: PRODUCER, outputs: {out: {type: &nested {type: array, items: {type: array, items: string}},
    outputBinding: {glob: out.txt}}}}, {id: ARRAY, inputs: {values: {type: *nested, inputBinding: {position: 1}}}}]
  error: {re: nested arrays are deferred}
- {id: per_item_input_binding_on_array_items, codes: [nf-s031, nf-s050], why: *producer_feeds, workflow: *array_from_producer, tools: [{id:
   PRODUCER, outputs: {out: {type: {type: array, items: File}, outputBinding: {glob: '*.txt'}}}}, {id: ARRAY, inputs:
   {values: {type: {type: array, items: {type: File, inputBinding: {prefix: -I}}}, inputBinding:
   {position: 1}}}}], error: {re: per-item array element bindings are deferred}}
- {id: separate_false_on_an_array_binding, codes: [nf-s050], why: An array binding's separate false is deferred., tool: {id: ARRAY,
   inputs: {values: {type: {type: array, items: string}, inputBinding: {position: 1, separate: false}}}}, job: {values:
   [a, b]}, error: {re: 'separate: false on an array-typed inputBinding.*deferred'}}
- {id: array_value_with_a_mismatched_item_type, codes: [nf-s015], why: A value has the shape of its declared type., tool: {inputs:
   {values: {type: {type: array, items: string}, inputBinding: {position: 1}}}}, job: {values: [a, 1]}, error:
   {re: does not match its supported CWL type}}
- {id: a_boolean_argument_position, codes: [nf-s055], why: 'A position is an integer, and true is none, though Python reads it as 1.',
   tool: {arguments: [{valueFrom: x, position: true}]}, error: {re: non-integer CWL command position}}
- {id: a_boolean_array_binding-prefix, codes: [nf-s049], why: &booleans 'cwltool renders [true, false] bound with prefix -x as -x alone,
   and with no prefix as nothing.', job: &true_false {values: [true, false]}, tool: {id: ARRAY, inputs: {values: {type:
   {type: array, items: boolean}, inputBinding: {position: 1, prefix: -x}}}}, error: &boolean_array {re: 'tool
   ''ARRAY\.cwl: inputs\.values\.inputBinding'': a boolean array''s binding is not supported: CWL adds only its
   prefix'}}
- {id: a_boolean_array_binding-no-prefix, codes: [nf-s049], why: *booleans, job: *true_false, error: {re: 'tool ''ARRAY\.cwl:
   inputs\.values\.inputBinding'': a boolean array''s binding is not supported: CWL adds only its prefix'}, tool: {id:
   ARRAY, inputs: {values: {type: {type: array, items: {type: boolean}}, inputBinding: {position: 1}}}}}
- {id: a_boolean_array_binding-optional, codes: [nf-s049], why: *booleans, job: *true_false, error: {re: 'tool ''ARRAY\.cwl:
   inputs\.values\.inputBinding'': a boolean array''s binding is not supported: CWL adds only its prefix'}, tool: {id:
   ARRAY, inputs: {values: {type: {type: array, items: ['null', boolean]}, inputBinding: {position: 1, prefix: -x}}}}}
- {id: a_boolean_array_binding-optional-shorthand, codes: [nf-s049], why: *booleans, job: *true_false, error: {re: 'tool ''ARRAY\.cwl:
   inputs\.values\.inputBinding'': a boolean array''s binding is not supported: CWL adds only its prefix'}, tool: {id:
   ARRAY, inputs: {values: {type: {type: array, items: 'boolean?'}, inputBinding: {position: 1, prefix: -x}}}}}
- id: shell_quote_false_without_shell_command_requirement
  codes: [nf-s051]
  why: &unquoted 'design §6, Commands: only a literal valueFrom, under ShellCommandRequirement, is unquoted.'
  tool: {id: SHELL, outputs: &result {result: {type: File, outputBinding: {glob: out.txt}}}, arguments: [{valueFrom:
    '>>', shellQuote: false}]}
  out: &out [result]
  error: {re: requires ShellCommandRequirement}
- {id: shell_quote_false_with_no_value_from, codes: [nf-s051], why: *unquoted, out: *out, error: {re: has no valueFrom}, tool: &shell {id:
   SHELL, outputs: *result, requirements: {ShellCommandRequirement: {}}, arguments: [{shellQuote: false}]}}
- {id: shell_quote_false_with_a_prefix, codes: [nf-s051], why: *unquoted, out: *out, error: &prefixed {re: does not support a prefix},
   tool: {<<: *shell, arguments: [{valueFrom: '>>', shellQuote: false, prefix: -x}]}}
- {id: shell_quote_false_input_binding_with_no_value_from, codes: [nf-s051], why: 'shellQuote: false on a plain, no-valueFrom
   inputBinding.', out: *out, error: *prefixed, job: {text: Hello}, tool: {outputs: *result, requirements:
   {ShellCommandRequirement: {}}, inputs: {text: {type: string, inputBinding: {shellQuote: false, position: 1, prefix:
   echo}}}}}
- {id: shell_quote_false_referencing_an_input-bare, codes: [nf-s051], out: *out, job: &hi {message: hi}, error: &references {re:
   references an input}, why: &unquoting_input 'Unquoting a value derived from any input, directly or via a suffix, is
   the boundary.', tool: &shell_input {<<: *shell, inputs: {message: {type: string}}, arguments: [{valueFrom:
   $(inputs.message), shellQuote: false}]}}
- {id: shell_quote_false_referencing_an_input-embedded, codes: [nf-s051], why: *unquoting_input, out: *out, job: *hi, error: *references,
   tool: {<<: *shell_input, arguments: [{valueFrom: prefix-$(inputs.message)-suffix, shellQuote: false}]}}
- {id: shell_quote_false_referencing_an_input-basename-suffix, codes: [nf-s046, nf-s051], why: *unquoting_input, out: *out, job: *hi, error:
   *references, tool: {<<: *shell_input, arguments: [{valueFrom: $(inputs.message.basename), shellQuote: false}]}}
- {id: a_dollar_in_a_shell_quote_false_literal-variable, codes: [nf-s051], why: &expand "design §6, Commands: the task's bash -ue would
   expand it, not CWL's sh -c.", out: *out, error: &dollar {re: "holds a '\\$', which the task's shell would expand"},
   tool: {<<: *shell, arguments: [{valueFrom: '[$UNSET]', shellQuote: false}]}}
- {id: a_dollar_in_a_shell_quote_false_literal-escaped_substitution, codes: [nf-s051], why: *expand, out: *out, error: *dollar, tool: {<<:
   *shell, arguments: [{valueFrom: '\$(date)', shellQuote: false}]}}
- {id: value_from_aliasing_a_different_input_on_a_boolean_binding, codes: [nf-s049], job: {verbose: true, other: false}, why: Aliasing a
   different input's presence onto this flag has no approved lowering., tool: {inputs: {verbose: {type:
   boolean, inputBinding: {position: 1, prefix: --verbose, valueFrom: $(inputs.other)}}, other: {type: boolean}}},
   error: &boolean_value_from {re: valueFrom on a boolean inputBinding is supported only as}}
- {id: literal_value_from_on_a_boolean_binding, codes: [nf-s049], why: A literal string is not a provably-boolean valueFrom result., job:
   &verbose {verbose: true}, error: *boolean_value_from, tool: {inputs: {verbose: {type: boolean,
   inputBinding: {position: 1, prefix: --verbose, valueFrom: 'true'}}}}}
- {id: basename_suffixed_value_from_on_a_boolean_binding, codes: [nf-s046, nf-s049], why: 'A .basename suffix is never boolean-shaped, even on a
   self-reference.', job: *verbose, error: *boolean_value_from, tool: {inputs: {verbose: {type: boolean,
   inputBinding: {position: 1, prefix: --verbose, valueFrom: $(inputs.verbose.basename)}}}}}
- {id: a_boolean_valuefrom_on_an_optional_input, codes: [nf-s049], why: An optional input would render its absence., job: {b: true, s: x},
   tool: {baseCommand: echo, arguments: [], inputs: {b: {type: boolean}, s: {type: 'string?', inputBinding:
   {valueFrom: $(inputs.b), prefix: --flag}}}}, error: {re: "a boolean valueFrom on optional input 's' is not
   supported"}}
- {id: a_dollar_starting_a_runtime_expression, codes: [nf-s045], why: &expression 'design §6, Commands: a `$` followed by `(` or `{`
   starts an expression, and only an input reference is one the target reads.', job: &x {x: v}, tool:
   &args {baseCommand: echo, inputs: {x: {type: string}}, arguments: [$(runtime.cores)]}, error: &unsupported {re:
   unsupported
   CWL expression}}
- {id: a_dollar_starting_javascript, codes: [nf-s045], why: *expression, job: *x, error: *unsupported, tool: {<<: *args, arguments:
   ['${return 1}']}}
- {id: a_dollar_starting_a_property_of_a_string, codes: [nf-s045], why: *expression, job: *x, error: *unsupported, tool: {<<: *args,
   arguments: [cost $5 $(inputs.x.size)]}}
- {id: a_dollar_before_an_expression_on_self, codes: [nf-s045], why: *expression, job: *x, error: *unsupported, tool: {<<: *args,
   arguments: [$$(self)]}}
- id: a_value_input_read_as_a_path
  codes: [nf-s046]
  why: &path_of_value 'design §6, Commands: `.path` and `.basename` read a File or Directory.'
  tool: {id: BASENAME, inputs: {label: {type: string}}, outputs: {result: {type: File, outputBinding: {glob:
    $(inputs.label.basename).txt}}}}
  out: *out
  job: {label: input}
  findings: ['step ''BASENAME'': tool ''BASENAME.cwl: outputs.result.outputBinding.glob'': $(inputs.label.basename)
    requires a File or Directory input, and label is declared ''string''']
- {id: path_of_a_string, codes: [nf-s046, nf-s046], why: *path_of_value, job: {value: x}, tool: {id: SUFFIXED, stdout: $(inputs.value.path).log,
