     1}}}}
  job: {}
  findings: ['step ''DOCK'': tool ''DOCK.cwl: inputs.flag.type'': unsupported optional CWL union [''null'', ''boolean'',
    {''type'': ''array'', ''items'': ''string''}]', 'workflow ''wf'': workflow input ''flag'': type: unsupported optional
    CWL union [''null'', ''boolean'', {''type'': ''array'', ''items'': ''string''}]']
