# Outputs the target refuses (design §6, Outputs): an outputEval is one of two capture declarations, and nothing is
# evaluated. Each `findings` or `error` is the diagnostic the replaced test wrote by hand, copied verbatim.
- id: internal_variation_of_the_admitted_literal-$( self[0] )
  codes: [nf-s033]
  why: &variation Only surrounding whitespace is trimmed; any other variation is a text outside the admitted set.
  tool: &make {id: make, inputs: {message: {type: string, inputBinding: {position: 1}}}, outputs: {result: {type: File,
    outputBinding: {glob: out.txt, outputEval: '$( self[0] )'}}}}
  out: &out [result]
  job: &hi {message: hi}
  findings: ['step ''make'': tool ''make.cwl: outputs.result.outputBinding'': unsupported outputEval ''$( self[0] )'';
    the approved set is exactly ''$(self[0])'', ''$(self[0].contents)'', recognized as capture declarations, and no
    other expression is evaluated']
