- id: a_captured_value_cannot_feed_another_process
  codes: [nf-s029]
  why: No qualifier agreement check exists for process edges, so this rejects.
  workflow: {steps: [{id: produce, in: {message: message}, out: [{text: {wic_anchor: text}}]}, {id: consume, in: {text:
    {wic_alias: text}}, out: [result]}], inputs: {message: string}, outputs: {result: {type: File, outputSource:
    consume/result}}}
  tools: [{id: produce, inputs: {message: {type: string, inputBinding: {position: 1}}}, outputs: {text: {type: string,
    outputBinding: *text_capture}}}, {id: consume, inputs: {text: {type: string, inputBinding: {position: 1}}}, outputs:
    {result: {type: File, outputBinding: {glob: copy.txt}}}}]
  job: *hi
  findings: ['step ''consume'': input ''text'': ''produce/text'' captures file text; its only approved sink is a
    workflow output, because the executable graph has no qualifier agreement check for process edges']
- {id: an_optional_output_with_a_pattern_glob_must_reach_a_workflow_output, codes: [nf-s030], why: 'An optional output of a pattern glob
   is checked at its workflow output, so it must reach one.', workflow: {steps: [{id: LOGS, out: [o]}]}, tools: [{id:
   LOGS, baseCommand: 'true', outputs: {o: {type: 'File?', outputBinding: {glob: '*.log'}}}}], error: {re: optional
   outputs o must match at most one file and must reach a workflow}}
- {id: a_step_consuming_an_optional_output_is_a_finding, codes: [nf-s030], why: An optional output may be null; only a workflow output
   takes it., workflow: {steps: [{id: MAYBE, out: [{o: {wic_anchor: o}}]}, {id: CONSUME, in: {source: {wic_alias:
   o}}}]}, tools: [{id: MAYBE, outputs: {o: {type: 'File?', outputBinding: {glob: maybe.txt}}}}, {id: CONSUME, inputs:
   {source: {type: 'File?', inputBinding: {position: 1}}}}], findings: ['workflow ''wf'': workflow: connection _MAYBE.o
   -> _CONSUME.source consumes an optional output, which may be null; only a workflow output can take it']}
- {id: array_typed_outputs, codes: [nf-s031], why: An output is collected by glob as one File or Directory., workflow: {steps: [{id: MAKE,
   out: [results]}]}, tools: [{id: MAKE, outputs: {results: {type: {type: array, items: File}, outputBinding: {glob:
   '*.txt'}}}}], error: {re: 'outputs\.results\.type'': an output is collected by glob as a File or Directory'}}
- {id: an_array_typed_text_capture, codes: [nf-s034], why: A text capture gives one string; an array-typed output is not one string.,
   tool: {id: CAPTURE, outputs: {names: {type: {type: array, items: string}, outputBinding: {glob: out.txt,
   loadContents: true, outputEval: '$(self[0].contents)'}}}}, out: [names], findings: ['step ''CAPTURE'': tool
   ''CAPTURE.cwl: outputs.names.outputBinding'': outputEval ''$(self[0].contents)'' captures file text and is admitted
   only on a type: string output; output ''names'' declares {''type'': ''array'', ''items'': ''string''}']}
- id: a_workflow_output_with_no_output_source
  why: A workflow output names the step output it comes from.
  codes: [nf-s026]
  workflow: {steps: [{id: TOUCH, out: [o]}], outputs: {o: {type: File}}}
  tools: [{id: TOUCH, outputs: {o: {type: File, outputBinding: {glob: o.txt}}}}]
  job: {}
  findings: ['workflow ''wf'': workflow: workflow output ''o'' must define outputSource']
- id: a_nested_workflow_output_named_as_text
  why: CWL reads `inner/made` as the call's output (tests/core/data/python_api_pairs/re_export.wic); Sophios keeps the
    text as written, and the target follows only the outputs it resolves.
  codes: [nf-s027]
  workflow:
    steps:
    - {id: inner.wic, subtree: {steps: [{id: TOUCH, in: {filename: {wic_inline_input: empty.txt}}}], outputs: {made:
       {type: File, outputSource: TOUCH/file}}}}
    outputs: {made: {type: File, outputSource: inner/made}}
