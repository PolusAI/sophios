# Step and workflow inputs the target refuses (design_docs/one-target-table-design.md §5, inputs).
- id: a_join_that_gives_a_list_to_one_value
  codes: [nf-s018]
  why: Two sources merge into a list, which a string input does not take.
  workflow: {steps: [{id: ECHO, in: {message: {wic_raw_cwl: {source: [a, b]}}}, out: []}], inputs: {a: {type: string},
    b: {type: string}}}
  tools: [&echo {id: ECHO, inputs: {message: {type: string, inputBinding: {position: 1}}}}]
  job: {a: x, b: y}
  findings: ['step ''ECHO'': input ''message'': the step input gives a list, but its tool input declares ''string''']
- id: a_step_input_value_from
  codes: [nf-s019]
  why: A step input's valueFrom is computation the target does not lower.
  workflow: {steps: [{id: ECHO, in: {message: {wic_raw_cwl: {source: m, valueFrom: $(self)}}}, out: []}], inputs: {m:
    {type: string}}, requirements: {StepInputExpressionRequirement: {}}}
  tools: [*echo]
  job: {m: x}
  findings: ['step ''ECHO'': input ''message'': valueFrom: a step input''s valueFrom is not supported']
- id: an_input_binding_on_a_workflow_input
  codes: [nf-s021]
  why: The steps that read a workflow input bind it.
  workflow: {steps: [{id: ECHO, in: {message: m}, out: []}], inputs: {m: {type: string, inputBinding: {position: 1}}}}
  tools: [*echo]
  job: {m: x}
  findings: ['workflow ''wf'': workflow input ''m'': inputBinding: a workflow input''s inputBinding is not supported']
