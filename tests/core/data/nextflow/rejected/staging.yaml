   outputBinding: {glob: $(inputs.f)}}}, requirements: &writable {InitialWorkDirRequirement: {listing: [{entry:
   $(inputs.f), writable: true}]}}}, findings: ['step ''make'': tool ''make.cwl: outputs.result.outputBinding.glob'':
   $(inputs.f) is the File or Directory object, which CWL does not take as a glob; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f).out, codes: [nf-s046], why: *stands, out: *out, job: *f, tool: {<<: *ref,
