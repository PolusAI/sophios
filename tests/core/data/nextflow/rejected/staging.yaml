- id: an_output_named_like_a_link_its_task_stages-upstream-glob
  codes: [nf-s035]
  why: &link Writing a staged input's link writes through it, so the run succeeds and leaves every sorted.txt empty.
  workflow: &chain {steps: [{id: EMIT, out: [{out: {wic_anchor: emitted}}]}, {id: SORT, in: {src: {wic_alias: emitted}},
    out: [out]}], inputs: {given: {type: File}}}
  tools: [&emit {id: EMIT, outputs: {out: {type: File, outputBinding: {glob: sorted.txt}}}, stdout: sorted.txt}, &sort {
    id: SORT, inputs: {src: {type: File, inputBinding: {position: 1}}}, outputs: {out: {type: File, outputBinding:
    {glob: sorted.txt}}}, stdout: sorted.txt}]
  job: &given {given: {class: File, path: in.txt}}
  error: &sorted_through {re: '(?s)\A(?!(.*writes through){2}).*step ''SORT'': tool ''SORT\.cwl: stdout'': writing
    ''sorted\.txt'' writes through ''sorted\.txt'', the name input ''src'' is linked under in the task directory'}
- {id: an_output_named_like_a_link_its_task_stages-upstream-glob-in-a-directory, codes: [nf-s035], why: *link, workflow: *chain, job:
   *given, tools: [{id: EMIT, outputs: {out: {type: File, outputBinding: {glob: out/sorted.txt}}}, stdout:
   out/sorted.txt}, *sort], error: {re: '(?s)\A(?!(.*writes through){2}).*step ''SORT'': tool ''SORT\.cwl: stdout'':
   writing ''sorted\.txt'' writes through ''sorted\.txt'', the name input ''src'' is linked under in the task
   directory'}}
- {id: an_output_named_like_a_link_its_task_stages-dot-slash, codes: [nf-s035], why: *link, workflow: *chain, job: *given, tools: [*emit,
   {<<: *sort, stdout: ./sorted.txt}], error: {re: '(?s)\A(?!(.*writes through){2}).*step ''SORT'': tool ''SORT\.cwl:
