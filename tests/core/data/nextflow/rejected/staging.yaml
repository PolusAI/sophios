- id: an_output_named_like_a_link_its_task_stages-upstream-glob
  why: &link Writing a staged input's link writes through it, so the run succeeds and leaves every sorted.txt empty.
  workflow: &chain {steps: [{id: EMIT, out: [out]}, {id: SORT, in: {src: EMIT/out}, out: [out]}], inputs: {given: {type:
    File}}}
  tools: [&emit {id: EMIT, outputs: {out: {type: File, outputBinding: {glob: sorted.txt}}}, stdout: sorted.txt}, &sort {
    id: SORT, inputs: {src: {type: File, inputBinding: {position: 1}}}, outputs: {out: {type: File, outputBinding:
    {glob: sorted.txt}}}, stdout: sorted.txt}]
  job: &given {given: {class: File, path: in.txt}}
  error: &sorted_through {re: "(?s)\\A(?!(.*writes through){2}).*steps\\[1\\]\\.run\\.stdout: writing 'sorted\\.txt'
    writes through 'sorted\\.txt', the name input 'src' is linked under in the task directory"}
- {id: an_output_named_like_a_link_its_task_stages-upstream-glob-in-a-directory, why: *link, workflow: *chain, job:
   *given, tools: [{id: EMIT, outputs: {out: {type: File, outputBinding: {glob: out/sorted.txt}}}, stdout:
   out/sorted.txt}, *sort], error: *sorted_through}
- {id: an_output_named_like_a_link_its_task_stages-dot-slash, why: *link, workflow: *chain, job: *given, tools: [*emit,
   {<<: *sort, stdout: ./sorted.txt}], error: {re: "(?s)\\A(?!(.*writes through){2}).*steps\\[1\\]\\.run\\.stdout:
   writing '\\./sorted\\.txt' writes through 'sorted\\.txt', the name input 'src' is linked under in the task
   directory"}}
- {id: an_output_named_like_a_link_its_task_stages-glob-written-by-the-command, why: *link, workflow: *chain, job:
   *given, tools: [*emit, {id: SORT, inputs: {src: {type: File, inputBinding: {position: 1}}}, outputs: {out: {type:
   File, outputBinding: {glob: sorted.txt}}}, arguments: [-o, sorted.txt]}], error: {re: "(?s)\\A(?!(.*writes
   through){2}).*steps\\[1\\]\\.run\\.outputs\\.out\\.outputBinding\\.glob: writing 'sorted\\.txt' writes through
   'sorted\\.txt', the name input 'src' is linked under in the task directory"}}
- {id: an_output_named_like_a_link_its_task_stages-into-a-linked-directory, why: *link, job: {given: {class: Directory,
   path: in.txt}}, workflow: {<<: *chain, inputs: {given: {type: Directory}}}, tools: [{id: EMIT, outputs: {out: {type:
   Directory, outputBinding: {glob: outdir}}}, stdout: outdir}, {id: SORT, inputs: {src: {type: Directory, inputBinding:
   {position: 1}}}, outputs: {out: {type: File, outputBinding: {glob: outdir/listing.txt}}}, stdout:
   outdir/listing.txt}], error: {re: "(?s)\\A(?!(.*writes through){2}).*steps\\[1\\]\\.run\\.stdout: writing
   'outdir/listing\\.txt' writes through 'outdir', the name input 'src' is linked under in the task directory"}}
