- id: a_glob_at_a_staged_input-$(inputs.source.basename)
  why: &staged_glob The task directory holds the staged input under that name, which a CWL glob does not match, and a
    name inside a staged Directory is inside the input.
  tool: &copy {id: copy, inputs: {source: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
    $(inputs.source.basename)}}}}
  out: *out
  job: *in_txt
  findings: &globs_staged ["steps[0]: process 'copy' output 'result' globs the staged input 'source', or a name inside
    it, which a CWL glob does not match: derive a new name from it, or make the input an InitialWorkDirRequirement
    entry"]
- {id: a_glob_at_a_staged_input-padded, why: *staged_glob, out: *out, job: *in_txt, findings: *globs_staged, tool: {<<:
   *copy, outputs: {result: {type: File, outputBinding: {glob: ' $(inputs.source.basename) '}}}}}
- {id: a_glob_at_a_staged_input-./$(inputs.source.basename), why: *staged_glob, out: *out, job: *in_txt, findings:
   *globs_staged, tool: {<<: *copy, outputs: {result: {type: File, outputBinding: {glob:
   ./$(inputs.source.basename)}}}}}
- {id: a_glob_at_a_staged_input-$(inputs.source.basename)/keep.txt, why: *staged_glob, out: *out, findings:
   *globs_staged, job: &in_dir {source: {class: Directory, path: in.txt}}, tool: {<<: *copy, inputs: {source: {type:
   Directory}}, outputs: {result: {type: File, outputBinding: {glob: $(inputs.source.basename)/keep.txt}}}}}
- id: a_stdout_at_a_staged_input-File-$(inputs.source.basename)-staged
  why: &writes_through Writing the link the task stages an input under writes through it into the input; cwltool writes
    a new file in its output directory, and links an entry too, so both overwrite it.
  tool: &write {id: write, inputs: {source: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
    done.txt}}}, stdout: $(inputs.source.basename)}
  out: *out
  job: *in_txt
  findings: &stdout_through ["steps[0]: process 'write' stdout writes through the link input 'source' is staged under,
    into what the input names: derive a new name from it, or make the input a writable InitialWorkDirRequirement entry"]
- {id: a_stdout_at_a_staged_input-Directory-$(inputs.source.basename)/keep.txt-staged, why: *writes_through, out: *out,
   job: *in_dir, findings: *stdout_through, tool: {<<: *write, inputs: {source: {type: Directory}}, stdout:
   $(inputs.source.basename)/keep.txt}}
- {id: a_stdout_at_a_staged_input-File-$(inputs.source.basename)-entry, why: *writes_through, out: *out, job: *in_txt,
   findings: *stdout_through, tool: {<<: *write, requirements: &linked_source {InitialWorkDirRequirement: {listing:
   [$(inputs.source)]}}}}
- {id: a_stderr_at_a_staged_input-File-$(inputs.source.basename)-staged, why: *writes_through, out: *out, job: *in_txt,
   tool: &write_stderr {id: write, inputs: {source: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
   done.txt}}}, stderr: $(inputs.source.basename)}, findings: &stderr_through ["steps[0]: process 'write' stderr writes
   through the link input 'source' is staged under, into what the input names: derive a new name from it, or make the
   input a writable InitialWorkDirRequirement entry"]}
- {id: a_stderr_at_a_staged_input-Directory-$(inputs.source.basename)/keep.txt-staged, why: *writes_through, out: *out,
   job: *in_dir, findings: *stderr_through, tool: {<<: *write_stderr, inputs: {source: {type: Directory}}, stderr:
   $(inputs.source.basename)/keep.txt}}
- {id: a_stderr_at_a_staged_input-File-$(inputs.source.basename)-entry, why: *writes_through, out: *out, job: *in_txt,
   findings: *stderr_through, tool: {<<: *write_stderr, requirements: *linked_source}}
- {id: a_reference_to_a_renamed_entry_has_the_renames_finding_alone, why: 'Every reference to a renamed entry is refused
   for being one; a finding of where it stands would offer what that refusal then refuses.', out: *out, job: &f_in {f:
   {class: File, path: in.txt}}, tool: {id: REF, inputs: {f: {type: File}}, outputs: {result: {type: File,
   outputBinding: {glob: o}}}, stdout: $(inputs.f), requirements: {InitialWorkDirRequirement: {listing: [{entry:
   $(inputs.f), entryname: x.txt}]}}}, findings: ["steps[0].run.requirements.InitialWorkDirRequirement: input 'f' has an
   InitialWorkDirRequirement entry with a literal name and cannot also be referenced in the command, stream targets, or
   output globs; name the entry by its literal"]}
- {id: a_malformed_listing_checks_no_reference_against_it, why: &malformed 'A malformed listing stages what no finding
   can know: neither the entry''s glob nor a link is checked.', out: *out, job: *f_in, tool: {id: REF, inputs: {f:
   {type: File}}, outputs: {result: {type: File, outputBinding: {glob: $(inputs.f.path)}}}, requirements: {
   InitialWorkDirRequirement: {listing: [$(inputs.f), 5]}}}, findings:
   ['steps[0].run.requirements.InitialWorkDirRequirement.listing[1]: must be a bare $(inputs.<name>) reference or a
   Dirent mapping']}
- {id: a_list_of_globs_is_refused_for_being_a_list, why: 'Not for a reference in it: each item of a list is a whole
   value, which no other text surrounds.', out: *out, job: &f {f: {class: File, path: in}}, tool: {inputs: {f:
   {type: File}}, outputs: {result: {type: File, outputBinding: {glob: [$(inputs.f)]}}}}, findings: ["steps[0]: CWL
   output glob lists for 'result' are not supported by the Nextflow target"]}
- id: a_reference_where_it_stands-glob-File-$(inputs.f)
  why: &stands 'design §6, Basename references: a plain File or Directory reference is the object, which no glob or
    stream target takes; `.path` is absolute, so stdout and stderr take a basename, and a glob a `.path` only of an
    entry, the one input under the output directory; stdin reads one staged File by its whole `.path`. Each case is a
    cell of cwltool''s own run of the tool. What a finding offers instead is what the target then takes: not the
    input''s own staged name, or a path inside it, where the link the input is staged under would be named.'
  tool: &ref {inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob: $(inputs.f)}}}}
  out: *out
  job: *f
  findings: ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f) is the File or Directory object, which CWL
    does not take as a glob; derive a new name from it, or make the input an InitialWorkDirRequirement entry']
- {id: a_reference_where_it_stands-glob-File-$(inputs.f)-linked, why: *stands, out: *out, job: *f, tool: {<<: *ref,
   requirements: &linked {InitialWorkDirRequirement: {listing: [$(inputs.f)]}}}, findings:
   ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f) is the File or Directory object, which CWL does not
   take as a glob; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f)-writable, why: *stands, out: *out, job: &d {f: {class:
   Directory, path: in}}, tool: &ref_dir {inputs: {f: {type: Directory}}, outputs: {result: {type: Directory,
   outputBinding: {glob: $(inputs.f)}}}, requirements: &writable {InitialWorkDirRequirement: {listing: [{entry:
   $(inputs.f), writable: true}]}}}, findings: ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f) is the File
   or Directory object, which CWL does not take as a glob; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f).out, why: *stands, out: *out, job: *f, tool: {<<: *ref,
   outputs: {result: {type: File, outputBinding: {glob: $(inputs.f).out}}}}, findings:
   ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f) embedded in other text renders a File object as JSON in
   CWL; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f)/keep.txt, why: *stands, out: *out, job: *d, tool: {inputs:
   {f: {type: Directory}}, outputs: {result: {type: Directory, outputBinding: {glob:
   $(inputs.f)/keep.txt}}}}, findings: ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f) embedded in other
   text renders a File object as JSON in CWL; derive a new name from it, or make the input an InitialWorkDirRequirement
   entry']}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f.path), why: *stands, out: *out, job: *f, tool: {<<: *ref,
   outputs: {result: {type: File, outputBinding: {glob: $(inputs.f.path)}}}}, findings:
   ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f.path) is an absolute path outside the output directory,
   which no CWL glob matches; derive a new name from it, or make the input an InitialWorkDirRequirement entry']}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f.path).out, why: *stands, out: *out, job: *f, tool: {<<: *ref,
   outputs: {result: {type: File, outputBinding: {glob: $(inputs.f.path).out}}}}, findings:
   ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f.path) is an absolute path outside the output directory,
   which no CWL glob matches; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f.path)/keep.txt, why: *stands, out: *out, job: *d, tool: {
   inputs: {f: {type: Directory}}, outputs: {result: {type: Directory, outputBinding: {glob:
   $(inputs.f.path)/keep.txt}}}}, findings: ['steps[0].run.outputs.result.outputBinding.glob: $(inputs.f.path) is an
   absolute path outside the output directory, which no CWL glob matches; derive a new name from it, or make the input
   an InitialWorkDirRequirement entry']}
