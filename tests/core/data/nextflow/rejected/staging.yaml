# Staged inputs, InitialWorkDirRequirement entries and the references to them the target refuses (design §6, Inputs
# and channels, Basename references). Each `findings` or `error` is the diagnostic the replaced test wrote by hand.
- id: iwdr_writable_that_is_not_a_literal_boolean-true
  why: &literal_writable Whether an entry is a copy is known before the task runs.
  tool: &stage {id: STAGE, inputs: {source: {type: File}}, outputs: &result {result: {type: File, outputBinding: {glob:
    out.txt}}}, arguments: [cat, renamed.txt], stdout: out.txt, requirements: {InitialWorkDirRequirement: {listing:
    [{entry: $(inputs.source), writable: 'true'}]}}}
  out: &out [result]
  job: &in_txt {source: {class: File, path: in.txt}}
  findings: &not_literal ['steps[0].run.requirements.InitialWorkDirRequirement.listing[0]: writable must be a literal
    boolean']
- {id: iwdr_writable_that_is_not_a_literal_boolean-1, why: *literal_writable, out: *out, job: *in_txt, findings:
   *not_literal, tool: {<<: *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source),
   writable: 1}]}}}}
- {id: iwdr_writable_that_is_not_a_literal_boolean-$(inputs.flag), why: *literal_writable, out: *out, job: *in_txt,
   findings: *not_literal, tool: {<<: *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry:
   $(inputs.source), writable: $(inputs.flag)}]}}}}
