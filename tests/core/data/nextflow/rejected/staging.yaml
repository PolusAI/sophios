   step: CWL output glob lists for ''result'' are not supported by the Nextflow target']}
- id: a_reference_where_it_stands-glob-File-$(inputs.f)
  codes: [nf-s046]
  why: &stands 'design §6, Basename references: a plain File or Directory reference is the object, which no glob or
    stream target takes; `.path` is absolute, so stdout and stderr take a basename, and a glob a `.path` only of an
    entry, the one input under the output directory; stdin reads one staged File by its whole `.path`. Each case is a
    cell of cwltool''s own run of the tool. What a finding offers instead is what the target then takes: not the
    input''s own staged name, or a path inside it, where the link the input is staged under would be named.'
  tool: &ref {inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob: $(inputs.f)}}}}
  out: *out
  job: *f
  findings: ['step ''make'': tool ''make.cwl: outputs.result.outputBinding.glob'': $(inputs.f) is the File or Directory
    object, which CWL does not take as a glob; derive a new name from it, or make the input an InitialWorkDirRequirement
    entry']
- {id: a_reference_where_it_stands-glob-File-$(inputs.f)-linked, codes: [nf-s046], why: *stands, out: *out, job: *f, tool: {<<: *ref,
   requirements: &linked {InitialWorkDirRequirement: {listing: [$(inputs.f)]}}}, findings: ['step ''make'': tool
   ''make.cwl: outputs.result.outputBinding.glob'': $(inputs.f) is the File or Directory object, which CWL does not take
   as a glob; use $(inputs.f.basename)']}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f)-writable, codes: [nf-s046], why: *stands, out: *out, job: &d {f: {class:
