   {class: File, path: in.txt}}, tool: {id: REF, inputs: {f: {type: File}}, outputs: {result: {type: File,
   outputBinding: {glob: o}}}, stdout: $(inputs.f), requirements: {InitialWorkDirRequirement: {listing: [{entry:
