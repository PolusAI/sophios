   [&emitted {id: EMIT, outputs: {out: {type: File, outputBinding: {glob: emitted.txt}}}, stdout: emitted.txt},
   &renamed_sort {id: SORT, inputs: {src: {type: File}}, outputs: {out: {type: File, outputBinding: {glob:
   sorted.txt}}}, stdout: sorted.txt, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.src),
   entryname: sorted.txt}]}}}], error: *sorted_through}
