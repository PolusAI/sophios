- id: a_glob_at_a_staged_input-$(inputs.source.basename)
  codes: [nf-s035]
  why: &staged_glob The task directory holds the staged input under that name, which a CWL glob does not match, and a
    name inside a staged Directory is inside the input.
  tool: &copy {id: copy, inputs: {source: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
    $(inputs.source.basename)}}}}
  out: *out
  job: *in_txt
  findings: &globs_staged ['step ''copy'': step: process ''copy'' output ''result'' globs the staged input ''source'',
    or a name inside it, which a CWL glob does not match: derive a new name from it, or make the input an
    InitialWorkDirRequirement entry']
- {id: a_glob_at_a_staged_input-padded, codes: [nf-s035], why: *staged_glob, out: *out, job: *in_txt, findings: *globs_staged, tool: {<<:
