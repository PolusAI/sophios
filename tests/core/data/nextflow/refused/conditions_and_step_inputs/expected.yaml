why: A `when` is a boolean of the step's own inputs in the safe subset, with at least one input to decide on; a skipped
  step's null reaches only an optional value port; a step input joins its sources and takes a default as the idioms
  can; a workflow input's default is a scalar and the steps that read it bind it; an optional File needs a value.
