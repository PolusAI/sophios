why: An optional input with no value is read only by its own binding; a variable is literal text or a string input's
  value, read whole; a flag is a boolean, bound with a prefix; only a literal valueFrom with no `$` is unquoted, under
  ShellCommandRequirement and outside a container; .path and .basename read a File or Directory; an argument's `$`
  starts only an input reference; a container is pulled and runs a command that cannot render empty.
# Each refusal: its code, its step, and its subject (a tool's file and field, or a requirement); a binding the lowering
# cannot write has no subject.
