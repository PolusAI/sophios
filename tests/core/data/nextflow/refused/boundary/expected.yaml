why: A required workflow input has a value, never null, a default is a JSON scalar, and two names that normalize alike
  would be one parameter; a workflow output names a step output; a glob reads inputs only; a requirement names its
  class; a long and a double are refused where they are declared; a core count is whole and a CUDA device count a
  positive whole number.
# Each refusal: its code, its step, and its subject (a tool's file and field, or a port).
