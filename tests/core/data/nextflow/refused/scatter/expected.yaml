why: A scatter names one input or more, over two with a method of CWL's three, and a method needs a scatter; a scattered
  input's source is one array of values its tool declares; a nested crossproduct reaches workflow outputs only; a
  workflow's requirements are a mapping or list, each consumed or refused naming itself at the steps that inherit it.
# Each refusal: its code, its step, and its subject (a tool's file and field, a port, or a requirement).
