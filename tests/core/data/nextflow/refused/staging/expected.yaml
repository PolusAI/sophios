why: An entry is one input, staged under its own basename or one literal name, copied or not as a literal says; a
  renamed entry is named only by its literal; a plain reference is the object and `.path` is absolute, which neither a
  stream nor a glob takes; nothing writes or globs the link a staged input is under; a Directory and a File are staged
  whole and alone.
# Each refusal: its code, its step, and its subject (a tool's file and field); a staged name the lowering cannot write
# has no subject.
