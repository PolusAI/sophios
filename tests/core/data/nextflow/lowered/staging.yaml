# Staged inputs, entries, references and output captures the target lowers (design §6, Inputs and channels, Basename
# references, Outputs). `lowered` is the replaced test's IR literal in payload form.
- id: every_iwdr_entry_is_one_the_task_makes-a-bare-reference
  why: &entries 'design §6, Inputs and channels: under its own basename or a literal name, linked or copied.'
  tool: &stage {inputs: {source: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
         out.txt}}}, arguments: [cat, renamed.txt], stdout: out.txt, requirements: {InitialWorkDirRequirement: {listing:
         [$(inputs.source)]}}}
  out: &out [result]
  job: &in_txt {source: {class: File, path: in.txt}}
  lowered: &linked {processes: [{inputs: [{entry: {name: null, copy: false}}]}]}
- {id: every_iwdr_entry_is_one_the_task_makes-tool_builder-stage, why: *entries, out: *out, job: *in_txt, lowered:
   *linked, tool: {<<: *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source), entryname:
   $(inputs.source.basename)}]}}}}
- {id: every_iwdr_entry_is_one_the_task_makes-not-writable, why: *entries, out: *out, job: *in_txt, lowered: *linked,
   tool: {<<: *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source), writable:
   false}]}}}}
- {id: every_iwdr_entry_is_one_the_task_makes-the-image-workflows-plugins-outDir, why: *entries, out: *out, job:
   *in_txt, tool: {<<: *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source), writable:
   true}]}}}, lowered: &copied {processes: [{inputs: [{entry: {name: null, copy: true}}]}]}}
- {id: every_iwdr_entry_is_one_the_task_makes-renamed, why: *entries, out: *out, job: *in_txt, tool: {<<: *stage,
   requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source), entryname: renamed.txt}]}}}, lowered:
   {processes: [{inputs: [{entry: {name: renamed.txt, copy: false}}]}]}}
- {id: every_iwdr_entry_is_one_the_task_makes-renamed-writable, why: *entries, out: *out, job: *in_txt, tool: {<<:
   *stage, requirements: {InitialWorkDirRequirement: {listing: [{entry: $(inputs.source), entryname: reads*.fq,
   writable: true}]}}}, lowered: {processes: [{inputs: [{entry: {name: reads*.fq, copy: true}}]}]}}
- id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source)
  why: &plugin 'The plugin shape: --outDir $(inputs.outDir) and glob: $(inputs.outDir.basename) name the entry.'
  tool: &out_dir {inputs: {source: {type: Directory, inputBinding: {prefix: --outDir}}}, outputs: {result:
         {type: Directory, outputBinding: {glob: $(inputs.source.basename)}}}, requirements: {InitialWorkDirRequirement:
         {listing: [$(inputs.source)]}}, arguments: [$(inputs.source)]}
  out: *out
  job: &out_job {source: {class: Directory, path: out}}
  lowered: *linked
- {id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source.path), why: *plugin, out: *out, job: *out_job,
   lowered: *linked, tool: {<<: *out_dir, arguments: [$(inputs.source.path)]}}
- {id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source.basename), why: *plugin, out: *out, job:
   *out_job, lowered: *linked, tool: {<<: *out_dir, arguments: [$(inputs.source.basename)]}}
- {id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source)-writable, why: *plugin, out: *out, job:
   *out_job, lowered: *copied, tool: {<<: *out_dir, requirements: &writable_source {InitialWorkDirRequirement: {listing:
   [{entry: $(inputs.source), writable: true}]}}}}
- {id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source.path)-writable, why: *plugin, out: *out, job:
   *out_job, lowered: *copied, tool: {<<: *out_dir, requirements: *writable_source, arguments: [$(inputs.source.path)]}}
- {id: an_entry_under_its_own_basename_may_be_referenced-$(inputs.source.basename)-writable, why: *plugin, out: *out,
   job: *out_job, lowered: *copied, tool: {<<: *out_dir, requirements: *writable_source, arguments:
   [$(inputs.source.basename)]}}
- id: a_reference_where_it_stands-glob-File-$(inputs.f.basename).out
  why: &stands 'design §6, Basename references: a basename names a new file a glob collects, an entry is under the
    output directory, and stdin reads a staged File by its whole `.path`. Each case is a cell of cwltool''s own run of
    the tool.'
  tool: &ref {inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob:
         $(inputs.f.basename).out}}}}
  out: *out
  job: &f {f: {class: File, path: in}}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f.basename)-linked, why: *stands, out: *out, job: *f, tool: {<<:
   *ref, outputs: {result: {type: File, outputBinding: {glob: $(inputs.f.basename)}}}, requirements: &linked_f {
   InitialWorkDirRequirement: {listing: [$(inputs.f)]}}}}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f.basename)/keep.txt-linked, why: *stands, out: *out, job: &d
   {f: {class: Directory, path: in}}, tool: {inputs: {f: {type: Directory}}, outputs: {result: {type:
   Directory, outputBinding: {glob: $(inputs.f.basename)/keep.txt}}}, requirements: *linked_f}}
- {id: a_reference_where_it_stands-glob-Directory-$(inputs.f.path)-writable, why: *stands, out: *out, job: *d, tool: {
   inputs: {f: {type: Directory}}, outputs: {result: {type: Directory,
       outputBinding: {glob: $(inputs.f.path)}}},
   requirements: &writable_f {InitialWorkDirRequirement: {listing: [{entry: $(inputs.f), writable: true}]}}}}
- {id: a_reference_where_it_stands-glob-File-$(inputs.f.path).out-linked, why: *stands, out: *out, job: *f, tool: {<<:
   *ref, outputs: {result: {type: File, outputBinding: {glob: $(inputs.f.path).out}}}, requirements: *linked_f}}
- {id: a_reference_where_it_stands-stdin-File-$(inputs.f.path), why: *stands, out: *out, job: *f,
    tool: &stream {inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob: done.txt}}}, stdin:
   $(inputs.f.path)}}
- {id: a_reference_where_it_stands-stdout-File-$(inputs.f.basename).log, why: *stands, out: *out, job: *f, tool:
   {inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob: done.txt}}}, stdout:
   $(inputs.f.basename).log}}
- {id: a_reference_where_it_stands-stdout-File-$(inputs.f.basename)-writable, why: *stands, out: *out, job: *f, tool: {
   inputs: {f: {type: File}}, outputs: {result: {type: File, outputBinding: {glob: done.txt}}}, stdout:
   $(inputs.f.basename), requirements: *writable_f}}
- id: an_output_whose_name_no_link_is_known_to_share-another-name
  why: &no_link A copy is the task's own; a workflow input's or a pattern's name is known only when the task runs; a
    glob collects an entry, which cwltool stages in the output directory as well.
  workflow: &chain {steps: [{id: EMIT, out: [out]}, {id: SORT, in: {src: EMIT/out}, out: [out]}], inputs: {given: {type:
             File}}}
  tools: [&emitted {id: EMIT, outputs: {out: {type: File, outputBinding: {glob: emitted.txt}}}, stdout: emitted.txt},
          &sort {id: SORT, inputs: {src: {type: File, inputBinding: {position: 1}}}, outputs: {out: {type: File,
          outputBinding: {glob: sorted.txt}}}, stdout: sorted.txt}]
  job: &given {given: {class: File, path: in.txt}}
  lowered: &two {processes: [{}, {}]}
- {id: an_output_whose_name_no_link_is_known_to_share-pattern, why: *no_link, workflow: *chain, job: *given, lowered:
   *two, tools: [{id: EMIT, outputs: {out: {type: File, outputBinding: {glob: '*.txt'}}}, stdout: '*.txt'}, {<<: *sort,
   outputs: {out: {type: File, outputBinding: {glob: '*.txt'}}}}]}
- {id: an_output_whose_name_no_link_is_known_to_share-workflow-input, why: *no_link, job: *given, lowered: *two, tools:
   [&sorted {id: EMIT, outputs: {out: {type: File, outputBinding: {glob: sorted.txt}}}, stdout: sorted.txt}, *sort],
   workflow: &from_given {<<: *chain, steps: [{id: EMIT, out: [out]}, {id: SORT, in: {src: given}, out: [out]}]}}
- {id: an_output_whose_name_no_link_is_known_to_share-writable-entry, why: *no_link, workflow: *chain, job: *given,
   lowered: *two, tools: [*sorted, {<<: *sort, inputs: {src: {type: File}}, requirements: {InitialWorkDirRequirement:
   {listing: [{entry: $(inputs.src), writable: true}]}}}]}
- {id: an_output_whose_name_no_link_is_known_to_share-glob-collects-a-renamed-entry, why: *no_link, workflow: *chain,
   job: *given, lowered: *two, tools: [*emitted, &renamed {id: SORT, inputs: {src: {type: File}}, outputs: {out: {type:
   File, outputBinding: {glob: sorted.txt}}}, arguments: [-o, sorted.txt], requirements: {InitialWorkDirRequirement:
   {listing: [{entry: $(inputs.src), entryname: sorted.txt}]}}}]}
- {id: an_output_whose_name_no_link_is_known_to_share-glob-collects-a-renamed-workflow-input, why: *no_link, workflow:
   *from_given, job: *given, lowered: *two, tools: [*emitted, *renamed]}
- {id: an_output_whose_name_no_link_is_known_to_share-glob-collects-an-entry-under-its-basename, why: *no_link,
   workflow: *chain, job: *given, lowered: *two, tools: [*sorted,
       {<<: *renamed, requirements: {InitialWorkDirRequirement:
   {listing: [{entry: $(inputs.src)}]}}}]}
- id: the_admitted_cardinality_declaration_lowers_to_a_capture_marker
  why: &capture An admitted outputEval lowers to its capture marker.
  tool: &make {inputs: {message: {type: string, inputBinding: {position: 1}}}, outputs: {result: {type: File,
         outputBinding: {glob: out.txt, outputEval: '$(self[0])'}}}}
  out: *out
  job: &hi {message: hi}
  lowered: &single {processes: [{outputs: [{name: result, qualifier: path, capture: single}]}]}
- {id: surrounding_whitespace_is_trimmed-newline, why: Surrounding whitespace is trimmed., out: *out, job: *hi, lowered:
   *single, tool: {<<: *make, outputs: {result: {type: File,
       outputBinding: {glob: out.txt, outputEval: " $(self[0])\n"}}}}}
- {id: surrounding_whitespace_is_trimmed-tab, why: Surrounding whitespace is trimmed., out: *out, job: *hi, lowered:
   *single, tool: {<<: *make, outputs: {result: {type: File, outputBinding: {glob: out.txt, outputEval: "\t$(self[0])
   "}}}}}
- {id: a_declared_but_unused_inline_javascript_requirement_stays_legal, why: 'The requirement is a declaration; the
   violation is a non-admitted form.', out: *out, job: *hi, lowered: *single, tool: {<<: *make, requirements:
   {InlineJavascriptRequirement: {}}}}
- {id: the_admitted_file_text_capture_lowers_to_a_value_port, why: *capture, out: *out, job: *hi, tool: {<<: *make,
   outputs: {result: {type: string, outputBinding: {glob: out.txt, loadContents: true, outputEval:
   '$(self[0].contents)'}}}}, lowered: {processes: [{outputs: [{name: result, qualifier: val, capture: text}]}]}}
- {id: an_optional_output_with_a_pattern_glob_reaching_a_workflow_output, why: An optional output of a pattern glob is
   checked at its workflow output., out: [o], tool: {baseCommand: 'true', outputs: {o: {type: 'File?',
   outputBinding: {glob: '*.log'}}}}, lowered: {processes: [{outputs: [{optional: true}]}]}}
