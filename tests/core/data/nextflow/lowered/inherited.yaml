# Requirements and hints a tool inherits (resolved-view design §8): for each class the tool's own requirement, else the
# innermost inherited requirement, else its own hint, else the innermost inherited hint.
- id: a_tools_own_requirement_beats_an_inherited_hint
  why: The tool's requirement comes after what it inherits, and a lookup takes the last requirement first.
  workflow: {steps: [{id: SAY}], hints: {DockerRequirement: {dockerPull: 'workflow/image'}}}
  tools: [&say {id: SAY, baseCommand: [echo, hi], requirements: {DockerRequirement: {dockerPull: 'tool/image'}}}]
  render: ["    container 'tool/image'\n"]
- id: an_inherited_requirement_beats_a_tools_own_hint
  why: Any requirement beats any hint.
  workflow: {steps: [{id: SAY}], requirements: {DockerRequirement: {dockerPull: 'workflow/image'}}}
  tools: [{<<: *say, requirements: {}, hints: {DockerRequirement: {dockerPull: 'tool/image'}}}]
  render: ["    container 'workflow/image'\n"]
- id: the_innermost_inherited_requirement_wins
  why: A step's requirement inside a nested workflow comes after the root's, so it is the one the tool reads.
  workflow: {steps: [{id: child.wic, subtree: {steps: [{id: SAY, requirements: {ResourceRequirement: {coresMin: 2}}}]}}],
    requirements: {ResourceRequirement: {coresMin: 1}}}
  tools: [{<<: *say, requirements: {}}]
  render: ["    cpus 2\n"]
- id: an_environment_variable_inherited_from_the_root
  why: An inherited entry lowers as the same entry written on the tool.
  workflow: {steps: [{id: SAY}], requirements: {EnvVarRequirement: {envDef: {GREETING: hello}}}}
  tools: [{<<: *say, requirements: {}}]
  render: ["export GREETING=${__sophios_shell_quote_9f72e('hello')}\n"]
