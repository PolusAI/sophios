# Every output of workflow.wic, by step and port, in the order of its steps.
outputs:
  touch_file~result: {class: File, basename: message.txt, contents: ""}
  copy_file~result: {class: File, basename: copy.txt, contents: ""}
  emit~stdout: {class: File, basename: stdout, contents: "mixed construction, one backend\n"}
  copy_emitted~result: {class: File, basename: copy.txt, contents: "mixed construction, one backend\n"}
  count_bytes~result: {class: File, basename: count.txt, contents: "32\n"}
  three_words~stdout: {class: File, basename: stdout, contents: "spaces remain one argument\n"}
  a_dollar~stdout: {class: File, basename: stdout, contents: "a literal costs $5\n"}
  an_ampersand~stdout: {class: File, basename: stdout, contents: "literal && text is not shell syntax\n"}
  append~file: {class: File, basename: greeting.txt,
    contents: "first line\nHello;  it's $(echo substituted) * a\\tb\\nc 100%s\n"}
  shell_redirect~result: {class: File, basename: redirected.txt, contents: "payload; not a separate command"}
  three_commands~result: {class: File, basename: out.txt, contents: "first\nsecond\n"}
  three_commands~errors: {class: File, basename: err.txt, contents: "third\n"}
  print_bindings~result: {class: File, basename: bindings.txt,
    contents: "hello  there\n-v\n--ratio\n0.5\n1.25\n--tag\na b\n--label=x\n2.5\n"}
  produce~result: {class: File, basename: data.txt, contents: fanout}
  read_once~result: {class: File, basename: read.txt, contents: fanout}
  read_again~result: {class: File, basename: read.txt, contents: fanout}
