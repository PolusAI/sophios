- id: a contributed bare name
  why: *surfaces
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: shared.txt\nsteps:\n- id: child.wic\n"
