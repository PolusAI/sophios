- id: a contributed untagged mapping
  why: *surfaces
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: {a: 1}\nsteps:\n- id: child.wic\n"
  children: *mk
  expect: [{depth: 1, inputs: {name: [InlineLiteral, {a: 1}]}}]
- id: a contributed out replaces the step's own sequence
  why: "`out:` is a sequence, and a sequence the contributor supplies replaces. Merging the two instead would keep an
      edge definition the contributor deliberately removed, and define it twice wherever the contributor put its own
      back."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            out:\n            - file\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n  out:\n  - file: !& its_own_edge\n"}
  expect: [{depth: 1, outputs: [[file, null]]}]
- id: a contribution merges with the child's own body for the same step
  why: "Both bodies address `(1, xform)`; neither replaces the other wholesale. A subworkflow that already parameterises
      one of its own steps is the ordinary case -- `cg.wic` does -- so a contribution that overwrote the whole `(N,
      name)` body would delete whatever the child had written there, and one that overwrote the whole `in:` would delete
      the bindings it does not itself mention."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      xform):\n            in:\n              name: !ii contributed.txt\nsteps:\n- id: child.wic\n"
  children: {child: "\nwic:\n  steps:\n    (1, xform):\n      in:\n        file: !* upstream\n      out:\n      - file:
      !& its_own_edge\nsteps:\n- id: xform\n"}
  expect: [{depth: 1, inputs: {file: [EdgeRef, upstream], name: [InlineLiteral, contributed.txt]},
      outputs: [[file, its_own_edge]]}]
- id: an id-keyed contribution reaches the one step with that id
  why: A parent contributes to the one step with that id by its bare id.
  root: "\nwic:\n  steps:\n    (1,
      child.wic):\n      wic:\n        steps:\n          mk_file:\n            in:\n              name: !ii
      from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_root.txt]}}]
  stderr: []
- id: an id-keyed entry for a repeated id is named on stderr and ignored
  why: A bare id naming several steps is reported and ignored.
  root: "wic:\n  steps:\n    mk_file:\n      in:\n        name: !ii x.txt\nsteps:\n- id: mk_file\n- id: mk_file\n"
  expect: [{inputs: {exact: {}}}, {step: 1, inputs: {exact: {}}}]
  stderr: ["Warning! root.wic: wic: steps: key mk_file addresses no step of 'root': 'mk_file' names 2 steps; write
      (index, mk_file). The key is ignored."]
- id: a positional key wins over an id key for the same step
  why: Within one sidecar a positional key wins over a bare id for the same step.
  root: "wic:\n  steps:\n    mk_file:\n      in:\n        name: !ii by_id.txt\n    (1,
      mk_file):\n      in:\n        name: !ii by_position.txt\nsteps:\n- id: mk_file\n"
  expect: [{inputs: {name: [InlineLiteral, by_position.txt]}}]
- id: a stale key is named once however many steps call the workflow
  why: A stale key is reported once however many steps call the workflow.
  root: "steps:\n- id: child.wic\n- id: child.wic\n"
  children: {child: "wic:\n  steps:\n    (2, mk_file): {}\nsteps:\n- id: mk_file\n"}
  expect: []
  stderr: [{startswith: "Warning! "}]
- id: an id key from the parent merges over the child's positional entry
  why: The calling step's contribution wins whichever spelling each side uses.
  root: "\nwic:\n  steps:\n    (1,
      child.wic):\n      wic:\n        steps:\n          mk_file:\n            in:\n              name: !ii
      from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "\nwic:\n  steps:\n    (1, mk_file):\n      wic:\n        graphviz:\n          label: a
      label\nsteps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_root.txt]}}]
  stderr: []
- id: an id key from the parent wins when the child has both spellings
  why: The contribution wins over a child that spells the same step both ways.
  root: "\nwic:\n  steps:\n    (1,
      child.wic):\n      wic:\n        steps:\n          mk_file:\n            in:\n              name: !ii
      from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "wic:\n  steps:\n    mk_file:\n      in:\n        other: !ii o\n    (1,
      mk_file):\n      in:\n        name: !ii child_pos.txt\nsteps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_root.txt], other: [InlineLiteral, o]}}]
- id: a positional key from the parent merges over the child's id entry
  why: "The parent's (index, id) contribution overrides the child's own bare-id entry."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: !ii from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "\nwic:\n  steps:\n    mk_file:\n      in:\n        name: !ii child_own.txt\nsteps:\n- id:
      mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_root.txt]}}]
- id: a stale positional key from the parent does not swallow the child's id entry
  why: A parent key that addresses no step leaves the child's valid bare-id entry alone.
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (2,
      mk_file):\n            in:\n              name: !ii from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "wic:\n  steps:\n    mk_file:\n      in:\n        name: !ii child_own.txt\nsteps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, child_own.txt]}}]
- id: a stale positional key in the child does not swallow the parent's id contribution
  why: A child key that addresses no step leaves the parent's valid bare-id contribution alone.
  root: "\nwic:\n  steps:\n    (1,
      child.wic):\n      wic:\n        steps:\n          mk_file:\n            in:\n              name: !ii
      from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "wic:\n  steps:\n    (2, mk_file):\n      in:\n        name: !ii child_stale.txt\nsteps:\n- id:
      mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_root.txt]}}]
- id: an id key and a positional key for the same step merge in one sidecar
  why: "Fields only the bare entry sets survive; the positional entry wins where both set one."
  root: "wic:\n  steps:\n    mk_file:\n      in:\n        a: !ii x.txt\n    (1, mk_file):\n      in:\n        b: !ii
      y.txt\nsteps:\n- id: mk_file\n"
  expect: [{inputs: {a: [InlineLiteral, x.txt], b: [InlineLiteral, y.txt]}}]
- id: a stale child id entry does not pair with the parent's positional key
  why: "A child bare id naming two steps addresses none, so it is not merged under the parent's (1, id) key."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: !ii from_root.txt\nsteps:\n- id: child.wic\n"
  children: {child: "wic:\n  steps:\n    mk_file:\n      in:\n        extra: !ii stale_child.txt\nsteps:\n- id:
      mk_file\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {exact: {name: [InlineLiteral, from_root.txt]}}}]
