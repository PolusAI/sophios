- id: a contributed input reaches a step of a called subworkflow
  why: "An `in:` written at a distance binds that step's input in the child."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: !ii contributed.txt\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, contributed.txt]}}]
- id: a contributed output defines an edge on a nested step
  why: "`out:` carries `!&` to a step two subworkflows down, as `basic.wic` does. The definition exists nowhere else:
      writing it in the child would define it twice when that child is called from a second root, which is the whole
      reason the corpus places it from above."
  root: "\nwic:\n  steps:\n    (1, min.wic):\n      wic:\n        steps:\n          (1,
      cg.wic):\n            wic:\n              steps:\n                (1,
      mk_file):\n                  out:\n                  - file: !& min.tpr\nsteps:\n- id: min.wic\n"
  children: {min: "steps:\n- id: cg.wic\n", cg: "steps:\n- id: mk_file\n  in:\n    name: !ii min.tpr\n"}
  expect: [{depth: 2, outputs: [[file, min.tpr]]}]
- id: a bare wic body only recurses until it reaches a payload
  why: "Three nested `wic:` bodies carry nothing themselves; the fourth binds."
  root: "\nwic:\n  steps:\n    (1, a.wic):\n      wic:\n        steps:\n          (1,
      b.wic):\n            wic:\n              steps:\n                (1,
      c.wic):\n                  wic:\n                    steps:\n                      (1,
      mk_file):\n                        in:\n                          name: !* deep.txt\nsteps:\n- id: a.wic\n"
  children: {a: "steps:\n- id: b.wic\n", b: "steps:\n- id: c.wic\n", c: "steps:\n- id: mk_file\n"}
  expect: [{depth: 3, inputs: {name: [EdgeRef, deep.txt]}}]
- id: a contributed value wins over the child's own
  why: "Overriding is the point of parameter passing: the contributor wins."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: !ii from_the_parent.txt\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n  in:\n    name: !ii its_own.txt\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, from_the_parent.txt]}}]
- id: a contribution whose key does not match its step is named on stderr
  why: "`(N, name)` addresses one step, so half a match is no match: the key is ignored, and each such key is named once
      on stderr."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (2,
      mk_file):\n            in:\n              name: !ii wrong_index.txt\n          (1,
      mk_text):\n            in:\n              name: !ii wrong_name.txt\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n  in:\n    name: !ii its_own.txt\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, its_own.txt]}}]
  stderr: ["Warning! root.wic: wic: steps: key (2, mk_file) addresses no step of 'child': there is no step 2; the
      document has 1 step. The key is ignored.", "Warning! root.wic: wic: steps: key (1, mk_text) addresses no step
      of 'child': step 1 is 'mk_file'; write (1, mk_file). The key is ignored."]
- id: a contribution to a wic step addresses the subworkflow not the call
  why: "A `.wic` step's body names steps inside it; nothing lands on the call site."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      in:\n        name: !ii
      never_bound_here.txt\n      wic:\n        steps:\n          (1, mk_file):\n            in:\n              name:
      !ii contributed.txt\nsteps:\n- id: child.wic\n"
  children: {child: "steps:\n- id: mk_file\n"}
  expect: [{inputs: {exact: {}}}, {depth: 1, inputs: {name: [InlineLiteral, contributed.txt]}}]
- id: "a contributed literal, tagged"
  why: &surfaces "A contribution is opaque content, where each construct has two spellings. The tagged one is what a
      human writes and the desugared one is what the Python API and `render` emit, so a contribution that only
      understood tags would apply to a hand-written document and vanish from a round-tripped one."
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: !ii shared.txt\nsteps:\n- id: child.wic\n"
  children: &mk {child: "steps:\n- id: mk_file\n"}
  expect: [{depth: 1, inputs: {name: [InlineLiteral, shared.txt]}}]
- id: "a contributed literal, desugared"
  why: *surfaces
  root: "\nwic:\n  steps:\n    (1, child.wic):\n      wic:\n        steps:\n          (1,
      mk_file):\n            in:\n              name: {wic_inline_input: shared.txt}\nsteps:\n- id: child.wic\n"
  children: *mk
  expect: [{depth: 1, inputs: {name: [InlineLiteral, shared.txt]}}]
- id: "a contributed edge reference, tagged"
