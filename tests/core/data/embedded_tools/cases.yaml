# A tool, whole, as `--cwl_inline_runtag` embeds it, and the keys of the embedded `run:` it must write, or the refusal.
# Expected by hand from CWL v1.0 -> v1.1 as cwltool's updater (cwltool/update.py, v1_0to1_1) applies it to a file it
# loads.
- {id: v1.0-gets-what-v1.0-implied, tool: {cwlVersion: v1.0, hints: {}},
    why: 'cwltool gives a v1.0 file network access and a deep listing',
   embedded: {hints: {LoadListingRequirement: {loadListing: deep_listing}, NetworkAccess: {networkAccess: true}}}}
- {id: v1.0-without-hints, tool: {cwlVersion: v1.0}, why: 'no hints key is the usual case, not an exception',
   embedded: {hints: {LoadListingRequirement: {loadListing: deep_listing}, NetworkAccess: {networkAccess: true}}}}
- {id: v1.1-gains-nothing, tool: {cwlVersion: v1.1, hints: {ResourceRequirement: {ramMin: 8}}},
    why: 'only v1.0 implied anything',
   embedded: {hints: {ResourceRequirement: {ramMin: 8}}}}
- {id: v1.2-gains-nothing, tool: {cwlVersion: v1.2, hints: {ResourceRequirement: {ramMin: 8}}},
    why: 'only v1.0 implied anything',
   embedded: {hints: {ResourceRequirement: {ramMin: 8}}}}
- {id: a-declared-hint-wins, tool: {cwlVersion: v1.0, hints: {NetworkAccess: {networkAccess: false}}},
    why: 'what the tool wrote wins',
   embedded: {hints: {LoadListingRequirement: {loadListing: deep_listing}, NetworkAccess: {networkAccess: false}}}}
- {id: a-declared-requirement-wins, why: 'in whichever form it wrote it', tool: {cwlVersion: v1.0, hints: {},
   requirements: {LoadListingRequirement: {loadListing: no_listing}}},
       embedded: {hints: {NetworkAccess: {networkAccess: true}}}}
- {id: a-listed-requirement-wins, why: 'in whichever form it wrote it', tool: {cwlVersion: v1.0, hints: {},
   requirements: [{class: NetworkAccess, networkAccess: false}]},
       embedded: {hints: {LoadListingRequirement: {loadListing: deep_listing}}}}
- {id: hints-as-a-list, why: 'a packed tool writes its hints as a list of {class} entries', tool: {cwlVersion: v1.0,
   hints: [{class: ResourceRequirement, ramMin: 8}]}, embedded: {hints: [{class: LoadListingRequirement,
       loadListing: deep_listing},
   {class: NetworkAccess, networkAccess: true}, {class: ResourceRequirement, ramMin: 8}]}}
- {id: cwltool-prefix, why: 'cwltool renames the namespaced class; embedded, nothing does',
    tool: {cwlVersion: v1.0, hints: {
   'cwltool:LoadListingRequirement': {loadListing: shallow_listing}, 'cwltool:NetworkAccess': {networkAccess: false}}},
   embedded: {hints: {LoadListingRequirement: {loadListing: shallow_listing}, NetworkAccess: {networkAccess: false}}}}
- {id: cwltool-uri, why: 'cwltool renames the namespaced class; embedded, nothing does',
    tool: {cwlVersion: v1.0, hints: {
   'http://commonwl.org/cwltool#LoadListingRequirement': {loadListing: shallow_listing},
   'http://commonwl.org/cwltool#NetworkAccess': {networkAccess: false}}},
   embedded: {hints: {LoadListingRequirement: {loadListing: shallow_listing}, NetworkAccess: {networkAccess: false}}}}
- {id: cwltool-prefix-listed, why: 'renamed in the list form too', tool: {cwlVersion: v1.0,
   hints: [{class: 'cwltool:LoadListingRequirement', loadListing: no_listing}],
       requirements: [{class: 'cwltool:NetworkAccess', networkAccess: true}]},
   embedded: {hints: [{class: LoadListingRequirement, loadListing: no_listing}],
       requirements: [{class: NetworkAccess, networkAccess: true}]}}
- {id: cwltool-uri-listed, why: 'renamed in the list form too', tool: {cwlVersion: v1.0,
   hints: [{class: 'http://commonwl.org/cwltool#LoadListingRequirement', loadListing: no_listing}],
   requirements: [{class: 'http://commonwl.org/cwltool#NetworkAccess', networkAccess: true}]},
   embedded: {hints: [{class: LoadListingRequirement, loadListing: no_listing}],
       requirements: [{class: NetworkAccess, networkAccess: true}]}}
- {id: one-secondary-file-pattern, why: "cwltool's v1.0 updater lists a single pattern, and its checker indexes the
    list",
   tool: {cwlVersion: v1.0, inputs: {name: {type: File, secondaryFiles: {pattern: .fai}},
       other: {type: File, secondaryFiles: [.crai, .csi]},
   plain: string}, outputs: {file: {type: File, secondaryFiles: .bai}}},
       embedded: {inputs: {name: {type: File, secondaryFiles: [{pattern: .fai}]},
   other: {type: File, secondaryFiles: [.crai, .csi]}, plain: string},
       outputs: {file: {type: File, secondaryFiles: [.bai]}}}}
- {id: one-secondary-file-pattern-on-listed-ports, why: 'the same for ports written as lists', tool: {cwlVersion: v1.0,
   inputs: [{id: name, type: File, secondaryFiles: .fai}], outputs: [{id: file, type: File, secondaryFiles: .bai}]},
   embedded: {inputs: [{id: name, type: File, secondaryFiles: [.fai]}],
       outputs: [{id: file, type: File, secondaryFiles: [.bai]}]}}
- {id: a-version-sophios-does-not-run, tool: {cwlVersion: v1.3.0-dev1}, says: "declares cwlVersion 'v1.3.0-dev1'",
   why: 'embedding would otherwise guess what a version Sophios has never seen implied'}
- {id: no-version, tool: {class: CommandLineTool}, says: declares no cwlVersion,
    why: 'the message does not claim it declared one'}
