# What the CI lanes on the self-hosted runner (Run Workflows, its weekly lane
# and the benchmarks) install, fresh on every job: system_deps.yml without
# graphviz, which only drawing needs and which brings in more than half of its
# packages, and without the tools nothing in these lanes runs, plus Nextflow.
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - "python>=3.11"
# The same pin as system_deps.yml, for the reason given there.
  - nodejs=26
# Tools without a container run these on the host (wget_xlsx.cwl, zip_top.cwl).
  - wget
  - zip
# Binary packages taken from conda rather than pip, as in system_deps.yml.
  - scipy
  - numpy
  - pandas
  - psutil
  - ruamel.yaml.clib
  - cryptography
  - zstandard
# Run Workflows runs the corpus under Nextflow on a push, with the Nextflow and
# the Java the Nextflow lane pins (NXF_VER and java-version in nextflow.yml).
# The package runs its own jar, so nothing it needs lives outside this
# environment.
  - nextflow=26.04.2
  - openjdk=17
